<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcreFit Farmer — Planting & Performance</title>
<style>
:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d;--lime:#dff2e5;--warn:#fff3d8;--bad:#fde8e7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--dark);padding:22px 18px;color:#fff}.side img{height:45px;max-width:210px}.side a{display:block;color:#dce8df;text-decoration:none;padding:10px 11px;border-radius:9px;margin-top:7px}.side a.active,.side a:hover{background:#1d4b33}.main{padding:28px 32px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,1fr);margin:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.metric{font-size:27px;font-weight:900}.muted{color:var(--muted)}.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.secondary{background:#eaf2ed;color:#17452d}.input,.select{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.tag{display:inline-block;border-radius:999px;padding:4px 7px;font-size:11px;font-weight:800;background:var(--lime)}.up{color:#1f6f43;font-weight:900}.down{color:#9a3f37;font-weight:900}.drop{border:2px dashed #c9d7cc;border-radius:14px;padding:18px;background:#fbfdfb}.drop input{width:100%}.receipt{padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.cards{grid-template-columns:1fr}}
</style><link rel="icon" href="/acrefit-icon.svg"></head>
<body><div class="app"><aside class="side"><img src="/acrefit-farmer-logo-light.svg" alt="AcreFit Farmer"><div style="margin-top:22px">
<a href="/farmer-dashboard.html">Farm Overview</a>
<a id="ffFields" href="/farmer-fields.html">Fields & Mapping</a>
<a id="ffAnalysis" href="/farmer-field-analysis.html">Field Analysis</a>
<a id="ffPlan" href="/farmer-plan.html">Annual Crop Plan</a>
<a class="active" href="/farmer-history.html">Planting & Performance</a>
<a id="ffGenetics" href="/farmer-genetics.html">Seed Genetics</a>
<a href="/farmer-data.html">Farm Data Hub</a></div>
<button class="btn secondary" style="margin-top:26px;width:100%" onclick="logout()">Sign Out</button></aside><main class="main"><div id="content"><div class="card">Loading farm history…</div></div></main></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let dash=null, farmId=null, data=null;
async function api(p,o={}){const r=await fetch(p,o);let d={};try{d=await r.json()}catch{}if(r.status===401){location='/farmer-login.html';throw Error('Sign in required')}if(!r.ok)throw Error(d.detail||'Request failed');return d}
function yieldChange(row){if(row.yield_change_pct==null)return '<span class="muted">—</span>';const n=Number(row.yield_change_pct);return '<span class="'+(n>=0?'up':'down')+'">'+(n>0?'+':'')+n.toFixed(1)+'%</span>'}
function seedName(row){return [row.seed_brand,row.seed_product_name].filter(Boolean).join(' ')||'Not recorded'}
function render(){
 const farms=dash?.farms||[], h=data?.history||[], receipts=data?.receipts||[];
 const years=[...new Set(h.map(x=>x.crop_year).filter(Boolean))];
 const avg=h.filter(x=>x.yield_value!=null); const avgYield=avg.length?(avg.reduce((a,b)=>a+Number(b.yield_value),0)/avg.length).toFixed(1):'—';
 const seeded=h.filter(x=>x.seed_product_name).length;
 document.getElementById('content').innerHTML=`
 <div class="row"><div><div class="muted">PLANTING HISTORY</div><h1 style="margin:4px 0">Genetics Performance</h1><div class="muted">Track what was planted, what it yielded, and whether genetics are improving field performance.</div></div>
 <select class="select" onchange="farmId=Number(this.value);loadFarm()">${farms.map(f=>`<option value="${f.id}" ${Number(f.id)===Number(farmId)?'selected':''}>${esc(f.farm_name||f.producer_name||'Farm')}</option>`).join('')}</select></div>
 <div class="grid cards"><div class="card"><div class="muted">History Years</div><div class="metric">${years.length}</div></div><div class="card"><div class="muted">Yield Records</div><div class="metric">${h.length}</div></div><div class="card"><div class="muted">Avg Recorded Yield</div><div class="metric">${avgYield}</div></div><div class="card"><div class="muted">Records w/ Genetics</div><div class="metric">${seeded}</div></div></div>
 <div class="grid" style="grid-template-columns:minmax(0,1.7fr) minmax(300px,.7fr)">
 <div class="card"><div class="row"><div><h2 style="margin:0">Field-by-Field History</h2><div class="muted" style="font-size:12px">Seed variety links to the annual AcreFit crop plan when available.</div></div></div>
 <div style="overflow:auto;margin-top:10px"><table class="table"><thead><tr><th>Year</th><th>Field</th><th>Crop</th><th>Acres</th><th>Genetics</th><th>RM</th><th>Yield</th><th>Vs Prior</th><th>APH</th></tr></thead><tbody>
 ${h.length?h.map(r=>`<tr><td><b>${esc(r.crop_year||'—')}</b></td><td>${esc(r.field_name||'Unassigned')}</td><td>${esc(r.crop||'—')}</td><td>${r.planted_acres==null?'—':Number(r.planted_acres).toLocaleString()}</td><td>${esc(seedName(r))}</td><td>${r.relative_maturity==null?'—':esc(r.relative_maturity)}</td><td><b>${r.yield_value==null?'—':Number(r.yield_value).toFixed(1)}</b></td><td>${yieldChange(r)}</td><td>${r.approved_yield==null?'—':Number(r.approved_yield).toFixed(1)}</td></tr>`).join(''):'<tr><td colspan="9" class="muted">No production history loaded yet. Upload APH annually and AcreFit Farmer will build the longitudinal record.</td></tr>'}
 </tbody></table></div></div>
 <div><div class="card"><h2 style="margin-top:0">Seed Receipt Upload</h2><div class="muted" style="font-size:12px;margin-bottom:12px">Attach seed receipts to this farm for the season record. PDF, CSV, or XLSX works today.</div><form id="receiptForm" class="drop"><input id="receiptFile" type="file" accept=".pdf,.csv,.xlsx,.xlsm,.txt" required><button class="btn" style="margin-top:12px" type="submit">Upload Receipt</button><div id="uploadMsg" class="muted" style="font-size:12px;margin-top:8px"></div></form></div>
 <div class="card" style="margin-top:14px"><h3 style="margin-top:0">Receipt Archive</h3>${receipts.length?receipts.map(r=>`<div class="receipt"><b>${esc(r.original_name)}</b><div class="muted" style="font-size:11px">${esc(r.uploaded_at||'')} • ${esc(r.status||'stored')}</div></div>`).join(''):'<div class="muted">No seed receipts uploaded yet.</div>'}</div></div></div>`;
 document.getElementById('receiptForm').onsubmit=uploadReceipt;
}
async function uploadReceipt(e){e.preventDefault();const f=document.getElementById('receiptFile').files[0];if(!f)return;const m=document.getElementById('uploadMsg');m.textContent='Uploading…';const fd=new FormData();fd.append('file',f);fd.append('document_type','SEED_RECEIPT');fd.append('target_farm_id',String(farmId));try{const r=await fetch('/api/documents/upload',{method:'POST',body:fd});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||'Upload failed');m.textContent='Receipt saved to this farm.';await loadFarm()}catch(err){m.textContent=err.message}}
async function loadFarm(){data=await api('/api/farmer/farms/'+farmId+'/history');render()}
function wireHistoryNav(){const f=(dash?.farms||[]).find(x=>Number(x.id)===Number(farmId))||(dash?.farms||[])[0];const pid=Number(f?.prospect_id)||null,yr=new Date().getFullYear()+1;if(pid){document.getElementById('ffFields').href='/farmer-fields.html?id='+pid+'&year='+yr;document.getElementById('ffAnalysis').href='/farmer-field-analysis.html?id='+pid+'&year='+yr;document.getElementById('ffPlan').href='/farmer-plan.html?id='+pid+'&year='+yr;document.getElementById('ffGenetics').href='/farmer-genetics.html?id='+pid+'&year='+yr;}}
async function init(){dash=await api('/api/farmer/dashboard?crop_year='+(new Date().getFullYear()+1));if(!dash.farms?.length){document.getElementById('content').innerHTML='<div class="card">No farms are assigned to this Farmer account.</div>';return}farmId=Number(new URLSearchParams(location.search).get('farm'))||Number(dash.farms[0].id);wireHistoryNav();await loadFarm()}
async function logout(){await api('/api/auth/logout',{method:'POST'}).catch(()=>{});location='/farmer-login.html'}init().catch(e=>document.getElementById('content').innerHTML='<div class="card"><b>Could not load planting history.</b><div class="muted">'+esc(e.message)+'</div></div>')
</script></body></html>
