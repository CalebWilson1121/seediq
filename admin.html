<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcreFit Admin</title><style>body{margin:0;font-family:system-ui;background:#f4f7f2;color:#162319}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#102a1d;color:white;padding:24px}.brand{font-size:26px;font-weight:800}.brand span{color:#8fd39f}.main{padding:28px}.card{background:white;border:1px solid #dfe7df;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{font-size:30px;font-weight:800}.muted{color:#6b776d}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer;background:#1f6f43;color:white}.btn.alt{background:#eaf2ed;color:#17452d}.btn.off{background:#fde8e7;color:#963c39}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #dfe7df;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#6b776d}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{padding:5px 8px;border-radius:999px;font-size:11px;background:#e4f5e9;color:#1c6c3d}.tag.off{background:#fde8e7;color:#963c39}@media(max-width:850px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}</style><link rel="icon" href="/acrefit-icon.svg"></head><body><div class="layout"><aside class="side"><div class="brand"><img src="/acrefit-logo.svg" alt="AcreFit" style="height:42px;width:auto;max-width:195px;display:block"></div><p>Super Admin</p><button id="logout" class="btn alt">Sign out</button></aside><main class="main"><div class="row"><div><h1>Dealer Network</h1><p class="muted">Manage dealer accounts, users, licenses and access.</p></div><div id="who" class="muted"></div></div><div id="stats" class="grid"></div><div class="card"><div class="row"><h2>Dealers</h2><button class="btn alt" onclick="load()">Refresh</button></div><div id="dealers"></div></div><div id="detail"></div></main></div><script>const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function api(u,o={}){const r=await fetch(u,o);let d={};try{d=await r.json()}catch{}if(r.status===401){location='/login.html';throw 0}if(!r.ok)throw Error(d.detail||'Request failed');return d}async function load(){const me=await api('/api/auth/me');if(me.global_role!=='super_admin'){location='/dealer-demo.html';return}who.textContent=me.display_name;const d=await api('/api/admin/overview');stats.innerHTML=`<div class="card"><span class="muted">Dealers</span><div class="metric">${d.totals.dealers}</div></div><div class="card"><span class="muted">Users</span><div class="metric">${d.totals.users}</div></div><div class="card"><span class="muted">Prospects</span><div class="metric">${d.totals.prospects}</div></div><div class="card"><span class="muted">Prospect Acres</span><div class="metric">${Number(d.totals.prospect_acres||0).toLocaleString()}</div></div>`;dealers.innerHTML=`<table><tr><th>Dealer</th><th>Access</th><th>Users</th><th>Farms</th><th>Prospects</th><th>Catalogs</th><th></th></tr>${d.dealers.map(x=>`<tr><td><b>${e(x.name)}</b></td><td><span class="tag ${x.access_enabled?'':'off'}">${x.access_enabled?'Active':'Suspended'}</span></td><td>${x.user_count}</td><td>${x.farm_count}</td><td>${x.prospect_count}</td><td>${x.catalog_count}</td><td><button class="btn alt" onclick="openDealer(${x.id})">Open</button></td></tr>`).join('')}</table>`}async function openDealer(id){const d=await api('/api/admin/dealers/'+id),o=d.dealer;detail.innerHTML=`<div class="card"><div class="row"><div><h2>${e(o.name)}</h2><div class="muted">${e(o.slug)}</div></div><button class="btn ${o.access_enabled?'off':''}" onclick="dealerAccess(${o.id},${!o.access_enabled})">${o.access_enabled?'Suspend dealer':'Restore dealer'}</button></div><h3>Users</h3>${d.users.map(u=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #dfe7df"><div><b>${e(u.display_name)}</b><br><span class="muted">${e(u.email)} · ${e(u.global_role)}</span></div><button class="btn ${u.status==='active'?'off':'alt'}" onclick="userAccess(${u.id},${u.status!=='active'},${o.id})">${u.status==='active'?'Disable':'Enable'}</button></div>`).join('')}<h3>Farms</h3><table><tr><th>Farm</th><th>Producer</th><th>Status</th><th>Acres</th></tr>${d.farms.map(f=>`<tr><td>${e(f.farm_name)}</td><td>${e(f.producer_name||'')}</td><td>${e(f.status||'')}</td><td>${Number(f.total_acres||0).toLocaleString()}</td></tr>`).join('')}</table></div>`}async function dealerAccess(id,enabled){await api('/api/admin/dealers/'+id+'/access',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});await load();await openDealer(id)}async function userAccess(id,enabled,org){await api('/api/admin/users/'+id+'/access',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});await openDealer(org);await load()}logout.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location='/login.html'};load();</script></body></html>
