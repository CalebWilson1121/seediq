<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeedIQ — Prospect Detail</title><style>:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d;--lime:#dff2e5;--warn:#fff5dc}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 18px}.brand{font-size:25px;font-weight:850}.brand span{color:#8fd39f}.subbrand{font-size:12px;color:#a9c1b1;margin-top:4px}nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a:hover,nav a.active{background:#1d4b33}.main{padding:28px 32px}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:24px}.hero p{color:#c9ddcf}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.cols{grid-template-columns:1.1fr .9fr}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.muted{color:var(--muted)}.metric{font-size:28px;font-weight:850}.btn{display:inline-block;border:0;background:var(--green);color:#fff;text-decoration:none;border-radius:10px;padding:9px 12px;font-weight:750;cursor:pointer}.btn.secondary{background:#eaf2ed;color:#17452d}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.5}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.tag{display:inline-block;background:var(--lime);padding:5px 8px;border-radius:999px;font-size:11px;margin:2px 4px 2px 0}.callout{border-left:4px solid var(--green);background:#f5faf6;padding:12px 14px;border-radius:0 10px 10px 0}.callout.warn{border-left-color:#c28a21;background:var(--warn)}.status{font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#eef4f0}.ready{background:#dff2e5;color:#175b35}.select,.input{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.cropBtns{display:flex;gap:5px;flex-wrap:wrap}.upload{border:2px dashed #a9c8b2;border-radius:14px;padding:16px;background:#f8fbf8}.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:900px){.app{grid-template-columns:1fr}.kpis,.cols{grid-template-columns:1fr}.main{padding:18px}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">Seed<span>IQ</span></div><div class="subbrand">Seed Intelligence & Sales Platform</div><nav><a href="index.html">Dashboard</a><a href="prospects.html" class="active">Prospect Intelligence</a><a href="farmers.html">Farmer & Fields</a><a href="field-analysis.html">Field Analysis</a><a href="whole-farm-plan.html">Whole-Farm Plan</a><a href="genetics.html">Seed Genetics</a><a href="data-hub.html">Farm Data Hub</a></nav></aside><main class="main"><div id="content"><div class="card">Loading prospect…</div></div></main></div><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const id=new URLSearchParams(location.search).get('id');let prospect=null,planYear=2027,plans=[];
async function api(path,o={}){const r=await fetch(path,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
async function loadPlans(){const r=await api('/api/farms/'+prospect.farm_id+'/crop-plans?crop_year='+planYear);plans=r.fields||[]}
function cropCell(f){const crop=f.crop||'';return `<div class="cropBtns"><button class="btn small ${crop==='CORN'?'':'secondary'}" onclick="setCrop(${f.field_id},'CORN')">Corn</button><button class="btn small ${crop==='SOYBEANS'?'':'secondary'}" onclick="setCrop(${f.field_id},'SOYBEANS')">Soy</button><button class="btn small secondary" onclick="setCrop(${f.field_id},null)">Clear</button><button class="btn small secondary" onclick="rotateOne(${f.field_id})">Rotate</button></div><div class="muted" style="margin-top:5px">${crop?esc(crop):'Unassigned'}${f.selected_seed_name?' • Seed: '+esc(f.selected_seed_name):''}</div>`}
function render(){const p=prospect,c=p.farm_context||{},fields=c.fields||[],soilRows=((p.soil_status||{}).fields)||[],soilBy={};soilRows.forEach(x=>soilBy[x.field_id]=x);const ready=soilRows.filter(x=>x.soil_status).length;const counties=[...new Set(fields.map(f=>f.county).filter(Boolean))];const planBy={};plans.forEach(x=>planBy[x.field_id]=x);document.getElementById('content').innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div><a href="prospects.html" class="muted" style="text-decoration:none">← Prospects</a><h1>${esc(p.prospect_name)}</h1><div class="muted">${counties.map(esc).join(', ')||'Location pending'} • APH-created prospect</div></div><a class="btn secondary" href="genetics.html">Seed Genetics</a></div><div class="grid kpis"><div class="card"><div class="muted">Fields</div><div class="metric">${fields.length}</div></div><div class="card"><div class="muted">Soil Profiles</div><div class="metric">${ready}/${fields.length}</div></div><div class="card"><div class="muted">Planning Year</div><div class="metric">${planYear}</div></div><div class="card"><div class="muted">Assigned Crops</div><div class="metric">${plans.filter(x=>x.crop).length}/${fields.length}</div></div></div><div class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.06em">PERMANENT FIELD MAP → ANNUAL CROP → SEED</div><h2>MBAR defines the field. Crop and seed change by year.</h2><p>SeedIQ keeps field identity, acreage, geography and soils permanent. Agronomists assign each crop for ${planYear}, rotate Corn ↔ Soybeans with one click, then select seed only for that crop year.</p></div><div class="grid cols" style="margin-top:16px"><div class="card"><h2>1. Add / Update Field Map from MBAR</h2><div class="upload"><input id="mbarFile" type="file" accept=".pdf,.csv,.xlsx,.xlsm,.json"><div class="muted" style="font-size:12px;margin-top:7px">MBAR attaches to this prospect. Structured exports can load FSA farm/tract/field, acres and GeoJSON boundaries now. PDF mapping is the next carrier-specific parser step.</div><button id="mbarBtn" class="btn" style="margin-top:10px" onclick="uploadMBAR()">Upload MBAR</button></div><div id="mbarMsg" class="callout" style="margin-top:10px;display:none"></div><div class="callout warn" style="margin-top:12px"><b>Design rule:</b> MBAR does not control annual crop rotation. It creates/updates the permanent field layer. Crop is stored separately by crop year.</div></div><div class="card"><h2>2. Annual Crop Plan</h2><div class="toolbar"><label>Crop year <select id="yearSel" class="select" onchange="changeYear(this.value)"><option>2026</option><option selected>2027</option><option>2028</option><option>2029</option></select></label><button class="btn secondary" onclick="rotateAll()">Rotate Entire Farm</button><button class="btn secondary" onclick="mapSoils()">Refresh Soils</button></div><div class="muted">Use Rotate for a Corn ↔ Soybean operation. Other rotations remain manual.</div></div></div><div class="card" style="margin-top:16px"><h2>3. Field Crop Assignment + Seed Readiness</h2><table class="table"><thead><tr><th>Field</th><th>Geo / Soil</th><th>${planYear} Crop</th><th>Seed Step</th></tr></thead><tbody>${fields.map(f=>{const pf=planBy[f.id]||{field_id:f.id},s=soilBy[f.id]||{};return `<tr><td><b>${esc(f.name)}</b><br><span class="muted">${esc(f.farm_number||'')} ${esc(f.tract_number||'')} ${esc(f.field_number||'')} • ${Number(f.acres||0).toLocaleString()} ac</span></td><td>${s.soil_status?`<span class="status ready">SSURGO ready</span><br>${esc(s.dominant_muname||s.dominant_musym||'Mapped')}`:'<span class="status">Boundary/soil pending</span>'}</td><td>${cropCell({...pf,field_id:f.id})}</td><td>${pf.crop?`<a class="btn small" href="genetics.html?field_id=${f.id}&crop_year=${planYear}">Select / Rank Seed</a>`:'<span class="muted">Assign crop first</span>'}</td></tr>`}).join('')}</tbody></table></div>`}
async function load(){if(!id)return;prospect=await api('/api/prospects/'+id);await loadPlans();render()}
async function changeYear(v){planYear=Number(v);await loadPlans();render();document.getElementById('yearSel').value=String(planYear)}
async function setCrop(fieldId,crop){await api('/api/fields/'+fieldId+'/crop',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({crop_year:planYear,crop})});await loadPlans();render()}
async function rotateOne(fieldId){try{await api('/api/fields/'+fieldId+'/rotate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from_year:planYear-1,to_year:planYear})});await loadPlans();render()}catch(e){alert(e.message)}}
async function rotateAll(){const r=await api('/api/farms/'+prospect.farm_id+'/rotate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from_year:planYear-1,to_year:planYear})});await loadPlans();render();if(r.skipped?.length)alert(r.rotated+' fields rotated. '+r.skipped.length+' need manual crop assignment.')}
async function uploadMBAR(){const f=document.getElementById('mbarFile').files[0],m=document.getElementById('mbarMsg'),b=document.getElementById('mbarBtn');if(!f)return alert('Choose an MBAR file.');const fd=new FormData();fd.append('file',f);fd.append('document_type','MBAR');fd.append('target_farm_id',prospect.farm_id);m.style.display='block';m.textContent='Reading MBAR and updating permanent fields…';b.disabled=true;try{const r=await api('/api/documents/upload',{method:'POST',body:fd});m.innerHTML='<b>MBAR stored.</b> '+(r.fields_created_or_updated||0)+' fields created/updated. '+((r.warnings||[]).map(esc).join(' ')||'');prospect=await api('/api/prospects/'+id);await loadPlans();render()}catch(e){m.className='callout warn';m.innerHTML='<b>MBAR import needs work.</b> '+esc(e.message)}finally{b.disabled=false}}
async function mapSoils(){try{await api('/api/prospects/'+id+'/soils/enrich?force=false',{method:'POST'});prospect=await api('/api/prospects/'+id);render()}catch(e){alert(e.message)}}
load();
</script></body></html>
