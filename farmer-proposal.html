<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeedIQ — Farmer Seed Plan</title><style>
:root{--bg:#f5f7f3;--card:#fff;--ink:#18231b;--muted:#68736a;--line:#dde5dd;--green:#1f6f43;--dark:#102a1d;--lime:#e1f2e6;--gold:#fff1d2}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1080px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#102a1d,#1f6f43);color:#fff;padding:30px;border-radius:20px}.hero .muted{color:#d3e2d6}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:27px;font-weight:850}.muted{color:var(--muted)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--lime);font-size:11px;font-weight:750}.field{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:10px}.fieldtop{display:flex;justify-content:space-between;gap:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#eaf2ed;color:#17452d}.approve{background:#f7fbf8;border:2px solid #9ac5a7}.approval{display:flex;gap:8px;flex-wrap:wrap}.input{padding:10px;border:1px solid var(--line);border-radius:9px;min-width:250px}.approved{background:#e1f2e6;color:#185f38;padding:12px;border-radius:10px}.pdf-note{background:#f7faf8;border:1px solid var(--line);padding:14px;border-radius:12px;margin-top:16px}.pdf-brand{font-size:22px;font-weight:900;color:var(--green)}.stat{border:1px solid var(--line);border-radius:10px;padding:10px}.stat span{font-size:10px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}.stat b{font-size:16px}.screen-fields .field{background:#fff}.print-book{display:none}.print-mode{background:#fff}.print-mode .wrap{max-width:none;padding:0}.print-mode .screen-only{display:none!important}.print-mode .print-book{display:block}.print-toolbar{position:sticky;top:0;z-index:10;background:#102a1d;color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.print-toolbar .btn{background:#fff;color:#17452d}.book-page{background:#fff;max-width:8.5in;margin:0 auto;padding:.35in}.book-cover{min-height:10in;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#f7fbf8,#e6f0e8)}.book-cover h1{font-size:34px;margin:8px 0}.book-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--green);padding-bottom:8px;margin-bottom:12px}.book-head h2{margin:3px 0}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-card{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:4.45in;break-inside:avoid;page-break-inside:avoid;overflow:hidden}.field-card-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}.field-card-head h3{margin:0;font-size:16px}.mini-map{height:1.55in;border:1px solid var(--line);border-radius:9px;background:#d7ddd5;overflow:hidden;position:relative}.aerial-map{position:relative;width:100%;height:100%;overflow:hidden;background:#d7ddd5}.aerial-map img.map-tile{position:absolute;width:256px;height:256px;max-width:none;object-fit:none}.aerial-map svg.map-overlay{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}.map-credit{position:absolute;right:4px;bottom:3px;background:rgba(255,255,255,.82);padding:2px 4px;border-radius:3px;font-size:7px;color:#3c4c40;z-index:3}.map-north{position:absolute;left:5px;top:4px;background:rgba(255,255,255,.82);padding:2px 4px;border-radius:3px;font-size:8px;font-weight:800;color:#183521;z-index:3}.seed-line{font-size:18px;font-weight:900;color:var(--green);margin:8px 0 2px}.mini-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}.mini-stat{border:1px solid var(--line);border-radius:7px;padding:6px}.mini-stat span{display:block;font-size:8px;text-transform:uppercase;color:var(--muted);font-weight:750}.mini-stat b{font-size:11px}.soil-line{font-size:9px;color:var(--muted);margin-top:7px;line-height:1.35}.reason-line{font-size:9px;margin-top:7px;line-height:1.35;border-left:3px solid var(--green);padding-left:7px}.book-footer{margin-top:10px;padding-top:6px;border-top:1px solid var(--line);font-size:8px;color:var(--muted);display:flex;justify-content:space-between}.page-label{font-size:10px;color:var(--muted)}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.wrap{padding:14px}.table{font-size:11px}.fieldtop{display:block}.field-grid{grid-template-columns:1fr}.field-card{min-height:auto}.print-toolbar{position:static}}
@media print{@page{size:letter portrait;margin:.28in}.no-print,.screen-only,.print-toolbar{display:none!important}html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{max-width:none!important;padding:0!important}.print-book{display:block!important}.book-page{max-width:none!important;margin:0!important;padding:.08in!important;break-after:page;page-break-after:always}.book-page:last-child{break-after:auto;page-break-after:auto}.book-cover{min-height:10.2in!important;padding:.25in!important}.field-grid{grid-template-columns:1fr 1fr!important;gap:.11in!important}.field-card{min-height:4.65in!important;padding:.09in!important;border-radius:8px!important}.mini-map{height:1.45in!important}.card{border:0;padding:0}.table th,.table td{padding:7px 6px;font-size:11px}.book-summary{font-size:11px}}
</style></head><body><div class="wrap"><div id="app" class="card">Loading your seed plan…</div></div><script>
const params=new URLSearchParams(location.search);const token=params.get('token');const printMode=params.get('print')==='1';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);const num=v=>v==null?'—':Number(v).toLocaleString();
async function api(path,o={}){const r=await fetch(path,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
function productTable(p){const x=p.summary.products||[];if(!x.length)return '<div class="muted">No products selected yet.</div>';return `<table class="table"><thead><tr><th>Product</th><th>Acres</th><th>Units</th><th>Est. Value</th></tr></thead><tbody>${x.map(r=>`<tr><td><b>${esc(r.brand||'')} ${esc(r.product_name||'')}</b><br><span class="muted">${esc(r.trait_package||'')}</span></td><td>${num(r.acres)}</td><td>${num(r.sold_units)}</td><td>${money(r.estimated_value)}</td></tr>`).join('')}</tbody></table>`}
function fieldCards(p){return (p.summary.fields||[]).filter(f=>f.selected_seed_product_id).map(f=>`<div class="field"><div class="fieldtop"><div><b>${esc(f.field_name)}</b><div class="muted">${Number(f.acres||0).toFixed(2)} acres • ${esc(f.irrigation||'')} • ${esc(f.crop||'')}</div></div><span class="tag">${esc(f.brand||'')} ${esc(f.product_name||'')}</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px"><div><span class="muted">Yield Goal</span><br><b>${f.yield_goal??'—'}</b></div><div><span class="muted">Population</span><br><b>${num(f.target_population)}</b></div><div><span class="muted">Seed $/acre</span><br><b>${money(f.seed_cost_per_acre)}</b></div><div><span class="muted">Field Units</span><br><b>${f.units_required==null?'—':Number(f.units_required).toFixed(2)}</b></div></div></div>`).join('')}
function drainText(d){if(!d||typeof d!=='object')return '—';const e=Object.entries(d).sort((a,b)=>Number(b[1]||0)-Number(a[1]||0));return e.length?e.slice(0,2).map(([k,v])=>`${k}${Number.isFinite(Number(v))?' '+Number(v).toFixed(0)+'%':''}`).join(', '):'—'}
function flattenCoords(g){const pts=[];function walk(x){if(!Array.isArray(x))return;if(x.length>=2&&typeof x[0]==='number'&&typeof x[1]==='number'){pts.push([x[0],x[1]]);return}x.forEach(walk)}if(g&&g.coordinates)walk(g.coordinates);else if(g&&g.geometry&&g.geometry.coordinates)walk(g.geometry.coordinates);return pts}
function mercatorPixel(lon,lat,z){const scale=256*Math.pow(2,z),clamped=Math.max(-85.05112878,Math.min(85.05112878,lat)),sin=Math.sin(clamped*Math.PI/180);return {x:(lon+180)/360*scale,y:(.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*scale}}
function chooseMapZoom(pts,w,h){const minLon=Math.min(...pts.map(p=>p[0])),maxLon=Math.max(...pts.map(p=>p[0])),minLat=Math.min(...pts.map(p=>p[1])),maxLat=Math.max(...pts.map(p=>p[1]));for(let z=18;z>=10;z--){const a=mercatorPixel(minLon,maxLat,z),b=mercatorPixel(maxLon,minLat,z);if(Math.abs(b.x-a.x)<=w*.72&&Math.abs(b.y-a.y)<=h*.68)return z}return 10}
function mapSvg(f){const pts=flattenCoords(f.boundary_geojson);if(pts.length<3)return `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#68736a;text-align:center;padding:12px;font-size:10px">Field boundary unavailable</div>`;const w=420,h=180,z=chooseMapZoom(pts,w,h);const minLon=Math.min(...pts.map(p=>p[0])),maxLon=Math.max(...pts.map(p=>p[0])),minLat=Math.min(...pts.map(p=>p[1])),maxLat=Math.max(...pts.map(p=>p[1])),center=mercatorPixel((minLon+maxLon)/2,(minLat+maxLat)/2,z),left=center.x-w/2,top=center.y-h/2,right=left+w,bottom=top+h,tileMinX=Math.floor(left/256),tileMaxX=Math.floor(right/256),tileMinY=Math.floor(top/256),tileMaxY=Math.floor(bottom/256),n=Math.pow(2,z);let tiles='';for(let ty=tileMinY;ty<=tileMaxY;ty++){if(ty<0||ty>=n)continue;for(let tx=tileMinX;tx<=tileMaxX;tx++){const wrap=((tx%n)+n)%n,px=tx*256-left,py=ty*256-top,url=`https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/${z}/${ty}/${wrap}`;tiles+=`<img class="map-tile" src="${url}" alt="" loading="eager" decoding="sync" style="left:${px.toFixed(1)}px;top:${py.toFixed(1)}px">`}}const path=pts.map((p,i)=>{const q=mercatorPixel(p[0],p[1],z);return `${i?'L':'M'} ${(q.x-left).toFixed(1)} ${(q.y-top).toFixed(1)}`}).join(' ')+' Z';return `<div class="aerial-map">${tiles}<svg class="map-overlay" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Aerial field map"><path d="${path}" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><path d="${path}" fill="#32a05a" fill-opacity=".18" stroke="#146b39" stroke-width="3" stroke-linejoin="round"/></svg><div class="map-north">N ↑</div><div class="map-credit">USGS National Map</div></div>`}
function compactField(f,i,total){const reason=(f.reasons||[])[0]||'Top SeedIQ fit for the current field environment.';return `<article class="field-card"><div class="field-card-head"><div><h3>${esc(f.field_name)}</h3><div class="page-label">${Number(f.acres||0).toFixed(2)} ac • ${esc(f.irrigation||'—')} • ${esc(f.crop||'—')}</div></div><span class="tag">${i+1}/${total}</span></div><div class="mini-map">${mapSvg(f)}</div><div class="seed-line">${esc(f.brand||'')} ${esc(f.product_name||'')}</div><div class="page-label">${f.relative_maturity??'—'} RM${f.trait_package?' • '+esc(f.trait_package):''}${f.fit_score!=null?' • '+f.fit_score+'% fit':''}</div><div class="mini-stats"><div class="mini-stat"><span>Yield Goal</span><b>${f.yield_goal??'—'} bu/ac</b></div><div class="mini-stat"><span>Population</span><b>${num(f.target_population)}</b></div><div class="mini-stat"><span>Seed $/Ac</span><b>${money(f.seed_cost_per_acre)}</b></div><div class="mini-stat"><span>Units</span><b>${f.units_required==null?'—':Number(f.units_required).toFixed(2)}</b></div><div class="mini-stat"><span>Total Seed</span><b>${money(f.total_seed_cost)}</b></div><div class="mini-stat"><span>Slope</span><b>${f.slope_pct==null?'—':Number(f.slope_pct).toFixed(1)+'%'}</b></div></div><div class="soil-line"><b>Soil:</b> ${esc(f.dominant_soil||f.dominant_soil_symbol||'—')} • AWC ${f.awc_0_150cm==null?'—':Number(f.awc_0_150cm).toFixed(1)+' cm'} • ${esc(drainText(f.drainage))}</div><div class="reason-line"><b>Placement:</b> ${esc(reason)}</div></article>`}
function chunk(arr,size){const out=[];for(let i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size));return out}
async function printWhenMapsReady(btn){const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='Loading field maps…'}const imgs=[...document.querySelectorAll('.print-book img.map-tile')];await Promise.race([Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.addEventListener('load',r,{once:true});img.addEventListener('error',r,{once:true})}))),new Promise(r=>setTimeout(r,8000))]);if(btn){btn.textContent='Opening print dialog…'}setTimeout(()=>{window.print();if(btn){btn.disabled=false;btn.textContent=old||'Print / Save PDF'}},150)}
function printBook(p,b){const s=p.summary,fields=b.fields||[],groups=chunk(fields,4),totalPages=2+groups.length;const fieldPages=groups.map((group,pageIndex)=>`<section class="book-page"><div class="book-head"><div><div class="pdf-brand">SeedIQ</div><h2>Field Placement Plan</h2></div><div class="page-label">${esc(p.prospect_name)} • ${p.crop_year}<br>Page ${pageIndex+3} of ${totalPages}</div></div><div class="field-grid">${group.map((f,j)=>compactField(f,pageIndex*4+j,fields.length)).join('')}</div><div class="book-footer"><span>SeedIQ farm-specific genetic placement</span><span>Field imagery: USGS National Map. Confirm final agronomic decisions and product availability with the dealer/agronomist.</span></div></section>`).join('');return `<div class="print-book">${printMode?`<div class="print-toolbar no-print"><div><b>SeedIQ Field Book</b> • ${fields.length} fields • ${totalPages} pages</div><div><button class="btn" onclick="printWhenMapsReady(this)">Print / Save PDF</button> <a class="btn" href="${location.pathname}?token=${encodeURIComponent(token)}">Back to Plan</a></div></div>`:''}<section class="book-page book-cover"><div><div class="pdf-brand" style="font-size:30px">SeedIQ</div><div class="muted">Farm-Specific Genetic Placement Book</div></div><div><h1>${esc(p.prospect_name)}<br><span style="color:#1f6f43">${p.crop_year} Seed Plan</span></h1><p>${esc(p.intro_message||'Field-by-field seed placement built from mapped field boundaries, SSURGO soils, irrigation practice, crop plan, yield goals and product fit.')}</p></div><div class="grid kpis"><div class="stat"><span>Planned Acres</span><b>${num(s.planned_acres)}</b></div><div class="stat"><span>Planned Fields</span><b>${fields.length}</b></div><div class="stat"><span>Seed Products</span><b>${(s.products||[]).length}</b></div><div class="stat"><span>Seed Investment</span><b>${money(s.estimated_seed_value)}</b></div></div><div><b>Prepared${p.salesperson_name?' by '+esc(p.salesperson_name):''}</b><br><span class="muted">${esc(p.salesperson_phone||'')} ${p.salesperson_email?'• '+esc(p.salesperson_email):''}</span></div></section><section class="book-page book-summary"><div class="book-head"><div><div class="pdf-brand">SeedIQ</div><h2>Whole-Farm Seed Summary</h2></div><div class="page-label">${esc(p.prospect_name)} • ${p.crop_year}<br>Page 2 of ${totalPages}</div></div>${productTable(p)}<div class="pdf-note"><b>How this plan was built</b><br>${esc(b.method||'')}<br><br>${esc(b.population_note||'')}<br><br><b>Field maps:</b> each field is shown over USGS National Map aerial imagery with the validated SeedIQ boundary highlighted.</div><div class="book-footer"><span>SeedIQ</span><span>Whole-farm product totals use dealer order-line rounding for sold-unit logistics.</span></div></section>${fieldPages}</div>`}
function openPrintBook(){const url=location.pathname+'?token='+encodeURIComponent(token)+'&print=1';window.open(url,'_blank','noopener')}
function render(p,b){const s=p.summary,corn=s.crop_acres?.CORN||0,soy=s.crop_acres?.SOYBEANS||s.crop_acres?.SOYBEAN||0;document.getElementById('app').className='';if(printMode){document.body.classList.add('print-mode');document.getElementById('app').innerHTML=printBook(p,b);return}document.getElementById('app').innerHTML=`<div class="screen-only"><div class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.06em">FARM-SPECIFIC SEED PLACEMENT PLAN</div><h1 style="margin:7px 0">${esc(p.prospect_name)} — ${p.crop_year}</h1><div class="muted">Prepared${p.salesperson_name?' by '+esc(p.salesperson_name):''}${p.salesperson_phone?' • '+esc(p.salesperson_phone):''}</div>${p.intro_message?`<p>${esc(p.intro_message)}</p>`:''}</div><div class="grid kpis"><div class="card"><div class="muted">Planned Acres</div><div class="metric">${num(s.planned_acres)}</div></div><div class="card"><div class="muted">Corn / Soy</div><div class="metric">${num(corn)} / ${num(soy)}</div></div><div class="card"><div class="muted">IRR / NIRR Acres</div><div class="metric">${num(s.irrigation_acres?.IRR||0)} / ${num(s.irrigation_acres?.NIRR||0)}</div></div><div class="card"><div class="muted">Seed Investment</div><div class="metric">${money(s.estimated_seed_value)}</div></div></div><div class="card"><h2>Whole-Farm Product Plan</h2><p class="muted">Genetics are assigned by field using mapped soils, irrigation practice, crop, yield goal and product fit.</p>${productTable(p)}</div><div class="card screen-fields" style="margin-top:16px"><h2>Field-by-Field Plan</h2>${fieldCards(p)}</div><div class="pdf-note"><b>Printable Field Book</b><br>Each field now prints with a real USGS aerial map snippet, the validated field boundary, genetics, population, soil profile and economics. Large farms stay in the compact 4-fields-per-page format.<div style="margin-top:12px"><button class="btn" onclick="openPrintBook()">Open Print-Ready Field Book</button></div></div><div class="card approve" style="margin-top:16px"><h2>Approve Seed Plan</h2>${p.status==='approved'?`<div class="approved">Approved${p.approval_name?' by '+esc(p.approval_name):''}. Your salesperson can now move this plan into ordering.</div><div style="margin-top:12px"><button class="btn secondary" onclick="openPrintBook()">Open Print-Ready Field Book</button></div>`:`<p class="muted">Approval confirms this is the seed plan you want the salesperson to move forward with. It is a demo workflow acknowledgment, not an electronic signature or binding contract.</p><div class="approval"><input id="name" class="input" placeholder="Farmer name"><button class="btn" onclick="approve()">Looks Good — Move Forward</button><button class="btn secondary" onclick="openPrintBook()">Open Print-Ready Field Book</button></div>`}</div></div>`}
async function approve(){const name=document.getElementById('name').value.trim();await api('/api/public/proposals/'+encodeURIComponent(token)+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_name:name||null})});load()}
async function load(){if(!token)throw new Error('Proposal link is missing.');const [p,b]=await Promise.all([api('/api/public/proposals/'+encodeURIComponent(token)),api('/api/public/proposals/'+encodeURIComponent(token)+'/field-book-data')]);render(p,b)}load().catch(e=>document.getElementById('app').innerHTML='<b>Could not load proposal.</b><br>'+esc(e.message));
</script></body></html>
