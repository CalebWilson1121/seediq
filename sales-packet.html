<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeedIQ — Sales Package</title><style>
:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d;--lime:#dff2e5;--warn:#fff2d9;--blue:#e8f0fb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 18px}.brand{font-size:25px;font-weight:850}.brand span{color:#8fd39f}.subbrand{font-size:12px;color:#a9c1b1;margin-top:4px}nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a:hover,nav a.active{background:#1d4b33}.main{padding:28px 32px 48px}.card,.page{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:22px;margin-bottom:16px}.hero p{color:#c9ddcf}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.btn{display:inline-block;border:0;background:var(--green);color:#fff;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer;text-decoration:none}.btn.secondary{background:#eaf2ed;color:#17452d}.btn.warn{background:#fff0d2;color:#855f14}.select,.input,.textarea{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.textarea{width:100%;min-height:82px}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.cols{grid-template-columns:1.15fr .85fr}.metric{font-size:28px;font-weight:850}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--lime);font-size:10px;font-weight:750}.page{margin-top:16px}.cover{min-height:300px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#f6fbf7,#e4f0e7)}.cover h1{font-size:38px;margin:0}.dealer{font-size:28px;font-weight:850;color:var(--green)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fbfdfb}.mini b{display:block;font-size:21px;margin-top:3px}.note{border-left:4px solid var(--green);background:#f5faf6;padding:12px 14px;border-radius:0 10px 10px 0}.warning{border-left-color:#bd861a;background:var(--warn)}.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sharebox{background:#f7faf8;border:1px solid var(--line);border-radius:12px;padding:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.step{border:1px solid var(--line);border-radius:12px;padding:12px}.step b{display:block}.done{background:#e1f2e6;color:#185f38}.pending{background:#fff4db;color:#835f18}@media(max-width:900px){.app{grid-template-columns:1fr}.kpis,.summary,.cols,.formgrid{grid-template-columns:1fr}.main{padding:18px}}@media print{.sidebar,.toolbar,.hero,.no-print,.workflow-card{display:none!important}.app{display:block}.main{padding:0}.page{break-inside:avoid;border:0;margin:0 0 18px}.cover{min-height:9in}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">Seed<span>IQ</span></div><div class="subbrand">Seed Intelligence & Sales Platform</div><nav><a href="index.html">Dashboard</a><a href="prospects.html">Prospect Intelligence</a><a href="farmers.html">Farmer & Fields</a><a href="field-analysis.html">Field Analysis</a><a href="whole-farm-plan.html">Whole-Farm Plan</a><a href="sales-packet.html" class="active">Sales Package</a><a href="genetics.html">Seed Genetics</a><a href="data-hub.html">Farm Data Hub</a></nav></aside><main class="main"><div id="content"><div class="card">Loading live sales package…</div></div></main></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);const num=v=>v==null?'—':Number(v).toLocaleString();let prospects=[],prospect=null,proposal=null,year=2027;
async function api(path,o={}){const r=await fetch(path,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
async function boot(){prospects=await api('/api/prospects');const q=Number(new URLSearchParams(location.search).get('id'));const y=Number(new URLSearchParams(location.search).get('year'));if(y)year=y;const p=prospects.find(x=>Number(x.id)===q)||prospects[0];if(!p)return;await choose(p.id)}
async function choose(id){prospect=await api('/api/prospects/'+id);try{proposal=await api('/api/prospects/'+id+'/proposals/latest?crop_year='+year)}catch{proposal=null}render()}
function completeness(s){const n=s.selected_field_count||0;if(!n)return {pct:0,text:'No genetics selected yet'};const complete=Math.min(s.yield_goals_complete||0,s.population_complete||0,s.pricing_complete||0);return {pct:Math.round(100*complete/n),text:`${complete}/${n} selected fields have yield goal, population and pricing`}}
function proposalUrl(){return proposal?`${location.origin}/farmer-proposal.html?token=${encodeURIComponent(proposal.public_token)}`:''}
function statusBadge(){if(!proposal)return '<span class="tag pending">Not generated</span>';const s=proposal.status||'draft';return `<span class="tag ${s==='approved'?'done':'pending'}">${esc(s.toUpperCase())}</span>`}
async function generate(){const body={crop_year:year,salesperson_name:document.getElementById('spName').value||null,salesperson_email:document.getElementById('spEmail').value||null,salesperson_phone:document.getElementById('spPhone').value||null,intro_message:document.getElementById('intro').value||null};proposal=await api('/api/prospects/'+prospect.id+'/proposals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});render()}
async function setStatus(status){proposal=await api('/api/proposals/'+proposal.id+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});render()}
function emailProposal(){const u=proposalUrl();const subj=encodeURIComponent(`${prospect.prospect_name} ${year} Seed Plan`);const body=encodeURIComponent(`Here is your ${year} SeedIQ seed plan:\n\n${u}\n\nPlease review the field-by-field plan and approve it when you're comfortable moving forward.`);location.href=`mailto:?subject=${subj}&body=${body}`;if(proposal)setStatus('sent')}
function textProposal(){const u=proposalUrl();const body=encodeURIComponent(`Your ${year} SeedIQ seed plan is ready: ${u}`);location.href=`sms:?&body=${body}`;if(proposal)setStatus('sent')}
async function copyLink(){await navigator.clipboard.writeText(proposalUrl());alert('Farmer proposal link copied.');if(proposal)setStatus('sent')}
function render(){const s=proposal?.summary||{fields:[],products:[],crop_acres:{},irrigation_acres:{},selected_field_count:0,total_field_count:(prospect.farm_context?.fields||[]).length,planned_acres:0,sold_units:0,estimated_seed_value:0,yield_goals_complete:0,population_complete:0,pricing_complete:0};const comp=completeness(s);const selected=(s.fields||[]).filter(f=>f.selected_seed_product_id);const corn=s.crop_acres?.CORN||0,soy=s.crop_acres?.SOYBEANS||s.crop_acres?.SOYBEAN||0;document.getElementById('content').innerHTML=`<div class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.06em">PLAN → PRESENT → APPROVE → ORDER</div><h1 style="margin:6px 0">Sales Package & Farmer Presentation</h1><p>${esc(prospect.prospect_name)} • ${year} • One live workflow from the salesperson's seed plan to farmer approval.</p></div><div class="toolbar"><label>Prospect <select class="select" onchange="choose(this.value)">${prospects.map(p=>`<option value="${p.id}" ${Number(p.id)===Number(prospect.id)?'selected':''}>${esc(p.prospect_name)}</option>`).join('')}</select></label><label>Year <select class="select" onchange="year=Number(this.value);choose(prospect.id)">${[2026,2027,2028,2029].map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select></label><a class="btn secondary" href="whole-farm-plan.html?id=${prospect.id}&year=${year}">Edit Seed Plan</a><button class="btn secondary" onclick="window.print()">Print / Save PDF</button></div><div class="grid kpis"><div class="card"><div class="muted">Planned Acres</div><div class="metric">${num(s.planned_acres||0)}</div></div><div class="card"><div class="muted">Plan Completion</div><div class="metric">${comp.pct}%</div><div class="muted">${esc(comp.text)}</div></div><div class="card"><div class="muted">Sold Units</div><div class="metric">${num(s.sold_units||0)}</div></div><div class="card"><div class="muted">Proposal Status</div><div class="metric" style="font-size:18px">${statusBadge()}</div></div></div><div class="grid cols"><div><div class="card workflow-card"><h2>1. Generate Farmer Proposal</h2><div class="formgrid"><input id="spName" class="input" placeholder="Salesperson name" value="${esc(proposal?.salesperson_name||'')}"><input id="spEmail" class="input" placeholder="Salesperson email" value="${esc(proposal?.salesperson_email||'')}"><input id="spPhone" class="input" placeholder="Salesperson phone" value="${esc(proposal?.salesperson_phone||'')}"><div></div><textarea id="intro" class="textarea full" placeholder="Short note to the farmer">${esc(proposal?.intro_message||'We matched genetics field-by-field using your mapped soils, irrigation practice, crop plan and yield goals so each product has a clear job on the farm.')}</textarea></div><button class="btn" style="margin-top:10px" onclick="generate()">${proposal?'Refresh / Update Proposal':'Generate Farmer Proposal'}</button>${comp.pct<100?`<div class="note warning" style="margin-top:12px"><b>Demo can continue, but the plan is not complete.</b><br>${esc(comp.text)}. Finish missing yield goals, populations or pricing before presenting a final package.</div>`:''}</div>${proposal?`<div class="card no-print" style="margin-top:16px"><h2>2. Present to Farmer</h2><div class="sharebox"><div class="muted" style="font-size:11px">Farmer link</div><div style="word-break:break-all;font-weight:700;margin:5px 0 12px">${esc(proposalUrl())}</div><div class="toolbar"><a class="btn" target="_blank" href="${proposalUrl()}">Open Farmer View</a><button class="btn secondary" onclick="emailProposal()">Email</button><button class="btn secondary" onclick="textProposal()">Text</button><button class="btn secondary" onclick="copyLink()">Copy Link</button>${proposal.status==='draft'?`<button class="btn warn" onclick="setStatus('ready')">Mark Ready</button>`:''}</div></div></div>`:''}</div><div><div class="card workflow-card"><h2>Workflow Status</h2><div class="step ${proposal?'done':'pending'}"><b>1. Proposal Generated</b><span>${proposal?'Ready':'Not yet'}</span></div><div class="step ${proposal&&['sent','viewed','approved'].includes(proposal.status)?'done':'pending'}" style="margin-top:8px"><b>2. Shared with Farmer</b><span>${proposal?.sent_at?'Sent':'Waiting'}</span></div><div class="step ${proposal?.viewed_at?'done':'pending'}" style="margin-top:8px"><b>3. Farmer Viewed</b><span>${proposal?.viewed_at?'Viewed':'Waiting'}</span></div><div class="step ${proposal?.status==='approved'?'done':'pending'}" style="margin-top:8px"><b>4. Farmer Approved</b><span>${proposal?.status==='approved'?'Approved — ready to order':'Waiting'}</span></div></div>${proposal?.status==='approved'?`<div class="card" style="margin-top:16px"><h2>Sale Ready</h2><div class="note"><b>Farmer approved the plan${proposal.approval_name?' — '+esc(proposal.approval_name):''}.</b><br>Dealer order logistics below are now the working sold-bag requirements for this demo.</div></div>`:''}</div></div>${proposal?proposalPages(proposal):''}`}
function proposalPages(p){const s=p.summary,selected=(s.fields||[]).filter(f=>f.selected_seed_product_id);return `<div class="page cover"><div><div class="dealer">SeedIQ</div><div class="muted">Farm-Specific Genetic Placement Proposal</div></div><div><h1>${esc(p.prospect_name)}<br><span style="color:var(--green)">${p.crop_year} Seed Placement Plan</span></h1><p class="muted">Prepared${p.salesperson_name?' by '+esc(p.salesperson_name):''}</p></div><div class="summary"><div class="mini"><span class="muted">Planned Acres</span><b>${num(s.planned_acres)}</b></div><div class="mini"><span class="muted">Selected Genetics</span><b>${s.products.length}</b></div><div class="mini"><span class="muted">Sold Units</span><b>${num(s.sold_units)}</b></div></div></div><div class="page"><h2>Whole-Farm Product Plan</h2>${s.products.length?`<table class="table"><thead><tr><th>Product</th><th>Acres</th><th>Fields</th><th>Sold Units</th><th>Est. Value</th></tr></thead><tbody>${s.products.map(x=>`<tr><td><b>${esc(x.brand||'')} ${esc(x.product_name||'')}</b><br><span class="muted">${esc(x.trait_package||'')}</span></td><td>${num(x.acres)}</td><td>${x.field_count}</td><td>${x.sold_units}</td><td>${money(x.estimated_value)}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">No selected genetics yet.</div>'}</div><div class="page"><h2>Field-by-Field Plan</h2>${selected.length?`<table class="table"><thead><tr><th>Field</th><th>Water</th><th>Yield Goal</th><th>Product</th><th>Population</th><th>$/Acre</th></tr></thead><tbody>${selected.map(f=>`<tr><td><b>${esc(f.field_name)}</b><br><span class="muted">${Number(f.acres||0).toFixed(2)} ac • ${esc(f.crop||'')}</span></td><td><span class="tag">${esc(f.irrigation||'—')}</span></td><td>${f.yield_goal??'—'}</td><td><b>${esc(f.brand||'')} ${esc(f.product_name||'')}</b></td><td>${num(f.target_population)}</td><td>${money(f.seed_cost_per_acre)}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">No selected fields yet.</div>'}</div>`}
boot().catch(e=>document.getElementById('content').innerHTML='<div class="card"><b>Could not load sales package.</b><br>'+esc(e.message)+'</div>');
</script></body></html>
