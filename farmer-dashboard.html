<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcreFit Farmer — Dashboard</title>
<style>:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d;--lime:#dff2e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--dark);padding:22px 18px;color:#fff}.side img{height:45px;max-width:210px}.side a{display:block;color:#dce8df;text-decoration:none;padding:10px 11px;border-radius:9px;margin-top:7px}.side a.active,.side a:hover{background:#1d4b33}.main{padding:28px 32px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,1fr);margin:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.muted{color:var(--muted)}.metric{font-size:27px;font-weight:900}.farm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.secondary{background:#eaf2ed;color:#17452d}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:22px;margin-top:14px}.hero p{color:#d5e5d9}.tag{display:inline-block;background:var(--lime);border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}.progress{height:8px;background:#e7eee8;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.farm-grid{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.kpis{grid-template-columns:repeat(2,1fr)}}</style><link rel="icon" href="/acrefit-icon.svg"></head>
<body><div class="app"><aside class="side"><img src="/acrefit-farmer-logo-light.svg" alt="AcreFit Farmer"><div style="margin-top:22px"><a class="active" href="/farmer-dashboard.html">Farm Overview</a><a href="#" onclick="openFirstFarm();return false">Fields & Mapping</a><a href="#" onclick="openFirstAnalysis();return false">Field Analysis</a><a href="#" onclick="openFirstPlan();return false">Annual Crop Plan</a><a href="/genetics.html">Seed Genetics</a><a href="/data-hub.html">Farm Data Hub</a></div><button class="btn secondary" style="margin-top:26px;width:100%" onclick="logout()">Sign Out</button></aside><main class="main"><div id="content"><div class="card">Loading farm intelligence…</div></div></main></div>
<script>
let data=null,year=new Date().getFullYear()+1;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(p,o={}){const r=await fetch(p,o);let d={};try{d=await r.json()}catch{}if(r.status===401){location='/farmer-login.html';throw Error('Sign in required')}if(!r.ok)throw Error(d.detail||'Request failed');return d}
function first(){return (data?.farms||[])[0]||null}function openFirstFarm(){const f=first();if(f?.prospect_id)location='/prospect-detail.html?id='+f.prospect_id}function openFirstAnalysis(){const f=first();if(f?.prospect_id)location='/prospect-detail.html?id='+f.prospect_id}function openFirstPlan(){const f=first();if(f?.prospect_id)location='/whole-farm-plan.html?id='+f.prospect_id+'&year='+year}
function render(){const s=data.summary||{},farms=data.farms||[],fields=Math.max(1,Number(s.fields||0)),planPct=Math.round(Number(s.planned||0)/fields*100),seedPct=Math.round(Number(s.seed_selected||0)/fields*100);document.getElementById('content').innerHTML=`
<div class="row"><div><div class="muted">FARM ORGANIZATION</div><h1 style="margin:4px 0">${esc(data.organization_name)}</h1><div class="muted">${year} planning year</div></div><select onchange="year=Number(this.value);load()" style="padding:9px;border:1px solid var(--line);border-radius:8px"><option>${year-1}</option><option selected>${year}</option><option>${year+1}</option></select></div>
<div class="grid kpis"><div class="card"><div class="muted">Farms</div><div class="metric">${s.farms||0}</div></div><div class="card"><div class="muted">Acres</div><div class="metric">${Number(s.acres||0).toLocaleString()}</div></div><div class="card"><div class="muted">Fields</div><div class="metric">${s.fields||0}</div></div><div class="card"><div class="muted">Mapped</div><div class="metric">${s.mapped||0}/${s.fields||0}</div></div><div class="card"><div class="muted">APH Fields</div><div class="metric">${s.aph_fields||0}</div></div><div class="card"><div class="muted">Seed Selected</div><div class="metric">${s.seed_selected||0}</div></div></div>
<div class="hero"><div style="font-size:11px;font-weight:850;letter-spacing:.06em">MAP ONCE → UPDATE APH → PLAN ROTATION → FIT GENETICS → TRACK PERFORMANCE</div><h2 style="margin:7px 0">AcreFit Farmer keeps the field history permanent.</h2><p>Boundaries and soils stay with the farm. APH updates yearly. Crop rotation and seed decisions change by season. Genetics fit stays field-specific.</p></div>
<div class="grid" style="grid-template-columns:1fr 1fr;gap:14px;margin-top:16px"><div class="card"><div class="row"><b>Crop Plan Progress</b><span>${planPct}%</span></div><div class="progress" style="margin-top:10px"><i style="width:${planPct}%"></i></div><div class="muted" style="font-size:12px;margin-top:7px">${s.planned||0} of ${s.fields||0} fields assigned a crop.</div></div><div class="card"><div class="row"><b>Seed Placement Progress</b><span>${seedPct}%</span></div><div class="progress" style="margin-top:10px"><i style="width:${seedPct}%"></i></div><div class="muted" style="font-size:12px;margin-top:7px">${s.seed_selected||0} of ${s.fields||0} fields have genetics selected.</div></div></div>
<h2 style="margin:24px 0 10px">My Farms</h2><div class="grid farm-grid">${farms.length?farms.map(f=>`<div class="card"><div class="row"><div><h3 style="margin:0">${esc(f.farm_name||f.producer_name||'Farm')}</h3><div class="muted" style="font-size:12px;margin-top:4px">${esc([f.county,f.state].filter(Boolean).join(', '))}</div></div><span class="tag">${Number(f.total_acres||0).toLocaleString()} ac</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${f.prospect_id?`<a class="btn" href="/prospect-detail.html?id=${f.prospect_id}">Open Fields</a><a class="btn secondary" href="/whole-farm-plan.html?id=${f.prospect_id}&year=${year}">Annual Plan</a>`:''}</div></div>`).join(''):'<div class="card"><b>No farms assigned yet.</b><div class="muted" style="margin-top:5px">A farm administrator can link existing AcreFit farms to this organization.</div></div>'}</div>`}
async function load(){data=await api('/api/farmer/dashboard?crop_year='+year);render()}async function logout(){await api('/api/auth/logout',{method:'POST'}).catch(()=>{});location='/farmer-login.html'}load().catch(e=>document.getElementById('content').innerHTML='<div class="card"><b>Could not load AcreFit Farmer.</b><div class="muted">'+esc(e.message)+'</div></div>')</script></body></html>
