<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AcreFit — Dashboard</title>
<style>
:root{--dark:#102a1d;--green:#1f6f43;--muted:#6b776d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f2;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#162319}
.card{width:min(520px,92vw);background:#fff;border:1px solid #dfe7df;border-radius:18px;padding:28px;text-align:center;box-shadow:0 18px 50px rgba(16,42,29,.08)}
img{height:50px;max-width:230px}.muted{color:var(--muted);margin-top:10px}.btn{display:inline-block;margin-top:16px;padding:10px 14px;border-radius:9px;background:var(--green);color:#fff;text-decoration:none;font-weight:800}
</style><link rel="icon" href="/acrefit-icon.svg"></head>
<body><div class="card"><img src="/acrefit-logo.svg" alt="AcreFit"><h2>Opening your dashboard…</h2><div id="msg" class="muted">AcreFit is loading the workspace for the signed-in role.</div><a class="btn" href="/login.html">Switch Demo Role</a></div>
<script>
(async()=>{
  try{
    const r=await fetch('/api/auth/me');
    if(!r.ok){location.replace('/login.html');return}
    const me=await r.json();
    const role=me.role||(me.global_role==='super_admin'?'super_admin':me.global_role==='dealer_admin'?'dealer_admin':'salesperson');
    const target=role==='super_admin'?'/admin.html':role==='dealer_admin'?'/dealer-demo.html':'/pipeline.html';
    location.replace(target);
  }catch(e){
    document.getElementById('msg').textContent='Could not load your dashboard.';
  }
})();
</script></body></html>
