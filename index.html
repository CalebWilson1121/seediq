<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcreFit Login</title><style>:root{--dark:#102a1d;--green:#1f6f43;--bg:#f4f7f2;--line:#dfe7df;--muted:#6b776d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0e271a,#1f6f43);min-height:100vh;display:grid;place-items:center;color:#162319}.wrap{width:min(980px,94vw);display:grid;grid-template-columns:1.05fr .95fr;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}.brand{background:#102a1d;color:#fff;padding:48px}.logo{font-size:34px;font-weight:900}.logo span{color:#8fd39f}.brand p{color:#b9cebf;line-height:1.6}.form{padding:44px}.input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0 14px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.demo{background:#f5faf6;border:1px solid var(--line);padding:13px;border-radius:12px;margin-top:18px;font-size:13px}.muted{color:var(--muted)}.error{color:#9c3735;margin-top:10px;font-size:13px}@media(max-width:760px){.wrap{grid-template-columns:1fr}.brand{padding:30px}.form{padding:30px}}</style><link rel="icon" href="/acrefit-icon.svg"></head><body><div class="wrap"><section class="brand"><div class="logo"><img src="/acrefit-logo-light.svg" alt="AcreFit" style="height:62px;width:auto;max-width:270px;display:block"></div><h1>Field intelligence. Better seed decisions.</h1><p>Dealer organizations, annual catalogs, prospect farms, field intelligence and seed placement in one sales platform.</p><p><b>Super Admin</b><br>Control dealer access, users, licenses and system activity.</p></section><section class="form"><h2>Sign in</h2><div class="muted">Sign in, or launch a demo workspace.</div><input id="email" class="input" type="email" autocomplete="username" placeholder="Email"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button id="login" class="btn">Sign In</button><div id="msg" class="error"></div><div class="demo"><b>Demo Workspaces</b><br><button class="btn" style="margin-top:10px;background:#eaf2ed;color:#17452d" onclick="demoLogin('admin')">Use Super Admin Demo</button><button class="btn" style="margin-top:8px;background:#eaf2ed;color:#17452d" onclick="demoLogin('dealer')">Use Dealer Demo</button></div></section></div><script>async function demoLogin(role){if(role==='admin'){email.value='admin@seediq.demo';password.value='SeedIQAdmin!2026'}else{email.value='dealer@seediq.demo';password.value='SeedIQDemo!2026'}return signIn()}async function signIn(){const msg=document.getElementById('msg');msg.textContent='Signing in…';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'Login failed';return}location.href=d.user.global_role==='super_admin'?'/admin.html':'/dealer-demo.html'}document.getElementById('login').onclick=signIn;document.addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});</script></body></html>
