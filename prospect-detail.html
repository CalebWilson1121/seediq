<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeedIQ — Prospect Detail</title><style>:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d;--lime:#dff2e5}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 18px}.brand{font-size:25px;font-weight:850}.brand span{color:#8fd39f}.subbrand{font-size:12px;color:#a9c1b1;margin-top:4px}nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a:hover,nav a.active{background:#1d4b33}.main{padding:28px 32px}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:24px}.hero p{color:#c9ddcf}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.cols{grid-template-columns:1.2fr .8fr}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.muted{color:var(--muted)}.metric{font-size:28px;font-weight:850}.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;border-radius:10px;padding:10px 14px;font-weight:750}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.tag{display:inline-block;background:var(--lime);padding:5px 8px;border-radius:999px;font-size:11px;margin-right:5px}.callout{border-left:4px solid var(--green);background:#f5faf6;padding:12px 14px;border-radius:0 10px 10px 0}@media(max-width:900px){.app{grid-template-columns:1fr}.kpis,.cols{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">Seed<span>IQ</span></div><div class="subbrand">Seed Intelligence & Sales Platform</div><nav><a href="index.html">Dashboard</a><a href="prospects.html" class="active">Prospect Intelligence</a><a href="farmers.html">Farmer & Fields</a><a href="field-analysis.html">Field Analysis</a><a href="whole-farm-plan.html">Whole-Farm Plan</a><a href="genetics.html">Seed Genetics</a><a href="data-hub.html">Farm Data Hub</a></nav></aside><main class="main"><div id="content"><div class="card">Loading prospect…</div></div></main></div><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=new URLSearchParams(location.search).get('id');
(async()=>{const box=document.getElementById('content');try{if(!id)throw new Error('No prospect selected');const r=await fetch('/api/prospects/'+id);if(!r.ok)throw new Error('Prospect could not be loaded');const p=await r.json();const c=p.farm_context||{};const fields=c.fields||[];const recs=c.crop_records||[];const crops=[...new Set(fields.map(f=>f.crop).filter(Boolean))];const counties=[...new Set(fields.map(f=>f.county).filter(Boolean))];const latest={};for(const row of recs){if(!row.field_id)continue;if(!latest[row.field_id]||Number(row.crop_year||0)>Number(latest[row.field_id].crop_year||0))latest[row.field_id]=row}const avgApproved=Object.values(latest).map(x=>Number(x.approved_yield||0)).filter(Boolean);const approved=avgApproved.length?Math.round(avgApproved.reduce((a,b)=>a+b,0)/avgApproved.length):0;box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start"><div><a href="prospects.html" class="muted" style="text-decoration:none">← Prospects</a><h1>${esc(p.prospect_name)}</h1><div class="muted">${counties.map(esc).join(', ')||'Location pending'} • APH-created prospect</div></div><a class="btn" href="genetics.html">Start Seed Analysis</a></div><div class="grid kpis"><div class="card"><div class="muted">APH Acres</div><div class="metric">${Number(p.total_acres||0).toLocaleString()}</div></div><div class="card"><div class="muted">Units / Fields</div><div class="metric">${fields.length}</div></div><div class="card"><div class="muted">APH Year Rows</div><div class="metric">${recs.length}</div></div><div class="card"><div class="muted">Avg Approved Yield</div><div class="metric">${approved||'—'}</div></div></div><div class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.06em">SEED ANALYSIS STARTING POINT</div><h2>Build the placement model from what the APH already knows.</h2><p>SeedIQ has the crop, practice, unit structure, acreage and production history. Next we layer soil, weather and genetics on top of these units instead of asking the rep to rebuild the farm manually.</p><div>${crops.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><div class="grid cols" style="margin-top:16px"><div class="card"><h2>Imported Units</h2><table class="table"><thead><tr><th>Unit / Field</th><th>Crop</th><th>Practice</th><th>Acres</th></tr></thead><tbody>${fields.slice(0,40).map(f=>`<tr><td><b>${esc(f.name)}</b><br><span class="muted">${esc(f.field_number||'')}</span></td><td>${esc(f.crop||'—')}</td><td>${esc(f.practice||'—')}</td><td>${Number(f.acres||0).toLocaleString()}</td></tr>`).join('')}</tbody></table>${fields.length>40?`<p class="muted">Showing first 40 of ${fields.length} units.</p>`:''}</div><div class="card"><h2>Next Build Layer</h2><div class="callout"><b>1. Soil profile</b><br><span class="muted">Match each APH unit/location to NRCS soil and water-holding capacity.</span></div><div class="callout" style="margin-top:10px"><b>2. Weather profile</b><br><span class="muted">Historical rainfall, heat, GDD, drought and establishment stress.</span></div><div class="callout" style="margin-top:10px"><b>3. Genetics fit</b><br><span class="muted">Score dealer inventory against the field environment and APH performance history.</span></div><div class="callout" style="margin-top:10px"><b>4. Whole-farm portfolio</b><br><span class="muted">Distribute products and maturities across the operation.</span></div></div></div>`}catch(e){box.innerHTML='<div class="card">'+esc(e.message)+'</div>'}})();
</script></body></html>
