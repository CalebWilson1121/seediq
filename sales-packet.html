<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AcreFit — Sales Package</title><style>
:root{--green:#176b3a;--dark:#10271a;--muted:#647168;--line:#dfe7df;--bg:#f3f6f2;--soft:#edf6ef;--warn:#fff5df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--dark);padding:22px 16px;color:#fff}.brand{font-size:26px;font-weight:900}.brand span{color:#8fd39f}.side nav{display:grid;gap:6px;margin-top:25px}.side a{color:#dbe8df;text-decoration:none;padding:10px;border-radius:9px}.side a.active,.side a:hover{background:#1e4b33}.main{padding:26px;max-width:1450px;width:100%}.hero{background:linear-gradient(135deg,#12351f,#1f7543);color:#fff;border-radius:18px;padding:22px}.hero p{color:#d3e5d8}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--green);color:#fff;text-decoration:none}.btn.secondary{background:#e5eee8;color:var(--green)}select,input,textarea{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}.card,.page{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr)}.kpi b{display:block;font-size:25px;margin-top:4px}.muted{color:var(--muted)}.workflow{grid-template-columns:1.1fr .9fr;margin-top:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.share{background:#f7faf7;border:1px solid var(--line);border-radius:12px;padding:12px}.page{margin-top:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 7px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.field{display:grid;grid-template-columns:1.05fr .95fr;border:1px solid var(--line);border-radius:15px;overflow:hidden;margin:14px 0;break-inside:avoid}.map img{display:block;width:100%;height:330px;object-fit:cover}.map{min-height:330px;background:#e9eee9}.fieldbody{padding:16px}.fieldhead{display:flex;justify-content:space-between;gap:10px}.pill{background:var(--soft);color:var(--green);padding:5px 8px;border-radius:999px;font-size:10px;font-weight:850}.seed{font-size:21px;color:var(--green);font-weight:900;margin:10px 0}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.fact{border:1px solid var(--line);border-radius:9px;padding:8px}.fact span{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800}.soil{margin-top:10px;background:#f7faf7;border-radius:10px;padding:10px}.reason{margin-top:10px;border-left:4px solid var(--green);background:#f4faf5;padding:9px 11px}.reason ul{margin:5px 0 0;padding-left:18px}.notice{background:var(--warn);border:1px solid #ecd7a2;padding:11px;border-radius:11px;color:#71551a}.maperror{display:flex;height:330px;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.kpis,.workflow,.field{grid-template-columns:1fr}.main{padding:14px}}@page{size:letter;margin:.38in}@media print{.side,.hero,.toolbar,.workflow,.no-print{display:none!important}.app{display:block}.main{padding:0;max-width:none}.page{border:0;padding:0;margin:0 0 .25in}.field{grid-template-columns:1.05fr .95fr;min-height:4.55in;margin:0 0 .18in}.map,.map img,.maperror{height:4.55in;min-height:4.55in}.fieldbody{padding:13px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Acre<span>Fit</span></div><nav><a href="index.html">Dashboard</a><a href="prospects.html">Prospects</a><a href="farmers.html">Farmers & Fields</a><a href="field-analysis.html">Field Analysis</a><a href="whole-farm-plan.html">Whole-Farm Plan</a><a class="active" href="sales-packet.html">Sales Package</a><a href="genetics.html">Seed Genetics</a><a href="data-hub.html">Data Hub</a></nav></aside><main class="main"><div id="app"><div class="card">Loading sales package…</div></div></main></div><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const n=v=>v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:2});const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);let prospects=[],prospect=null,proposal=null,book=null,year=2027;
async function api(u,o={}){const r=await fetch(u,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d}
function topText(obj){if(!obj||typeof obj!=='object')return '—';const e=Object.entries(obj).sort((a,b)=>Number(b[1]||0)-Number(a[1]||0))[0];return e?`${e[0]} ${Math.round(Number(e[1]||0))}%`:'—'}
function proposalUrl(){return proposal?`${location.origin}/farmer-proposal.html?token=${encodeURIComponent(proposal.public_token)}`:''}
function products(){if(!book)return[];const m={};for(const f of book.fields||[]){const k=`${f.brand||''}|${f.product_name||''}`;const x=m[k]||(m[k]={brand:f.brand,product:f.product_name,trait:f.trait_package,acres:0,units:0,value:0,fields:0,price:f.seed_price_per_unit});x.acres+=Number(f.acres||0);x.units+=Number(f.units_required||0);x.value+=Number(f.total_seed_cost||0);x.fields++}return Object.values(m).sort((a,b)=>String(a.product).localeCompare(String(b.product)))}
function hasSample(){return (book?.fields||[]).some(f=>String(f.pricing_source||'').toLowerCase().includes('sample'))}
function mapUrl(f){return `/api/public/proposals/${encodeURIComponent(proposal.public_token)}/fields/${f.field_id}/map-image`}
function fieldCard(f){return `<section class="field"><div class="map"><img src="${mapUrl(f)}" alt="${esc(f.field_name)} map" onerror="this.outerHTML='<div class=&quot;maperror&quot;>Satellite map unavailable.<br>Field data remains available.</div>'"></div><div class="fieldbody"><div class="fieldhead"><div><b>${esc(f.field_name)}</b><div class="muted">${n(f.acres)} ac • ${esc(f.irrigation||'—')} • ${esc(f.crop||'—')}</div></div><span class="pill">${Math.round(Number(f.fit_score||0))}% fit</span></div><div class="seed">${esc(f.brand||'')} ${esc(f.product_name||'')}</div><div class="facts"><div class="fact"><span>Yield Goal</span><b>${n(f.yield_goal)} bu/ac</b></div><div class="fact"><span>Population</span><b>${n(f.target_population)}</b></div><div class="fact"><span>Seed $/Acre</span><b>${money(f.seed_cost_per_acre)}</b></div><div class="fact"><span>Field Seed Cost</span><b>${money(f.total_seed_cost)}</b></div><div class="fact"><span>Units</span><b>${n(f.units_required)}</b></div><div class="fact"><span>Price/Unit</span><b>${money(f.seed_price_per_unit)}</b></div></div><div class="soil"><b>SSURGO: ${esc(f.dominant_soil||'Mapped soil')}</b><div class="muted">AWC 0–150 cm: ${n(f.awc_0_150cm)} • Slope: ${n(f.slope_pct)}% • Drainage: ${esc(topText(f.drainage))}</div></div><div class="reason"><b>Placement logic</b>${(f.reasons||[]).length?`<ul>${f.reasons.slice(0,3).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:'<div class="muted">Matched from mapped soil, water practice, crop and product positioning.</div>'}</div>${f.climate_decision?`<div class="reason" style="border-left-color:#3a6f8f;background:#f2f7fb"><b>2027 climate context</b><div class="small" style="margin-top:5px">${esc(f.climate_decision)}</div></div>`:''}</div></section>`}
async function choose(id){prospect=await api(`/api/prospects/${id}`);try{proposal=await api(`/api/prospects/${id}/proposals/latest?crop_year=${year}`)}catch{proposal=null}book=proposal?await api(`/api/public/proposals/${encodeURIComponent(proposal.public_token)}/field-book-data`):null;render()}
async function generate(){const body={crop_year:year,salesperson_name:document.getElementById('spName').value||null,salesperson_email:document.getElementById('spEmail').value||null,salesperson_phone:document.getElementById('spPhone').value||null,intro_message:document.getElementById('intro').value||null};proposal=await api(`/api/prospects/${prospect.id}/proposals`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});book=await api(`/api/public/proposals/${encodeURIComponent(proposal.public_token)}/field-book-data`);render()}
function emailProposal(){const u=proposalUrl(),subject=encodeURIComponent(`${prospect.prospect_name} ${year} Seed Plan`),body=encodeURIComponent(`Here is your ${year} AcreFit seed plan:\n\n${u}\n\nPlease review the field-by-field maps, soil fit, genetics and seed investment.`);location.href=`mailto:?subject=${subject}&body=${body}`}
function textProposal(){location.href=`sms:?&body=${encodeURIComponent(`Your ${year} AcreFit seed plan is ready: ${proposalUrl()}`)}`}
async function copyLink(){await navigator.clipboard.writeText(proposalUrl());alert('Farmer proposal link copied.')}
async function printReport(){const imgs=[...document.images];await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r})));window.print()}
function render(){const s=proposal?.summary||{},ps=products(),total=book?.estimated_seed_value||s.estimated_seed_value||0;document.getElementById('app').innerHTML=`<div class="hero"><div style="font-size:11px;font-weight:900;letter-spacing:.09em">PLAN → PRESENT → APPROVE → ORDER</div><h1 style="margin:5px 0">Mapped Seed Sales Package</h1><p>${esc(prospect.prospect_name)} • ${year} • Satellite field boundaries, SSURGO soils, seed placement and economics in one farmer-ready report.</p></div><div class="toolbar"><label>Prospect <select onchange="choose(this.value)">${prospects.map(p=>`<option value="${p.id}" ${Number(p.id)===Number(prospect.id)?'selected':''}>${esc(p.prospect_name)}</option>`).join('')}</select></label><label>Year <select onchange="year=Number(this.value);choose(prospect.id)">${[2026,2027,2028,2029].map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select></label><a class="btn secondary" href="whole-farm-plan.html?id=${prospect.id}&year=${year}">Edit Seed Plan</a>${proposal?`<button class="btn secondary" onclick="printReport()">Print / Save PDF</button>`:''}</div><div class="grid kpis"><div class="card kpi"><span class="muted">Planned Acres</span><b>${n(book?.planned_acres||s.planned_acres||0)}</b></div><div class="card kpi"><span class="muted">Selected Fields</span><b>${book?.field_count||s.selected_field_count||0}</b></div><div class="card kpi"><span class="muted">Sold Units</span><b>${n(s.sold_units||0)}</b></div><div class="card kpi"><span class="muted">Seed Investment</span><b>${money(total)}</b></div></div>${book?.climate_outlook?(()=>{const o=book.climate_outlook,p=o.planting||{},s=o.early_summer||{},w=o.winter||{};return `<div class="page"><div class="eyebrow">2027 CLIMATE OUTLOOK</div><h2 style="margin:5px 0 8px">${esc(o.status||'NOAA ENSO Outlook')}</h2><p class="muted">NOAA CPC • ${esc(o.issued||'current outlook')}</p><div class="facts"><div class="fact"><span>Winter</span><b>${w.season?esc(w.season)+' • '+(w.el_nino_pct??'—')+'% El Niño':'—'}</b></div><div class="fact"><span>Planting</span><b>${p.season?esc(p.season)+' • '+(p.el_nino_pct??'—')+'% El Niño':'—'}</b></div><div class="fact"><span>Early Summer</span><b>${s.season?esc(s.season)+' • '+(s.el_nino_pct??'—')+'% El Niño / '+(s.neutral_pct??'—')+'% Neutral':'—'}</b></div></div><div class="reason"><b>How this affects the seed plan</b><div class="small" style="margin-top:5px">AcreFit compares the current ENSO outlook with this farm’s own APH yield and historical rainfall response. Climate does not pick the seed by itself. It changes the weight placed on stress stability, roots, moisture-use efficiency, top-end yield and other traits only when this farm’s history supports that adjustment.</div></div></div>`})():''}<div class="grid workflow"><div class="card"><h2 style="margin-top:0">Build / Refresh Proposal</h2><div class="formgrid"><input id="spName" placeholder="Salesperson name" value="${esc(proposal?.salesperson_name||'')}"><input id="spEmail" placeholder="Email" value="${esc(proposal?.salesperson_email||'')}"><input id="spPhone" placeholder="Phone" value="${esc(proposal?.salesperson_phone||'')}"><div></div><textarea class="full" id="intro" rows="3" placeholder="Message to farmer">${esc(proposal?.intro_message||'We built this plan field-by-field using your mapped soils, irrigation practice, yield goals and selected genetics.')}</textarea></div><button class="btn" style="margin-top:10px" onclick="generate()">${proposal?'Refresh Proposal':'Generate Proposal'}</button></div><div class="card"><h2 style="margin-top:0">Present to Farmer</h2>${proposal?`<div class="share"><div class="muted" style="font-size:10px">Farmer link</div><div style="word-break:break-all;font-weight:800;margin:5px 0 10px">${esc(proposalUrl())}</div><div class="toolbar" style="margin:0"><a class="btn" target="_blank" href="${proposalUrl()}">Open Farmer View</a><button class="btn secondary" onclick="emailProposal()">Email</button><button class="btn secondary" onclick="textProposal()">Text</button><button class="btn secondary" onclick="copyLink()">Copy Link</button></div></div>`:'<div class="muted">Generate the proposal first.</div>'}</div></div>${proposal&&book?`<section class="page"><h2>Dealer Order Summary</h2>${hasSample()?'<div class="notice"><b>Demo sample pricing is active.</b> These prices are illustrative dealer-entered values for testing the full package, not published Channel/Bayer quotes.</div>':''}<table class="table"><thead><tr><th>Product</th><th>Trait</th><th>Acres</th><th>Fields</th><th>Calc. Units</th><th>Sold Units</th><th>Price/Unit</th><th>Est. Value</th></tr></thead><tbody>${ps.map(x=>`<tr><td><b>${esc(x.brand||'')} ${esc(x.product||'')}</b></td><td>${esc(x.trait||'—')}</td><td>${n(x.acres)}</td><td>${x.fields}</td><td>${n(x.units)}</td><td><b>${Math.ceil(x.units-1e-9)}</b></td><td>${money(x.price)}</td><td>${money(x.value)}</td></tr>`).join('')}</tbody></table></section><section class="page"><h2>Farmer Field Book</h2><p class="muted">Each field shows the validated AcreFit boundary over satellite imagery, SSURGO soil context, recommendation logic and seed economics.</p>${book.fields.map(fieldCard).join('')}</section>`:''}`}
async function boot(){prospects=await api('/api/prospects');const params=new URLSearchParams(location.search),id=Number(params.get('id')),y=Number(params.get('year'));if(y)year=y;const p=prospects.find(x=>Number(x.id)===id)||prospects[0];if(!p)throw new Error('No prospects found');await choose(p.id)}boot().catch(e=>document.getElementById('app').innerHTML=`<div class="card"><h2>Unable to load sales package</h2><div class="muted">${esc(e.message)}</div></div>`);
</script></body></html>
