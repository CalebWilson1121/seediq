<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeedIQ — Farmer Seed Plan</title><style>
:root{--green:#176b3a;--dark:#12261a;--muted:#647168;--line:#dfe7df;--bg:#f3f6f2;--soft:#eef6f0;--gold:#9d741a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1080px;margin:auto;padding:24px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{font-size:28px;font-weight:900;color:var(--green)}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--green);color:#fff}.btn.secondary{background:#e5eee8;color:var(--green)}.page,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.page{padding:26px;margin:0 0 18px}.cover{min-height:520px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(140deg,#fff,#edf7ef)}.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:11px;font-weight:900;color:var(--green)}h1{font-size:46px;line-height:1.02;margin:8px 0 12px}h2{margin:0 0 14px;font-size:24px}h3{margin:0 0 6px}.muted{color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fbfdfb}.kpi b{display:block;font-size:25px;margin-top:4px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.field{display:grid;grid-template-columns:1.08fr .92fr;gap:16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0;background:#fff;break-inside:avoid}.mapwrap{min-height:330px;background:#e9eee9}.mapwrap img{display:block;width:100%;height:100%;min-height:330px;object-fit:cover}.details{padding:18px}.fieldhead{display:flex;justify-content:space-between;gap:12px}.pill{display:inline-block;background:var(--soft);color:var(--green);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850}.seed{font-size:22px;font-weight:900;color:var(--green);margin:12px 0}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.fact{border:1px solid var(--line);border-radius:10px;padding:9px}.fact span{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800}.fact b{font-size:14px}.soil{margin-top:12px;background:#f7faf7;border-radius:12px;padding:11px}.soilgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.reason{margin-top:12px;border-left:4px solid var(--green);padding:9px 12px;background:#f4faf5}.reason ul{margin:6px 0 0;padding-left:18px}.notice{background:#fff7e6;border:1px solid #ecd8a8;color:#6f541b;border-radius:12px;padding:12px;margin-top:12px}.approve{padding:22px;text-align:center}.approve input{padding:11px;border:1px solid var(--line);border-radius:8px;min-width:260px}.approved{background:#e8f6ec;color:#175e35;padding:14px;border-radius:12px;font-weight:800}.footer{font-size:10px;color:var(--muted);margin-top:16px}.maperror{display:flex;height:330px;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}@media(max-width:800px){.field{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}h1{font-size:36px}.wrap{padding:12px}}@page{size:letter;margin:.38in}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.topbar,.no-print{display:none!important}.page{border:0;border-radius:0;padding:0;margin:0 0 .25in}.cover{min-height:9.3in;break-after:page}.field{grid-template-columns:1.08fr .92fr;min-height:4.55in;margin:0 0 .18in;break-inside:avoid}.mapwrap,.mapwrap img,.maperror{min-height:4.55in}.details{padding:14px}h1{font-size:40px}.footer{display:block}}
</style></head><body><div class="wrap"><div class="topbar"><div class="brand">SeedIQ</div><div><button class="btn secondary" onclick="printReport()">Print / Save PDF</button></div></div><div id="app"><div class="page">Loading seed plan…</div></div></div><script>
const q=new URLSearchParams(location.search),token=q.get('token');let proposal=null,book=null;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const n=v=>v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:2});const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);
async function api(u,o={}){const r=await fetch(u,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||'Request failed');return d}
function topText(obj){if(!obj||typeof obj!=='object')return '—';const e=Object.entries(obj).sort((a,b)=>Number(b[1]||0)-Number(a[1]||0))[0];return e?`${e[0]} ${Math.round(Number(e[1]||0))}%`:'—'}
function products(){const m={};for(const f of book.fields||[]){const k=`${f.brand||''}|${f.product_name||''}`;const x=m[k]||(m[k]={brand:f.brand,product:f.product_name,trait:f.trait_package,acres:0,units:0,value:0,fields:0,price:f.seed_price_per_unit});x.acres+=Number(f.acres||0);x.units+=Number(f.units_required||0);x.value+=Number(f.total_seed_cost||0);x.fields++}return Object.values(m).sort((a,b)=>String(a.product).localeCompare(String(b.product)))}
function hasSamplePricing(){return (book.fields||[]).some(f=>String(f.pricing_source||'').toLowerCase().includes('sample'))}
function mapUrl(f){return `/api/public/proposals/${encodeURIComponent(token)}/fields/${f.field_id}/map-image`}
function fieldCard(f){const reasons=(f.reasons||[]).slice(0,3);return `<section class="field"><div class="mapwrap"><img src="${mapUrl(f)}" alt="${esc(f.field_name)} field map" onerror="this.outerHTML='<div class=&quot;maperror&quot;>Satellite map unavailable for this field.<br>The seed plan and soil data remain available.</div>'"></div><div class="details"><div class="fieldhead"><div><h3>${esc(f.field_name)}</h3><div class="muted">${n(f.acres)} acres • ${esc(f.irrigation||'—')} • ${esc(f.crop||'—')}</div></div><span class="pill">${Math.round(Number(f.fit_score||0))}% fit</span></div><div class="seed">${esc(f.brand||'')} ${esc(f.product_name||'')}</div><div class="facts"><div class="fact"><span>Yield Goal</span><b>${n(f.yield_goal)} bu/ac</b></div><div class="fact"><span>Population</span><b>${n(f.target_population)}</b></div><div class="fact"><span>Seed Cost / Acre</span><b>${money(f.seed_cost_per_acre)}</b></div><div class="fact"><span>Field Seed Cost</span><b>${money(f.total_seed_cost)}</b></div><div class="fact"><span>Units Required</span><b>${n(f.units_required)}</b></div><div class="fact"><span>Price / Unit</span><b>${money(f.seed_price_per_unit)}</b></div></div><div class="soil"><div class="eyebrow">SSURGO Soil Profile</div><div style="font-weight:850;margin:3px 0 8px">${esc(f.dominant_soil||'Soil mapping available')} ${f.dominant_soil_symbol?'('+esc(f.dominant_soil_symbol)+')':''}</div><div class="soilgrid"><div class="fact"><span>Water Capacity 0–150 cm</span><b>${n(f.awc_0_150cm)}</b></div><div class="fact"><span>Slope</span><b>${n(f.slope_pct)}%</b></div><div class="fact"><span>Drainage</span><b>${esc(topText(f.drainage))}</b></div></div></div><div class="reason"><b>Why this seed fits this field</b>${reasons.length?`<ul>${reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:`<div class="muted">Matched from field crop, irrigation, mapped soil attributes and product positioning.</div>`}</div></div></section>`}
function render(){const ps=products(),total=book.estimated_seed_value||proposal.summary?.estimated_seed_value||0,sold=proposal.summary?.sold_units||Math.ceil(ps.reduce((a,x)=>a+x.units,0));document.getElementById('app').innerHTML=`<section class="page cover"><div><div class="eyebrow">Farm-specific seed placement plan</div><h1>${esc(proposal.prospect_name)}<br><span style="color:var(--green)">${proposal.crop_year} Seed Plan</span></h1><p class="muted">A field-by-field plan built from mapped field boundaries, IRR/NIRR practice, SSURGO soils, yield goals and selected genetics.</p></div><div class="kpis"><div class="kpi"><span class="muted">Planned Acres</span><b>${n(book.planned_acres)}</b></div><div class="kpi"><span class="muted">Fields</span><b>${book.field_count}</b></div><div class="kpi"><span class="muted">Seed Units</span><b>${n(sold)}</b></div><div class="kpi"><span class="muted">Seed Investment</span><b>${money(total)}</b></div></div><div>${proposal.intro_message?`<p>${esc(proposal.intro_message)}</p>`:''}<p class="muted">Prepared${book.salesperson_name?' by '+esc(book.salesperson_name):''}${book.salesperson_phone?' • '+esc(book.salesperson_phone):''}</p>${hasSamplePricing()?'<div class="notice"><b>Demo pricing:</b> Seed costs shown in this sample package are illustrative dealer-entered prices for product testing, not published Channel/Bayer quotes.</div>':''}</div></section><section class="page"><h2>Whole-Farm Seed Package</h2><table class="table"><thead><tr><th>Seed</th><th>Trait</th><th>Acres</th><th>Fields</th><th>Calc. Units</th><th>Price/Unit</th><th>Est. Cost</th></tr></thead><tbody>${ps.map(x=>`<tr><td><b>${esc(x.brand||'')} ${esc(x.product||'')}</b></td><td>${esc(x.trait||'—')}</td><td>${n(x.acres)}</td><td>${x.fields}</td><td>${n(x.units)}</td><td>${money(x.price)}</td><td>${money(x.value)}</td></tr>`).join('')}</tbody></table><div class="notice" style="margin-top:16px"><b>How to read this report:</b> Each field page shows the mapped field on satellite imagery, the dominant SSURGO soil profile, the selected genetic, planting population, yield goal and seed economics. Recommendation reasons are generated deterministically from field conditions and product positioning.</div></section><section class="page"><h2>Field-by-Field Placement</h2><p class="muted">Green outlines are the validated SeedIQ field boundaries over satellite imagery.</p>${(book.fields||[]).map(fieldCard).join('')}</section><section class="page approve no-print"><h2>Plan Approval</h2>${proposal.status==='approved'?`<div class="approved">Approved${proposal.approval_name?' by '+esc(proposal.approval_name):''}. Your salesperson can now finalize the order.</div>`:`<p class="muted">This confirms you want the dealer to move forward with this seed plan. It is not an electronic signature contract.</p><input id="approveName" placeholder="Your name"><button class="btn" style="margin-left:8px" onclick="approve()">Looks good — move forward</button>`}</section><div class="footer">SeedIQ • Soil data: USDA NRCS SSURGO • Planting populations are planning guidance and should be confirmed by your dealer/agronomist for local conditions.</div>`}
async function approve(){const name=document.getElementById('approveName').value.trim();proposal=await api(`/api/public/proposals/${encodeURIComponent(token)}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_name:name||null})});render()}
async function printReport(){const imgs=[...document.images];await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r})));window.print()}
async function boot(){if(!token)throw new Error('Proposal link is missing.');[proposal,book]=await Promise.all([api(`/api/public/proposals/${encodeURIComponent(token)}`),api(`/api/public/proposals/${encodeURIComponent(token)}/field-book-data`)]);render()}boot().catch(e=>document.getElementById('app').innerHTML=`<div class="page"><h2>Unable to load proposal</h2><p class="muted">${esc(e.message)}</p></div>`);
</script></body></html>
