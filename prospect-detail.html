<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SeedIQ — Prospect Field Map</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--green2:#2f8f5b;--dark:#102a1d;--lime:#dff2e5;--warn:#fff5dc;--blue:#3a6d9a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 18px;position:sticky;top:0;height:100vh}.brand{font-size:25px;font-weight:850}.brand span{color:#8fd39f}.subbrand{font-size:12px;color:#a9c1b1;margin-top:4px}nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a:hover,nav a.active{background:#1d4b33}.side-card{margin-top:22px;background:#173c29;border:1px solid #2a6041;border-radius:14px;padding:13px;font-size:12px;color:#cfe0d4;line-height:1.45}.main{padding:28px 32px 48px}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:22px}.hero p{color:#c9ddcf;margin-bottom:0}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.cols{grid-template-columns:minmax(0,1.45fr) minmax(320px,.55fr)}.cols2{grid-template-columns:1fr 1fr}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.muted{color:var(--muted)}.metric{font-size:28px;font-weight:850}.btn{display:inline-block;border:0;background:var(--green);color:#fff;text-decoration:none;border-radius:10px;padding:9px 12px;font-weight:750;cursor:pointer}.btn.secondary{background:#eaf2ed;color:#17452d}.btn.outline{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.5}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.tag{display:inline-block;background:var(--lime);padding:5px 8px;border-radius:999px;font-size:11px;margin:2px 4px 2px 0}.callout{border-left:4px solid var(--green);background:#f5faf6;padding:12px 14px;border-radius:0 10px 10px 0}.callout.warn{border-left-color:#c28a21;background:var(--warn)}.status{font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#eef4f0}.ready{background:#dff2e5;color:#175b35}.pending{background:#fff0d2;color:#855f14}.select,.input{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.cropBtns{display:flex;gap:5px;flex-wrap:wrap}.upload{border:2px dashed #a9c8b2;border-radius:14px;padding:16px;background:#f8fbf8}.map-shell{position:relative}.map{height:540px;border-radius:15px;border:1px solid #cfd9d1;overflow:hidden;background:#dfe8df}.map-overlay{position:absolute;z-index:3;left:12px;top:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:9px;display:flex;gap:7px;box-shadow:0 5px 18px rgba(0,0,0,.12)}.map-overlay button{border:0;border-radius:8px;padding:7px 9px;background:#edf3ef;color:#244833;font-weight:750;cursor:pointer}.map-overlay button.active{background:#173f2a;color:white}.map-note{position:absolute;z-index:3;left:12px;bottom:12px;background:rgba(16,42,29,.92);color:#fff;padding:9px 11px;border-radius:10px;font-size:11px;max-width:340px}.field-cards{display:grid;gap:9px;max-height:540px;overflow:auto;padding-right:2px}.field-card{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff}.field-card:hover,.field-card.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}.field-row{display:flex;justify-content:space-between;gap:8px}.soil-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.soil-cell{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fbfdfb}.soil-cell span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.legend{display:flex;gap:13px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}.source-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.source-box{background:#fbfdfb;border:1px solid var(--line);border-radius:11px;padding:10px}.source-box b{display:block;font-size:12px}.source-box span{font-size:11px;color:var(--muted)}.zero{color:#197342;font-weight:850}.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.kpis,.cols,.cols2,.source-strip{grid-template-columns:1fr}.main{padding:18px}.map{height:430px}.field-cards{max-height:none}}
</style>
</head>
<body><div class="app"><aside class="sidebar"><div class="brand">Seed<span>IQ</span></div><div class="subbrand">Seed Intelligence & Sales Platform</div><nav><a href="index.html">Dashboard</a><a href="prospects.html" class="active">Prospect Intelligence</a><a href="farmers.html">Farmer & Fields</a><a href="field-analysis.html">Field Analysis</a><a href="whole-farm-plan.html">Whole-Farm Plan</a><a href="genetics.html">Seed Genetics</a><a href="data-hub.html">Farm Data Hub</a></nav><div class="side-card"><b>$0 mapping stack</b><br><br>MapLibre GL JS<br>USGS National Map imagery<br>USDA NRCS SSURGO soils<br><br>No Google/Mapbox key required for this build.</div></aside><main class="main"><div id="content"><div class="card">Loading prospect…</div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=new URLSearchParams(location.search).get('id');let prospect=null,planYear=2027,plans=[],map=null,selectedFieldId=null,currentBase='imagery';
async function api(path,o={}){const r=await fetch(path,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
async function loadPlans(){const r=await api('/api/farms/'+prospect.farm_id+'/crop-plans?crop_year='+planYear);plans=r.fields||[]}
function cropCell(f){const crop=f.crop||'';return `<div class="cropBtns"><button class="btn small ${crop==='CORN'?'':'secondary'}" onclick="setCrop(${f.field_id},'CORN')">Corn</button><button class="btn small ${crop==='SOYBEANS'?'':'secondary'}" onclick="setCrop(${f.field_id},'SOYBEANS')">Soy</button><button class="btn small secondary" onclick="setCrop(${f.field_id},null)">Clear</button><button class="btn small secondary" onclick="rotateOne(${f.field_id})">Rotate</button></div><div class="muted" style="margin-top:5px">${crop?esc(crop):'Unassigned'}${f.selected_seed_name?' • Seed: '+esc(f.selected_seed_name):''}</div>`}
function topDistribution(obj){const entries=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]);return entries.length?entries[0][0]:'—'}
function render(){const p=prospect,c=p.farm_context||{},fields=c.fields||[],soilRows=((p.soil_status||{}).fields)||[],soilBy={};soilRows.forEach(x=>soilBy[x.field_id]=x);const ready=soilRows.filter(x=>x.soil_status).length;const mapped=soilRows.filter(x=>x.boundary_geojson).length;const counties=[...new Set(fields.map(f=>f.county).filter(Boolean))];const planBy={};plans.forEach(x=>planBy[x.field_id]=x);document.getElementById('content').innerHTML=`
<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div><a href="prospects.html" class="muted" style="text-decoration:none">← Prospects</a><h1 style="margin:4px 0">${esc(p.prospect_name)}</h1><div class="muted">${counties.map(esc).join(', ')||'Location pending'} • SeedIQ field intelligence workspace</div></div><a class="btn secondary" href="genetics.html">Seed Genetics</a></div>
<div class="grid kpis"><div class="card"><div class="muted">Fields</div><div class="metric">${fields.length}</div></div><div class="card"><div class="muted">Mapped Boundaries</div><div class="metric">${mapped}/${fields.length}</div></div><div class="card"><div class="muted">SSURGO Ready</div><div class="metric">${ready}/${fields.length}</div></div><div class="card"><div class="muted">Planning Year</div><div class="metric">${planYear}</div></div></div>
<div class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.06em">FIELD MAP → SOILS → ANNUAL CROP → GENETICS</div><h2 style="margin:7px 0">MBAR or Mapped SOI becomes the permanent field layer.</h2><p>SeedIQ uses field identity, acreage and geography for the map. Insurance-specific values are not part of the seed-placement workspace. Crop and seed remain year-specific.</p></div>
<div class="source-strip"><div class="source-box"><b>Map engine <span class="zero">$0 license</span></b><span>MapLibre GL JS • open-source renderer</span></div><div class="source-box"><b>Imagery <span class="zero">$0 API key</span></b><span>USGS National Map Imagery Only / Imagery Topo</span></div><div class="source-box"><b>Soils <span class="zero">$0 data fee</span></b><span>USDA NRCS SSURGO / Soil Data Access</span></div></div>
<div class="grid cols" style="margin-top:16px"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">Farm Field Map</h2><div class="legend"><span><i class="swatch" style="background:#e8b948"></i>Corn</span><span><i class="swatch" style="background:#51a66b"></i>Soybeans</span><span><i class="swatch" style="background:#d9e0da"></i>Unassigned</span></div></div><button class="btn outline" onclick="fitFarm()">Fit farm</button></div><div class="map-shell" style="margin-top:11px"><div id="map" class="map"></div><div class="map-overlay"><button id="imageryBtn" class="active" onclick="switchBase('imagery')">Satellite</button><button id="topoBtn" onclick="switchBase('topo')">Imagery + Topo</button></div><div class="map-note">USGS imagery is used as the no-key basemap. Exact MBAR/Mapped SOI polygons are drawn directly from SeedIQ field geometry.</div></div></div>
<div class="card"><h2 style="margin-top:0">Mapped Fields</h2><div id="fieldCards" class="field-cards">${soilRows.length?soilRows.map(s=>fieldCard(s,planBy[s.field_id])).join(''):'<div class="muted">No fields loaded yet.</div>'}</div></div></div>
<div class="grid cols2" style="margin-top:16px"><div class="card"><h2>1. Add / Update Field Map</h2><div class="upload"><label style="display:block;font-size:11px;font-weight:750;text-transform:uppercase;color:var(--muted);margin-bottom:5px">Field source</label><select id="mapDocType" class="select"><option value="AUTO" selected>Auto-detect — recommended</option><option value="MBAR">NAU MBAR</option><option value="SOI">Mapped Schedule of Insurance — field map only</option></select><div style="height:9px"></div><input id="mbarFile" type="file" accept=".pdf,.csv,.xlsx,.xlsm,.json,.geojson"><div class="muted" style="font-size:12px;margin-top:7px">Large PDFs upload directly to secure document storage first, bypassing the webpage request-size limit. SeedIQ then reads stable field attributes, boundaries and location.</div><button id="mbarBtn" class="btn" style="margin-top:10px" onclick="uploadMapDocument()">Upload Field Map</button></div><div id="mbarMsg" class="callout" style="margin-top:10px;display:none"></div></div>
<div class="card"><h2>2. Annual Crop Plan</h2><div class="toolbar"><label>Crop year <select id="yearSel" class="select" onchange="changeYear(this.value)"><option>2026</option><option selected>2027</option><option>2028</option><option>2029</option></select></label><button class="btn secondary" onclick="rotateAll()">Rotate Entire Farm</button><button class="btn secondary" onclick="mapSoils()">Pull / Refresh Soils</button></div><div class="callout"><b>Permanent:</b> field boundary, field identity, acres, soils.<br><b>Annual:</b> crop, population, selected hybrid/variety and recommendation.</div></div></div>
<div class="card" style="margin-top:16px"><h2>3. Crop Assignment + Seed Readiness</h2><table class="table"><thead><tr><th>Field</th><th>Map / Soil</th><th>${planYear} Crop</th><th>Seed Step</th></tr></thead><tbody>${fields.map(f=>{const pf=planBy[f.id]||{field_id:f.id},s=soilBy[f.id]||{};return `<tr><td><b>${esc(f.name)}</b><br><span class="muted">${[f.farm_number,f.tract_number,f.field_number].filter(Boolean).map(esc).join(' / ')||'Field IDs pending'} • ${Number(f.acres||0).toLocaleString()} ac</span></td><td>${s.boundary_geojson?'<span class="status ready">Mapped</span>':'<span class="status pending">Boundary pending</span>'} ${s.soil_status?'<span class="status ready">SSURGO ready</span>':''}<br><span class="muted">${esc(s.dominant_muname||s.location_source||'')}</span></td><td>${cropCell({...pf,field_id:f.id})}</td><td>${pf.crop?`<a class="btn small" href="genetics.html?field_id=${f.id}&crop_year=${planYear}">Select / Rank Seed</a>`:'<span class="muted">Assign crop first</span>'}</td></tr>`}).join('')}</tbody></table></div>`;
setTimeout(()=>initMap(soilRows,planBy),0)}
function fieldCard(s,plan){const drainage=topDistribution(s.drainage_summary);const crop=(plan&&plan.crop)||'';return `<div id="fc-${s.field_id}" class="field-card" onclick="selectField(${s.field_id})"><div class="field-row"><b>${esc(s.name)}</b><b>${Number(s.acres||0).toLocaleString()} ac</b></div><div class="muted" style="font-size:12px;margin-top:3px">${crop?esc(crop):'Crop unassigned'} • ${s.boundary_geojson?'Exact/mapped geometry':'Boundary pending'}</div><div class="soil-grid"><div class="soil-cell"><span>Dominant soil</span><b>${esc(s.dominant_musym||'—')}</b></div><div class="soil-cell"><span>Drainage</span><b>${esc(drainage)}</b></div><div class="soil-cell"><span>AWC 0–150cm</span><b>${s.weighted_aws150_cm!=null?Number(s.weighted_aws150_cm).toFixed(1)+' cm':'—'}</b></div><div class="soil-cell"><span>Slope</span><b>${s.weighted_slope_pct!=null?Number(s.weighted_slope_pct).toFixed(1)+'%':'—'}</b></div></div></div>`}
function initMap(soilRows,planBy){if(!document.getElementById('map')||typeof maplibregl==='undefined')return;if(map){map.remove();map=null}map=new maplibregl.Map({container:'map',center:[-96.2,39.75],zoom:7.2,style:{version:8,sources:{imagery:{type:'raster',tiles:['https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'USGS The National Map'},topo:{type:'raster',tiles:['https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'USGS The National Map'}},layers:[{id:'imagery',type:'raster',source:'imagery'},{id:'topo',type:'raster',source:'topo',layout:{visibility:'none'}}]}});map.addControl(new maplibregl.NavigationControl(),'top-right');map.on('load',()=>{const features=soilRows.filter(s=>s.boundary_geojson).map(s=>({type:'Feature',id:s.field_id,properties:{field_id:s.field_id,name:s.name,acres:Number(s.acres||0),crop:(planBy[s.field_id]||{}).crop||'',soil:s.dominant_muname||s.dominant_musym||'Soil pending'},geometry:s.boundary_geojson}));const points=soilRows.filter(s=>!s.boundary_geojson&&s.centroid_lon&&s.centroid_lat).map(s=>({type:'Feature',properties:{field_id:s.field_id,name:s.name,acres:Number(s.acres||0)},geometry:{type:'Point',coordinates:[Number(s.centroid_lon),Number(s.centroid_lat)]}}));map.addSource('fields',{type:'geojson',data:{type:'FeatureCollection',features}});map.addLayer({id:'field-fill',type:'fill',source:'fields',paint:{'fill-color':['match',['get','crop'],'CORN','#e8b948','SOYBEANS','#51a66b','#d9e0da'],'fill-opacity':.30}});map.addLayer({id:'field-line',type:'line',source:'fields',paint:{'line-color':'#ffffff','line-width':2.4}});map.addLayer({id:'field-label',type:'symbol',source:'fields',layout:{'text-field':['concat',['get','name'],'\n',['to-string',['get','acres']],' ac'],'text-size':12,'text-font':['Open Sans Regular'],'text-allow-overlap':false},paint:{'text-color':'#fff','text-halo-color':'#17331f','text-halo-width':1.5}});map.addSource('field-points',{type:'geojson',data:{type:'FeatureCollection',features:points}});map.addLayer({id:'field-points',type:'circle',source:'field-points',paint:{'circle-radius':7,'circle-color':'#ffffff','circle-stroke-color':'#1f6f43','circle-stroke-width':3}});map.on('click','field-fill',e=>{const f=e.features&&e.features[0];if(!f)return;selectField(Number(f.properties.field_id));new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<b>${esc(f.properties.name)}</b><br>${Number(f.properties.acres).toLocaleString()} ac<br>${esc(f.properties.crop||'Crop unassigned')}<br>${esc(f.properties.soil)}`).addTo(map)});map.on('click','field-points',e=>{const f=e.features&&e.features[0];if(f)selectField(Number(f.properties.field_id))});map.on('mouseenter','field-fill',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','field-fill',()=>map.getCanvas().style.cursor='');fitFarm()})}
function boundsFromGeometry(geom,b){if(!geom)return;b=b||new maplibregl.LngLatBounds();const walk=c=>{if(typeof c[0]==='number')b.extend(c);else c.forEach(walk)};walk(geom.coordinates);return b}
function fitFarm(){if(!map||!prospect)return;const rows=((prospect.soil_status||{}).fields)||[];let b=new maplibregl.LngLatBounds(),has=false;rows.forEach(s=>{if(s.boundary_geojson){boundsFromGeometry(s.boundary_geojson,b);has=true}else if(s.centroid_lon&&s.centroid_lat){b.extend([Number(s.centroid_lon),Number(s.centroid_lat)]);has=true}});if(has&&!b.isEmpty())map.fitBounds(b,{padding:55,maxZoom:16,duration:650})}
function switchBase(which){currentBase=which;if(!map)return;map.setLayoutProperty('imagery','visibility',which==='imagery'?'visible':'none');map.setLayoutProperty('topo','visibility',which==='topo'?'visible':'none');document.getElementById('imageryBtn')?.classList.toggle('active',which==='imagery');document.getElementById('topoBtn')?.classList.toggle('active',which==='topo')}
function selectField(fieldId){selectedFieldId=fieldId;document.querySelectorAll('.field-card').forEach(x=>x.classList.remove('active'));document.getElementById('fc-'+fieldId)?.classList.add('active');const s=((prospect.soil_status||{}).fields||[]).find(x=>x.field_id===fieldId);if(map&&s){if(s.boundary_geojson){let b=new maplibregl.LngLatBounds();boundsFromGeometry(s.boundary_geojson,b);map.fitBounds(b,{padding:85,maxZoom:17,duration:500})}else if(s.centroid_lon&&s.centroid_lat)map.flyTo({center:[Number(s.centroid_lon),Number(s.centroid_lat)],zoom:15})}}
async function load(){if(!id){document.getElementById('content').innerHTML='<div class="card">No prospect ID supplied.</div>';return}prospect=await api('/api/prospects/'+id);await loadPlans();render()}
async function changeYear(v){planYear=Number(v);await loadPlans();render();setTimeout(()=>{const s=document.getElementById('yearSel');if(s)s.value=String(planYear)},0)}
async function setCrop(fieldId,crop){await api('/api/fields/'+fieldId+'/crop',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({crop_year:planYear,crop})});await loadPlans();render()}
async function rotateOne(fieldId){try{await api('/api/fields/'+fieldId+'/rotate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from_year:planYear-1,to_year:planYear})});await loadPlans();render()}catch(e){alert(e.message)}}
async function rotateAll(){const r=await api('/api/farms/'+prospect.farm_id+'/rotate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from_year:planYear-1,to_year:planYear})});await loadPlans();render();if(r.skipped?.length)alert(r.rotated+' fields rotated. '+r.skipped.length+' need manual crop assignment.')}
async function uploadMapDocument(){const f=document.getElementById('mbarFile').files[0],m=document.getElementById('mbarMsg'),b=document.getElementById('mbarBtn'),selectedType=document.getElementById('mapDocType').value;if(!f)return alert('Choose a mapped field document.');m.style.display='block';m.className='callout';m.textContent='Preparing secure upload…';b.disabled=true;try{const signed=await api('/api/uploads/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,content_type:f.type||'application/octet-stream'})});m.textContent='Uploading document directly to secure storage…';const uploadBody=new FormData();uploadBody.append('cacheControl','3600');uploadBody.append('',f);const up=await fetch(signed.signed_url,{method:'PUT',body:uploadBody});if(!up.ok){let txt='';try{txt=await up.text()}catch{}throw new Error('Secure upload failed (HTTP '+up.status+') '+txt.slice(0,140))}m.textContent='Upload complete. Reading fields and mapping boundaries…';const docType=selectedType==='AUTO'?null:selectedType;const r=await api('/api/uploads/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({object_path:signed.object_path,original_name:f.name,document_type:docType,target_farm_id:prospect.farm_id,reprocess:false})});m.innerHTML='<b>Field source processed.</b> '+(r.fields_created_or_updated||0)+' fields created/updated. '+((r.warnings||[]).map(esc).join(' ')||'');prospect=await api('/api/prospects/'+id);await loadPlans();render()}catch(e){m.className='callout warn';m.innerHTML='<b>Field import needs mapping work.</b> '+esc(e.message)}finally{b.disabled=false}}
async function mapSoils(){try{await api('/api/prospects/'+id+'/soils/enrich?force=false',{method:'POST'});prospect=await api('/api/prospects/'+id);render()}catch(e){alert(e.message)}}
load();
</script></body></html>
