<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AcreFit — Field Analysis</title>
<style>
:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d;--lime:#dff2e5;--warn:#fff3d8;--red:#fde8e7}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 18px;position:sticky;top:0;height:100vh}.brand{font-size:25px;font-weight:900}.brand span{color:#8fd39f}.subbrand{font-size:12px;color:#a9c1b1;margin-top:4px}nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a:hover,nav a.active{background:#1d4b33}.main{padding:28px 32px 48px}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:22px}.hero p{color:#c9ddcf;margin:6px 0 0}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.cols{grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.muted{color:var(--muted)}.metric{font-size:28px;font-weight:850}.btn{display:inline-block;border:0;background:var(--green);color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;text-decoration:none;cursor:pointer}.btn.secondary{background:#eaf2ed;color:#17452d}.btn.outline{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.5}.select,.input{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--lime);font-size:11px;font-weight:750;margin:2px 4px 2px 0}.tag.warn{background:var(--warn);color:#805c17}.callout{border-left:4px solid var(--green);background:#f5faf6;padding:12px 14px;border-radius:0 10px 10px 0}.callout.warn{border-left-color:#c28a21;background:var(--warn)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}.table th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}.field-list{display:grid;gap:7px;max-height:610px;overflow:auto}.field-item{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;cursor:pointer}.field-item.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green);background:#f8fcf9}.field-item:hover{border-color:#8db49a}.score{font-size:26px;font-weight:900;color:var(--green)}.rec{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}.rec.top{border:2px solid var(--green);background:#fbfefc}.rec-head{display:flex;justify-content:space-between;gap:10px}.rule{font-size:12px;padding:7px 9px;background:#f7faf8;border-radius:8px;margin:5px 0}.risk{display:grid;grid-template-columns:145px 1fr 48px;gap:10px;align-items:center;font-size:12px;margin:10px 0}.bar{height:8px;background:#e8eee9;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#2f8f5b;border-radius:999px}.workflow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px;font-size:12px}.workflow a{color:#17452d;text-decoration:none;font-weight:750}.workflow .current{background:#eaf2ed;padding:5px 8px;border-radius:999px}.loading{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.kpis,.cols{grid-template-columns:1fr}.main{padding:18px}}
</style><link rel="icon" href="/acrefit-icon.svg"></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><img src="/acrefit-logo-light.svg" alt="AcreFit" style="height:42px;width:auto;max-width:195px;display:block"></div><div class="subbrand">Field Intelligence & Seed Sales Platform</div><nav><a href="dealer-demo.html">Dashboard</a><a id="farmNav" href="prospects.html">Farmer & Fields</a><a href="#" class="active">Field Analysis</a><a id="planNav" href="whole-farm-plan.html">Whole-Farm Plan</a><a href="genetics.html">Seed Genetics</a><a href="data-hub.html">Farm Data Hub</a></nav><div class="callout" style="margin-top:24px;background:#173c29;color:#d6e7db;border-left-color:#79bf91"><b>Field Analysis</b><br><br>Field evidence → agronomy rules → genetics fit → selection → whole-farm plan.</div></aside><main class="main"><div id="content" class="loading">Loading live field analysis…</div></main></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const qs=new URLSearchParams(location.search);let prospectId=Number(qs.get('id')),fieldId=Number(qs.get('field')),year=Number(qs.get('year'))||2027;
let prospect=null,plans=[],fields=[],soilRows=[],current=null,fit=null;
async function api(path,o={}){const r=await fetch(path,o);let d={};try{d=await r.json()}catch{}if(r.status===401){location='/login.html';throw new Error('Sign in required')}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
function num(v,d=0){return v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:d})}
function riskValue(kind){
  if(!current)return 0;
  const soil=current.soil||{},ctx=fit?.field?.aph_production_context||{},irr=(current.plan?.irrigation||current.field?.irrigation||'').toUpperCase();
  if(kind==='water'){let x=irr==='NIRR'?45:18;if(soil.weighted_aws150_cm!=null)x+=Math.max(0,28-Number(soil.weighted_aws150_cm))*3;const s=Number(ctx.hot_dry_sensitivity||0);x+=s*100;return Math.max(5,Math.min(95,x))}
  if(kind==='variability'){const s=ctx.stability_score;return s==null?35:Math.max(5,Math.min(95,100-Number(s)))}
  if(kind==='drainage'){const d=soil.drainage_summary||{};let bad=0;Object.entries(d).forEach(([k,v])=>{if(/poor/i.test(k))bad+=Number(v||0)});return Math.max(5,Math.min(95,bad))}
  if(kind==='slope'){return Math.max(5,Math.min(95,Number(soil.weighted_slope_pct||0)*8))}
  return 25;
}
function riskRow(label,key){const v=Math.round(riskValue(key));return `<div class="risk"><span>${esc(label)}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}</b></div>`}
function currentIndex(){return fields.findIndex(x=>Number(x.id)===Number(fieldId))}
function nextFieldId(){const i=currentIndex();if(i<0||!fields.length)return null;return Number(fields[(i+1)%fields.length].id)}
function fieldHref(fid){return '/field-analysis.html?id='+prospectId+'&field='+fid+'&year='+year}
function fieldListHtml(){return fields.map(f=>{const p=plans.find(x=>Number(x.field_id)===Number(f.id))||{},s=soilRows.find(x=>Number(x.field_id)===Number(f.id))||{};return `<div class="field-item ${Number(f.id)===Number(fieldId)?'active':''}" onclick="location='${fieldHref(f.id)}'"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(f.name)}</b><span>${num(f.acres,1)} ac</span></div><div class="muted" style="font-size:11px;margin-top:3px">${esc(p.crop||f.crop||'Crop unassigned')} • ${s.soil_status?'Soils ready':'Soils pending'}${p.selected_seed_name?' • '+esc(p.selected_seed_name):''}</div></div>`}).join('')}
function recommendationHtml(r,i){const rules=(r.agronomy_rules_fired||[]).slice(0,4);return `<div class="rec ${i===0?'top':''}"><div class="rec-head"><div><div class="muted" style="font-size:11px;font-weight:800">#${i+1} ${i===0?'TOP FIELD FIT':''}</div><h3 style="margin:3px 0 5px">${esc(r.product_name)}</h3><span class="tag">${r.relative_maturity??'—'} RM</span><span class="tag">${esc(r.trait_package||'')}</span></div><div style="text-align:right"><div class="score">${Number(r.fit_score||0).toFixed(1)}%</div><div class="muted" style="font-size:11px">Agronomy ${r.agronomy_score!=null?Number(r.agronomy_score).toFixed(0):'—'}/100</div></div></div><div style="font-size:12px;line-height:1.5;margin-top:8px">${(r.reasons||[]).slice(0,5).map(x=>'• '+esc(x)).join('<br>')}</div>${rules.length?`<details style="margin-top:9px"><summary style="cursor:pointer;font-size:12px;font-weight:800;color:#1f6f43">Research-backed rules</summary><div style="margin-top:6px">${rules.map(x=>`<div class="rule"><b>${esc(x.label)}</b><br>${esc(x.evidence)}</div>`).join('')}</div></details>`:''}<div style="margin-top:10px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><div><b>Population: ${num(r.recommended_population)}</b></div><button class="btn ${i?'secondary':''}" onclick="chooseSeed(${r.seed_product_id},${r.recommended_population})">Use This Product</button></div></div>`}
async function chooseSeed(seedProductId,pop){const p=current.plan||{},unitSize=(current.crop==='CORN'?80000:140000);await api('/api/fields/'+fieldId+'/seed-plan',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({crop_year:year,yield_goal:p.yield_goal??fit?.field?.aph_production_context?.aph_yield_goal??null,target_population:pop,seed_product_id:seedProductId,seed_price_per_unit:p.seed_price_per_unit??null,seeds_per_unit:p.seeds_per_unit??unitSize,pricing_source:p.pricing_source||'dealer_input'})});await loadField(false)}
async function loadField(renderLoading=true){if(renderLoading)document.getElementById('content').innerHTML='<div class="loading">Analyzing field…</div>';const field=fields.find(x=>Number(x.id)===Number(fieldId))||fields[0];if(!field){document.getElementById('content').innerHTML='<div class="card">No fields found for this farm.</div>';return}fieldId=Number(field.id);const plan=plans.find(x=>Number(x.field_id)===fieldId)||{};const soil=soilRows.find(x=>Number(x.field_id)===fieldId)||{};const crop=(plan.crop||field.crop||'').toUpperCase();current={field,plan,soil,crop};fit=null;if(crop==='CORN'||crop==='SOYBEANS'){fit=await api('/api/fields/'+fieldId+'/channel-fit?crop_year='+year+'&limit=5').catch(e=>({error:e.message,recommendations:[]}))}render()}
function render(){const f=current.field,p=current.plan,s=current.soil,ctx=fit?.field?.aph_production_context||{},recs=fit?.recommendations||[],ni=nextFieldId();farmNav.href='/prospect-detail.html?id='+prospectId;planNav.href='/whole-farm-plan.html?id='+prospectId+'&year='+year;document.getElementById('content').innerHTML=`
<div class="workflow"><a href="/prospect-detail.html?id=${prospectId}">Farm & Fields</a><span>›</span><span class="current">Field Analysis</span><span>›</span><a href="/whole-farm-plan.html?id=${prospectId}&year=${year}">Whole-Farm Plan</a><span>›</span><span class="muted">Farmer Proposal</span></div>
<div class="row"><div><a class="muted" style="text-decoration:none" href="/prospect-detail.html?id=${prospectId}">← Back to ${esc(prospect.prospect_name)}</a><h1 style="margin:5px 0">${esc(f.name)}</h1><div class="muted">${num(f.acres,1)} acres • ${esc(p.irrigation||f.irrigation||'Practice pending')} • ${esc(current.crop||'Crop unassigned')} • ${year}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn secondary" href="/prospect-detail.html?id=${prospectId}">Farm Map</a>${ni?`<a class="btn secondary" href="${fieldHref(ni)}">Next Field →</a>`:''}<a class="btn" href="/whole-farm-plan.html?id=${prospectId}&year=${year}">Whole-Farm Plan →</a></div></div>
<div class="grid kpis"><div class="card"><div class="muted">Selected Seed</div><div class="metric" style="font-size:20px">${esc(p.selected_seed_name||'Not selected')}</div></div><div class="card"><div class="muted">APH Years</div><div class="metric">${ctx.year_count??0}</div></div><div class="card"><div class="muted">APH Avg Yield</div><div class="metric">${ctx.average_yield!=null?num(ctx.average_yield,1):'—'}</div></div><div class="card"><div class="muted">Yield Stability</div><div class="metric">${ctx.stability_score!=null?Math.round(ctx.stability_score)+'/100':'—'}</div></div></div>
<div class="hero"><div style="font-size:11px;font-weight:850;letter-spacing:.06em">FIELD EVIDENCE → AGRONOMY → GENETIC FIT</div><h2 style="margin:6px 0">Why should this seed go on this field?</h2><p>AcreFit combines mapped soil, water environment, management, matched APH/weather history, neutral Extension agronomy rules and the dealer's genetics catalog.</p></div>
<div class="grid cols" style="margin-top:16px"><div>
<div class="card"><div class="row"><div><h2 style="margin:0">Field Evidence</h2><div class="muted" style="font-size:12px">Permanent farm data used in the recommendation.</div></div><span class="tag">${s.boundary_geojson?'Exact boundary':'Boundary pending'}</span></div><table class="table" style="margin-top:10px"><tbody><tr><td>Dominant soil</td><td><b>${esc(s.dominant_muname||s.dominant_musym||'—')}</b></td></tr><tr><td>AWC 0–150cm</td><td><b>${s.weighted_aws150_cm!=null?Number(s.weighted_aws150_cm).toFixed(1)+' cm':'—'}</b></td></tr><tr><td>Slope</td><td><b>${s.weighted_slope_pct!=null?Number(s.weighted_slope_pct).toFixed(1)+'%':'—'}</b></td></tr><tr><td>Drainage</td><td><b>${esc(Object.keys(s.drainage_summary||{})[0]||'—')}</b></td></tr><tr><td>APH recent 5-year avg</td><td><b>${ctx.recent_5yr_average!=null?num(ctx.recent_5yr_average,1):'—'}</b></td></tr><tr><td>Hot/dry APH downside</td><td><b>${ctx.hot_dry_sensitivity!=null?Math.round(Number(ctx.hot_dry_sensitivity)*100)+'%':'Insufficient evidence'}</b></td></tr></tbody></table></div>
<div class="card" style="margin-top:16px"><h2 style="margin-top:0">Ranked Genetics</h2>${current.crop!=='CORN'&&current.crop!=='SOYBEANS'?'<div class="callout warn"><b>Assign Corn or Soybeans first.</b><br>Go back to Farm & Fields, assign the planning crop, then return here.</div>':fit?.error?`<div class="callout warn">${esc(fit.error)}</div>`:recs.length?recs.map(recommendationHtml).join(''):'<div class="muted">No eligible products found.</div>'}</div>
</div>
<div>
<div class="card"><h2 style="margin-top:0">Field Risk Signals</h2>${riskRow('Water stress','water')}${riskRow('Yield variability','variability')}${riskRow('Drainage pressure','drainage')}${riskRow('Slope/root pressure','slope')}<div class="muted" style="font-size:11px;margin-top:10px">These are AcreFit planning signals derived from available field evidence, not measured disease probabilities.</div></div>
<div class="card" style="margin-top:16px"><h2 style="margin-top:0">Workflow</h2><div class="callout"><b>1. Review field evidence</b><br>Confirm the field conditions make sense.</div><div class="callout" style="margin-top:8px"><b>2. Compare top genetics</b><br>Use fit, agronomy score and rule evidence.</div><div class="callout" style="margin-top:8px"><b>3. Select a product</b><br>The choice writes directly into the ${year} whole-farm plan.</div><div style="display:grid;gap:8px;margin-top:12px"><a class="btn" href="/whole-farm-plan.html?id=${prospectId}&year=${year}">Review Whole-Farm Plan</a>${ni?`<a class="btn secondary" href="${fieldHref(ni)}">Analyze Next Field</a>`:''}<a class="btn outline" href="/prospect-detail.html?id=${prospectId}">Back to Farm Map</a></div></div>
<div class="card" style="margin-top:16px"><h2 style="margin-top:0">Farm Fields</h2><div class="field-list">${fieldListHtml()}</div></div>
</div></div>`}
async function boot(){if(!prospectId){const ps=await api('/api/prospects');if(!ps.length)throw new Error('No prospect farms found');prospectId=Number(ps[0].id)}prospect=await api('/api/prospects/'+prospectId);fields=(prospect.farm_context||{}).fields||[];soilRows=(prospect.soil_status||{}).fields||[];const r=await api('/api/farms/'+prospect.farm_id+'/crop-plans?crop_year='+year);plans=r.fields||[];if(!fieldId&&fields.length)fieldId=Number(fields[0].id);await loadField(false)}
boot().catch(e=>document.getElementById('content').innerHTML='<div class="card"><b>Could not load Field Analysis.</b><br>'+esc(e.message)+'</div>');
</script><script src="/activity.js"></script></body></html>
