<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SeedIQ — Farmer & Fields</title>
<style>
:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d;--lime:#dff2e5;--warn:#fff4dc;--blue:#eaf2ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 18px;position:sticky;top:0;height:100vh}.brand{font-size:25px;font-weight:900}.brand span{color:#8fd39f}.subbrand{font-size:12px;color:#a9c1b1;margin-top:4px}nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a:hover,nav a.active{background:#1d4b33}.main{padding:28px 32px 48px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.cols{grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:22px}.hero p{color:#c9ddcf}.muted{color:var(--muted)}.metric{font-size:28px;font-weight:900}.btn{display:inline-block;border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none;background:var(--green);color:#fff}.btn.secondary{background:#eaf2ed;color:#17452d}.btn.outline{background:white;color:var(--ink);border:1px solid var(--line)}.btn.small{padding:6px 9px;font-size:12px}.select,.input{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.tag{display:inline-block;background:#eef4f0;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:750;margin:2px 4px 2px 0}.tag.good{background:#dff2e5;color:#175b35}.tag.warn{background:var(--warn);color:#855f14}.tag.blue{background:var(--blue);color:#315d8a}.callout{border-left:4px solid var(--green);background:#f5faf6;padding:12px 14px;border-radius:0 10px 10px 0}.callout.warn{border-left-color:#c28a21;background:var(--warn)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.task{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.task:last-child{border-bottom:0}.field-row{display:grid;grid-template-columns:minmax(160px,1.3fr) 90px 110px 1.4fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.field-row:last-child{border-bottom:0}.statusline{font-size:11px}.modal{display:none;position:fixed;inset:0;background:rgba(7,21,14,.62);z-index:50;padding:40px;overflow:auto}.modal.open{display:block}.modal-card{width:min(1000px,96vw);margin:auto;background:#fff;border-radius:18px;padding:22px}.history-year{display:grid;grid-template-columns:70px 100px 110px 1.1fr 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;font-size:12px}.workflow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:12px}.workflow a{color:#17452d;text-decoration:none;font-weight:750}.workflow .current{background:#eaf2ed;padding:5px 8px;border-radius:999px}.side-card{margin-top:24px;background:#173c29;border:1px solid #2a6041;border-radius:14px;padding:14px;font-size:12px;color:#cfe0d4;line-height:1.45}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.kpis,.cols{grid-template-columns:1fr}.main{padding:18px}.field-row{grid-template-columns:1fr}.history-year{grid-template-columns:1fr 1fr}.modal{padding:15px}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand">Seed<span>IQ</span></div><div class="subbrand">Seed Intelligence & Sales Platform</div><nav><a href="dealer-demo.html">Dashboard</a><a href="farmers.html" class="active">Farmer & Fields</a><a href="field-analysis.html">Field Analysis</a><a href="whole-farm-plan.html">Whole-Farm Plan</a><a href="genetics.html">Seed Genetics</a><a href="data-hub.html">Farm Data Hub</a></nav><div class="side-card"><b>Permanent Farm Record</b><br><br>This tab answers one question: what do we know about this farmer and every field they operate?</div></aside><main class="main"><div id="content"><div class="card">Loading farmer record…</div></div></main></div>
<div id="historyModal" class="modal" onclick="if(event.target===this)closeHistory()"><div class="modal-card"><div class="row"><div><div class="muted" style="font-size:11px;font-weight:800">FIELD HISTORY</div><h2 id="historyTitle" style="margin:4px 0"></h2></div><button class="btn secondary" onclick="closeHistory()">Close</button></div><div id="historyBody"></div></div></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const qs=new URLSearchParams(location.search);let prospectId=Number(qs.get('id'))||null,year=Number(qs.get('year'))||2027;
let prospects=[],prospect=null,fields=[],soil=[],plans=[],historyPlans={},profile={fields:[]};
async function api(u,o={}){const r=await fetch(u,o);let d={};try{d=await r.json()}catch{}if(r.status===401){location='/login.html';throw new Error('Sign in required')}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}
const fmt=(v,d=0)=>v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:d});
function fieldProfile(fid){return (profile.fields||[]).find(x=>Number(x.field_id||x.id)===Number(fid))||{}}
function soilFor(fid){return soil.find(x=>Number(x.field_id)===Number(fid))||{}}
function planFor(fid,y=year){return (historyPlans[y]||plans).find(x=>Number(x.field_id)===Number(fid))||{}}
function readiness(f){const s=soilFor(f.id),p=planFor(f.id),pf=fieldProfile(f.id),tags=[];tags.push(s.boundary_geojson?'<span class="tag good">Mapped</span>':'<span class="tag warn">Map needed</span>');tags.push(s.soil_status?'<span class="tag good">Soils</span>':'<span class="tag warn">Soils needed</span>');tags.push((pf.years||[]).length?'<span class="tag good">APH '+(pf.years||[]).length+' yrs</span>':'<span class="tag warn">APH needed</span>');tags.push(p.crop?'<span class="tag blue">'+esc(p.crop)+'</span>':'<span class="tag warn">'+year+' crop</span>');if(p.selected_seed_name)tags.push('<span class="tag good">Seed selected</span>');return tags.join('')}
function tasks(){
 const out=[];fields.forEach(f=>{const s=soilFor(f.id),p=planFor(f.id),pf=fieldProfile(f.id);if(!s.boundary_geojson)out.push({field:f,text:'Confirm exact field boundary',action:'/prospect-detail.html?id='+prospectId});else if(!s.soil_status)out.push({field:f,text:'Pull SSURGO soils',action:'/prospect-detail.html?id='+prospectId});if(!(pf.years||[]).length)out.push({field:f,text:'Attach/update APH history',action:'/prospect-detail.html?id='+prospectId});if(!p.crop)out.push({field:f,text:'Assign '+year+' crop',action:'/prospect-detail.html?id='+prospectId});if(p.crop&&!p.selected_seed_product_id)out.push({field:f,text:'Analyze and choose seed',action:'/field-analysis.html?id='+prospectId+'&field='+f.id+'&year='+year})});return out}
function fieldRows(){return fields.map(f=>{const p=planFor(f.id),pf=fieldProfile(f.id);const aphYears=(pf.years||[]).length;return `<div class="field-row"><div><b>${esc(f.name)}</b><div class="muted" style="font-size:11px">${esc(f.county||'')} ${esc(f.state||'')}</div></div><div><b>${fmt(f.acres,1)}</b><div class="muted" style="font-size:10px">acres</div></div><div>${esc(p.irrigation||f.irrigation||'—')}</div><div class="statusline">${readiness(f)}</div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn small secondary" onclick="openHistory(${f.id})">History</button><a class="btn small secondary" href="/field-analysis.html?id=${prospectId}&field=${f.id}&year=${year}">Analyze</a><a class="btn small outline" href="/prospect-detail.html?id=${prospectId}">Edit</a></div></div>`}).join('')}
function annualChangeSummary(){const current=historyPlans[year]||plans,prior=historyPlans[year-1]||[];let cropChanges=0,newSelections=0;fields.forEach(f=>{const a=current.find(x=>Number(x.field_id)===Number(f.id))||{},b=prior.find(x=>Number(x.field_id)===Number(f.id))||{};if(a.crop&&b.crop&&a.crop!==b.crop)cropChanges++;if(a.selected_seed_product_id&&!b.selected_seed_product_id)newSelections++});const aphReady=fields.filter(f=>(fieldProfile(f.id).years||[]).length).length;return {cropChanges,newSelections,aphReady}}
function render(){const totalAc=fields.reduce((s,f)=>s+Number(f.acres||0),0),mapped=fields.filter(f=>soilFor(f.id).boundary_geojson).length,aphReady=fields.filter(f=>(fieldProfile(f.id).years||[]).length).length,t=tasks(),changes=annualChangeSummary(),farm=(prospect.farm_context||{}).farm||{},counties=[...new Set(fields.map(f=>f.county).filter(Boolean))];document.getElementById('content').innerHTML=`
<div class="workflow"><a href="dealer-demo.html">Dashboard</a><span>›</span><span class="current">Farmer & Fields</span><span>›</span><span class="muted">Field Analysis</span><span>›</span><span class="muted">Whole-Farm Plan</span></div>
<div class="row"><div><div class="muted" style="font-size:11px;font-weight:800">PERMANENT CUSTOMER RECORD</div><h1 style="margin:4px 0">${esc(prospect.prospect_name)}</h1><div class="muted">${esc(prospect.producer_name||'Producer')} • ${counties.map(esc).join(', ')||'Location pending'} • ${fmt(totalAc,0)} acres</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><select class="select" onchange="chooseProspect(this.value)">${prospects.map(p=>`<option value="${p.id}" ${Number(p.id)===Number(prospectId)?'selected':''}>${esc(p.prospect_name)}</option>`).join('')}</select><a class="btn secondary" href="/prospect-detail.html?id=${prospectId}">Manage Farm Data</a><a class="btn" href="/whole-farm-plan.html?id=${prospectId}&year=${year}">Build Farm Plan →</a></div></div>
<div class="grid kpis"><div class="card"><div class="muted">Total Acres</div><div class="metric">${fmt(totalAc)}</div></div><div class="card"><div class="muted">Fields</div><div class="metric">${fields.length}</div></div><div class="card"><div class="muted">Mapped</div><div class="metric">${mapped}/${fields.length}</div></div><div class="card"><div class="muted">APH History Ready</div><div class="metric">${aphReady}/${fields.length}</div></div></div>
<div class="hero"><div style="font-size:11px;font-weight:850;letter-spacing:.06em">BUILD ONCE → MAINTAIN WHAT CHANGES</div><h2 style="margin:6px 0">The permanent operating record for this farmer.</h2><p>Fields, identities, APH history, management and seed decisions stay with the farm. New ground gets added; existing ground keeps accumulating history.</p></div>
<div class="grid cols" style="margin-top:16px">
<div>
<div class="card"><div class="row"><div><h2 style="margin:0">Field Inventory</h2><div class="muted" style="font-size:12px">Status and entry points — not another recommendation screen.</div></div><select class="select" onchange="year=Number(this.value);loadYear(year)">${[2026,2027,2028,2029].map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select></div><div style="margin-top:10px">${fieldRows()}</div></div>
<div class="card" style="margin-top:16px"><div class="row"><div><h2 style="margin:0">Farm History Foundation</h2><div class="muted" style="font-size:12px">This is where SeedIQ's long-term advantage compounds.</div></div></div><div class="callout" style="margin-top:10px"><b>Today:</b> APH yield + weather history are attached to the permanent field record.</div><div class="callout" style="margin-top:8px"><b>Now building:</b> seed product selections are retained by planning year.</div><div class="callout" style="margin-top:8px"><b>Future intelligence:</b> compare hybrid/variety × realized yield × soil × weather × management on the same field over time.</div></div>
</div>
<div>
<div class="card"><h2 style="margin-top:0">Needs Attention <span class="tag ${t.length?'warn':'good'}">${t.length}</span></h2>${t.length?t.slice(0,10).map(x=>`<div class="task"><div><b>${esc(x.field.name)}</b><div class="muted" style="font-size:11px">${esc(x.text)}</div></div><a class="btn small secondary" href="${x.action}">Fix →</a></div>`).join(''):'<div class="callout"><b>Farm record is caught up.</b><br>No obvious data or planning gaps for '+year+'.</div>'}${t.length>10?`<div class="muted" style="font-size:11px;margin-top:8px">+${t.length-10} more items</div>`:''}</div>
<div class="card" style="margin-top:16px"><h2 style="margin-top:0">${year} Changes & Activity</h2><table class="table"><tr><td>Fields with APH history</td><td><b>${changes.aphReady}</b></td></tr><tr><td>Crop changes vs ${year-1}</td><td><b>${changes.cropChanges}</b></td></tr><tr><td>New seed selections vs ${year-1}</td><td><b>${changes.newSelections}</b></td></tr><tr><td>Farm tillage default</td><td><b>${esc(farm.default_tillage||'Not set')}</b></td></tr><tr><td>Row spacing default</td><td><b>${esc(farm.default_row_spacing||'Not set')}</b></td></tr><tr><td>Planting window</td><td><b>${esc(farm.default_planting_window||'Not set')}</b></td></tr></table></div>
<div class="card" style="margin-top:16px"><h2 style="margin-top:0">Annual Maintenance</h2><div class="muted" style="font-size:12px;margin-bottom:10px">When the farmer grows, this is the workflow.</div><div class="callout"><b>New farm/field</b><br>Add or draw boundary → pull soils → identify unit → attach APH → caught up.</div><a class="btn secondary" style="margin-top:10px" href="/prospect-detail.html?id=${prospectId}">Add / Update Fields</a></div>
</div></div>`}
async function chooseProspect(v){location='/farmers.html?id='+Number(v)+'&year='+year}
async function loadYear(y){year=y;if(!historyPlans[y]){const r=await api('/api/farms/'+prospect.farm_id+'/crop-plans?crop_year='+y);historyPlans[y]=r.fields||[]}plans=historyPlans[y];render()}
function closeHistory(){document.getElementById('historyModal').classList.remove('open')}
function openHistory(fid){const f=fields.find(x=>Number(x.id)===Number(fid)),pf=fieldProfile(fid),s=soilFor(fid),years=[...(pf.years||[])].sort((a,b)=>Number(b.crop_year)-Number(a.crop_year));document.getElementById('historyTitle').textContent=f.name+' — '+fmt(f.acres,1)+' acres';const planYears=Object.keys(historyPlans).map(Number).sort((a,b)=>b-a);const allYears=[...new Set([...years.map(x=>Number(x.crop_year)),...planYears])].sort((a,b)=>b-a);document.getElementById('historyBody').innerHTML=`<div class="grid kpis" style="grid-template-columns:repeat(4,1fr)"><div class="card"><div class="muted">Dominant Soil</div><b>${esc(s.dominant_muname||s.dominant_musym||'—')}</b></div><div class="card"><div class="muted">AWC</div><b>${s.weighted_aws150_cm!=null?Number(s.weighted_aws150_cm).toFixed(1)+' cm':'—'}</b></div><div class="card"><div class="muted">APH Years</div><b>${years.length}</b></div><div class="card"><div class="muted">Yield Stability</div><b>${pf.production_summary?.yield_stability_score!=null?pf.production_summary.yield_stability_score+'/100':'—'}</b></div></div><div class="card"><h3>Year-by-Year Record</h3><div class="history-year" style="font-weight:800;color:var(--muted)"><div>Year</div><div>Crop</div><div>Yield</div><div>SeedIQ Seed</div><div>Environment</div></div>${allYears.length?allYears.map(y=>{const ph=years.find(x=>Number(x.crop_year)===y)||{},pl=planFor(fid,y),env=ph.environment||{},m=env.metadata||{};return `<div class="history-year"><div><b>${y}</b></div><div>${esc(ph.crop||pl.crop||'—')}</div><div><b>${ph.yield_value!=null?Number(ph.yield_value).toFixed(1):'—'}</b></div><div>${esc(pl.selected_seed_name||'—')}</div><div class="muted">${env.precipitation_in!=null?Number(env.precipitation_in).toFixed(1)+' in rain':''}${m.jun_aug_precipitation_in!=null?' • '+Number(m.jun_aug_precipitation_in).toFixed(1)+' in Jun–Aug':''}${env.heat_days_95!=null?' • '+env.heat_days_95+' days ≥95°':''}</div></div>`}).join(''):'<div class="muted" style="padding:14px 0">No history attached yet.</div>'}</div><div class="callout" style="margin-top:14px"><b>Where this is going:</b> once realized yield is tied to the actual hybrid/variety planted, SeedIQ can learn which genetics consistently outperform on this field and similar fields — not just which product scored highest before planting.</div>`;document.getElementById('historyModal').classList.add('open')}
async function boot(){prospects=await api('/api/prospects');if(!prospects.length)throw Error('No farmer records found');if(!prospectId)prospectId=Number(prospects[0].id);prospect=await api('/api/prospects/'+prospectId);fields=(prospect.farm_context||{}).fields||[];soil=(prospect.soil_status||{}).fields||[];const years=[year-1,year,year+1];const [prof,...yr]=await Promise.all([api('/api/farms/'+prospect.farm_id+'/production-profile').catch(()=>({fields:[]})),...years.map(y=>api('/api/farms/'+prospect.farm_id+'/crop-plans?crop_year='+y).catch(()=>({fields:[]}))) ]);profile=prof;years.forEach((y,i)=>historyPlans[y]=yr[i].fields||[]);plans=historyPlans[year]||[];render()}
boot().catch(e=>document.getElementById('content').innerHTML='<div class="card"><b>Could not load Farmer & Fields.</b><br>'+esc(e.message)+'</div>');
</script></body></html>
