<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcreFit Farmer — Sign In</title>
<style>:root{--dark:#102a1d;--green:#1f6f43;--line:#dfe7df;--muted:#6b776d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f2;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#162319}.card{width:min(460px,92vw);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 18px 55px rgba(16,42,29,.08)}img{height:54px;max-width:310px}.muted{color:var(--muted)}label{display:block;font-size:12px;font-weight:800;margin:14px 0 5px}.input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.btn{width:100%;border:0;border-radius:9px;padding:11px 13px;background:var(--green);color:#fff;font-weight:850;cursor:pointer;margin-top:16px}.demo{background:#eaf2ed;color:#17452d}.msg{font-size:12px;margin-top:10px;color:#9a3f37}</style><link rel="icon" href="/acrefit-icon.svg"></head>
<body><div class="card"><img src="/acrefit-farmer-logo.svg" alt="AcreFit Farmer"><h2 style="margin:18px 0 5px">Your farm intelligence, field by field.</h2><div class="muted">Map once. Update APH yearly. Compare genetics. Track what performs.</div><label>Email</label><input id="email" class="input" type="email" autocomplete="username"><label>Password</label><input id="password" class="input" type="password" autocomplete="current-password"><button class="btn" onclick="login()">Sign In</button><form method="post" action="/api/auth/demo-role/farmer"><button class="btn demo" type="submit">Open Farmer Demo</button></form><div id="msg" class="msg"></div></div>
<script>async function login(){const m=document.getElementById('msg');m.textContent='';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});let d={};try{d=await r.json()}catch{}if(!r.ok){m.textContent=d.detail||'Sign in failed';return}location='/farmer-dashboard.html'}</script></body></html>
