<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeedIQ — Sales Package</title>
<style>
:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d;--lime:#dff2e5;--blue:#e8f0fb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 18px}.brand{font-size:25px;font-weight:850}.brand span{color:#8fd39f}.subbrand{font-size:12px;color:#a9c1b1;margin-top:4px}nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a:hover,nav a.active{background:#1d4b33}.main{padding:28px 32px 48px}.card,.page{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:22px;margin-bottom:16px}.hero p{color:#c9ddcf}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.btn{display:inline-block;border:0;background:var(--green);color:#fff;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer;text-decoration:none}.btn.secondary{background:#eaf2ed;color:#17452d}.select,.input{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.metric{font-size:28px;font-weight:850}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--lime);font-size:10px;font-weight:750}.page{margin-top:16px}.cover{min-height:300px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#f6fbf7,#e4f0e7)}.cover h1{font-size:38px;margin:0}.dealer{font-size:28px;font-weight:850;color:var(--green)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fbfdfb}.mini b{display:block;font-size:21px;margin-top:3px}.note{border-left:4px solid var(--green);background:#f5faf6;padding:12px 14px;border-radius:0 10px 10px 0}.empty{padding:20px;color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:1fr}.kpis,.summary{grid-template-columns:1fr}.main{padding:18px}}@media print{.sidebar,.toolbar,.hero{display:none!important}.app{display:block}.main{padding:0}.page{break-inside:avoid;border:0;box-shadow:none;margin:0 0 18px}.cover{min-height:9in}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">Seed<span>IQ</span></div><div class="subbrand">Seed Intelligence & Sales Platform</div><nav><a href="index.html">Dashboard</a><a href="prospects.html">Prospect Intelligence</a><a href="farmers.html">Farmer & Fields</a><a href="field-analysis.html">Field Analysis</a><a href="whole-farm-plan.html">Whole-Farm Plan</a><a href="sales-packet.html" class="active">Sales Package</a><a href="genetics.html">Seed Genetics</a><a href="data-hub.html">Farm Data Hub</a></nav></aside><main class="main"><div id="content"><div class="card">Loading live sales package…</div></div></main></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let prospects=[],prospect=null,plans=[],logistics=null,year=2027;
async function api(path){const r=await fetch(path);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
function money(v){return v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v)}
function num(v){return v==null?'—':Number(v).toLocaleString()}
async function boot(){prospects=await api('/api/prospects');const q=Number(new URLSearchParams(location.search).get('id'));const p=prospects.find(x=>Number(x.id)===q)||prospects[0];if(!p)return;await choose(p.id)}
async function choose(id){prospect=await api('/api/prospects/'+id);const p=await api('/api/farms/'+prospect.farm_id+'/crop-plans?crop_year='+year);plans=p.fields||[];logistics=await api('/api/farms/'+prospect.farm_id+'/seed-logistics?crop_year='+year);render()}
function render(){const selected=plans.filter(x=>x.selected_seed_product_id),corn=plans.filter(x=>(x.crop||'').toUpperCase()==='CORN'),soy=plans.filter(x=>(x.crop||'').toUpperCase().startsWith('SOY')),cornAc=corn.reduce((s,x)=>s+Number(x.acres||0),0),soyAc=soy.reduce((s,x)=>s+Number(x.acres||0),0),t=logistics?.totals||{},lines=logistics?.order_lines||[];document.getElementById('content').innerHTML=`<div class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.06em">LIVE FARM-SPECIFIC PROPOSAL</div><h1 style="margin:6px 0">Sales Package Builder</h1><p>Uses the actual crop plan, selected genetics, population, pricing and dealer unit logistics for the selected prospect.</p></div><div class="toolbar"><label>Prospect <select class="select" onchange="choose(this.value)">${prospects.map(p=>`<option value="${p.id}" ${Number(p.id)===Number(prospect.id)?'selected':''}>${esc(p.prospect_name)}</option>`).join('')}</select></label><label>Year <select class="select" onchange="year=Number(this.value);choose(prospect.id)">${[2026,2027,2028,2029].map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select></label><a class="btn secondary" href="whole-farm-plan.html?id=${prospect.id}">Edit Yield Goals / Seed Plan</a><button class="btn" onclick="window.print()">Print / Save PDF</button></div><div class="grid kpis"><div class="card"><div class="muted">Corn Acres</div><div class="metric">${cornAc.toFixed(1)}</div></div><div class="card"><div class="muted">Soybean Acres</div><div class="metric">${soyAc.toFixed(1)}</div></div><div class="card"><div class="muted">Planned Fields</div><div class="metric">${selected.length}/${plans.length}</div></div><div class="card"><div class="muted">Estimated Seed Value</div><div class="metric">${money(t.estimated_seed_value||0)}</div></div></div><div class="page cover"><div><div class="dealer">SeedIQ</div><div class="muted">Farm-Specific Genetic Placement Proposal</div></div><div><h1>${esc(prospect.prospect_name)}<br><span style="color:var(--green)">${year} Seed Placement Plan</span></h1></div><div class="summary"><div class="mini"><span class="muted">Total Fields</span><b>${plans.length}</b></div><div class="mini"><span class="muted">Selected Genetics</span><b>${new Set(selected.map(x=>x.selected_seed_product_id)).size}</b></div><div class="mini"><span class="muted">Sold Units</span><b>${num(t.sold_units||0)}</b></div></div></div><div class="page"><h2>Field-by-Field Seed Plan</h2>${selected.length?`<table class="table"><thead><tr><th>Field</th><th>Water</th><th>Crop</th><th>Yield Goal</th><th>Product</th><th>Population</th><th>$/Acre</th><th>Units</th></tr></thead><tbody>${selected.map(f=>`<tr><td><b>${esc(f.name)}</b><br><span class="muted">${Number(f.acres||0).toFixed(2)} ac</span></td><td><span class="tag">${esc(f.irrigation||'—')}</span></td><td>${esc(f.crop||'—')}</td><td>${f.yield_goal??'—'}</td><td><b>${esc(f.selected_seed_name||'—')}</b></td><td>${num(f.target_population)}</td><td>${money(f.seed_cost_per_acre)}</td><td>${f.units_required==null?'—':Number(f.units_required).toFixed(2)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No genetics have been selected yet. Open Whole-Farm Plan and complete field recommendations first.</div>'}</div><div class="page"><h2>Dealer Order Summary</h2>${lines.length?lines.map(x=>`<div class="mini" style="margin-bottom:10px"><b>${esc(x.product_name)}</b><div class="muted">${Number(x.acres||0).toFixed(1)} acres • ${x.field_count} fields • ${Number(x.units_required||0).toFixed(2)} calculated units</div><div style="margin-top:5px"><strong>${x.sold_units} sold units</strong> • Estimated farmer value ${money(x.estimated_value)}</div></div>`).join(''):'<div class="empty">No order lines yet.</div>'}</div><div class="page"><h2>Proposal Notes</h2><div class="note">This package is generated from SeedIQ field data, SSURGO soils, IRR/NIRR classification, annual crop plan, selected genetics, planting population and dealer-entered pricing. Population and product recommendations should be confirmed by the dealer/agronomist before final sale.</div></div>`}
boot().catch(e=>document.getElementById('content').innerHTML='<div class="card"><b>Could not load sales package.</b><br>'+esc(e.message)+'</div>');
</script></body></html>
