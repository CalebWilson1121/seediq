<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcreFit Farmer — Farm Data Hub</title><link rel="icon" href="/acrefit-icon.svg"><style>
:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d;--lime:#dff2e5;--warn:#fff4dc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);padding:22px 18px;color:#fff}.sidebar img{height:42px;max-width:205px}.subbrand{font-size:12px;color:#a9c1b1;margin-top:4px}nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a.active,nav a:hover{background:#1d4b33}.side-card{margin-top:24px;background:#173c29;border:1px solid #2a6041;border-radius:14px;padding:14px;font-size:12px;color:#cfe0d4;line-height:1.5}.main{padding:28px 32px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(3,1fr);margin:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.muted{color:var(--muted)}.metric{font-size:27px;font-weight:900}.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.secondary{background:#eaf2ed;color:#17452d}.select,.input{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.upload{border:2px dashed #a9c8b2;border-radius:14px;padding:18px;background:#f8fbf8}.callout{border-left:4px solid var(--green);background:#f5faf6;padding:12px 14px;border-radius:0 10px 10px 0}.callout.warn{border-left-color:#c28a21;background:var(--warn)}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{padding:13px;border:1px solid var(--line);background:#fff;border-radius:12px}.step b{display:block;margin-bottom:4px}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:22px}.hero p{color:#d5e5d9}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{display:none}.cards,.flow{grid-template-columns:1fr 1fr}.main{padding:18px}}@media(max-width:600px){.cards,.flow{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar"><img src="/acrefit-farmer-logo-light.svg"><div class="subbrand">Your farm. Your fields. Your seed plan.</div><nav><a href="/farmer-dashboard.html">Farm Overview</a><a id="ffFields" href="/farmer-fields.html">Fields & Mapping</a><a id="ffAnalysis" href="/farmer-field-analysis.html">Field Analysis</a><a id="ffPlan" href="/farmer-plan.html">Annual Crop Plan</a><a href="/farmer-history.html">Planting & Performance</a><a href="/farmer-genetics.html">Seed Genetics</a><a class="active" href="/farmer-data.html">Farm Data Hub</a></nav><div class="side-card"><b>Keep this simple</b><br><br>Map once. Then each year update the information that changed: APH, crop plan, seed choice and results.</div></aside><main class="main"><div id="content"><div class="card">Loading farm data…</div></div></main></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let dash=null,farmId=null,prospectId=null,year=2027;
async function api(p,o={}){const r=await fetch(p,o);let d={};try{d=await r.json()}catch{}if(r.status===401){location='/farmer-login.html';throw Error('Sign in required')}if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function load(){dash=await api('/api/farmer/dashboard?crop_year='+year);const f=(dash.farms||[])[0];if(!f)throw Error('No farm assigned');farmId=Number(f.id);prospectId=Number(f.prospect_id);document.getElementById('ffFields').href='/farmer-fields.html?id='+prospectId+'&year='+year;document.getElementById('ffAnalysis').href='/farmer-field-analysis.html?id='+prospectId+'&year='+year;document.getElementById('ffPlan').href='/farmer-plan.html?id='+prospectId+'&year='+year;render(f)}
function render(f){const s=dash.summary||{};document.getElementById('content').innerHTML=`
<div class="row"><div><div class="muted">FARM DATA HUB</div><h1 style="margin:4px 0">${esc(f.farm_name||f.producer_name||'My Farm')}</h1><div class="muted">Update the permanent farm record without rebuilding it every year.</div></div><a class="btn secondary" href="/farmer-fields.html?id=${prospectId}&year=${year}">Open Fields & Mapping</a></div>
<div class="grid cards"><div class="card"><div class="muted">Mapped Fields</div><div class="metric">${s.mapped||0}/${s.fields||0}</div></div><div class="card"><div class="muted">APH Fields</div><div class="metric">${s.aph_fields||0}</div></div><div class="card"><div class="muted">Farm Acres</div><div class="metric">${Number(s.acres||0).toLocaleString()}</div></div></div>
<div class="hero"><h2 style="margin:0 0 6px">The farm record should get easier every year.</h2><p>Field boundaries and soils stay put. Upload the newest APH, update acres if something changed, choose the next crop and seed, then record results after harvest.</p></div>
<div class="flow" style="margin-top:14px"><div class="step"><b>1. Map once</b>Confirm field boundaries and acres.</div><div class="step"><b>2. Update APH</b>Upload the current APH each year.</div><div class="step"><b>3. Plan season</b>Set crop rotation and genetics.</div><div class="step"><b>4. Track results</b>Save receipts and yield performance.</div></div>
<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px"><div class="card"><h2 style="margin-top:0">Upload Farm Document</h2><div class="muted" style="margin-bottom:12px">Choose the document type, then attach it directly to this farm.</div><form id="up"><label class="muted" style="font-size:11px;font-weight:800">DOCUMENT TYPE</label><select id="type" class="select" style="width:100%;margin:6px 0 12px"><option value="APH">APH — yearly production history</option><option value="MBAR">MBAR — field/acreage map data</option><option value="SOI">Mapped SOI — field identity/reference</option><option value="SEED_RECEIPT">Seed Receipt — planting history</option></select><div class="upload"><input id="file" type="file" accept=".pdf,.csv,.xlsx,.xlsm,.json,.txt" required><div class="muted" style="font-size:12px;margin-top:8px">PDF, CSV, XLSX, JSON and TXT supported where a parser exists.</div></div><button class="btn" style="margin-top:12px">Upload to My Farm</button><div id="msg" class="callout" style="display:none;margin-top:12px"></div></form></div>
<div class="card"><h2 style="margin-top:0">What should I update?</h2><div class="callout"><b>Before planning season</b><br>Check field list → add any new ground → confirm acres → upload latest APH.</div><div class="callout" style="margin-top:10px"><b>Before seed ordering</b><br>Set crop rotation → review Field Analysis → adjust RM preferences → choose genetics.</div><div class="callout" style="margin-top:10px"><b>After planting / harvest</b><br>Upload seed receipts and keep realized yield tied to the field and variety.</div><a class="btn secondary" style="margin-top:14px" href="/farmer-history.html">Open Planting & Performance →</a></div></div>`;
document.getElementById('up').onsubmit=upload}
async function upload(e){e.preventDefault();const f=document.getElementById('file').files[0],m=document.getElementById('msg');if(!f)return;m.style.display='block';m.className='callout';m.textContent='Uploading and updating farm record…';const fd=new FormData();fd.append('file',f);fd.append('document_type',document.getElementById('type').value);fd.append('target_farm_id',String(farmId));try{const r=await fetch('/api/documents/upload',{method:'POST',body:fd});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||'Upload failed');m.innerHTML='<b>Saved.</b> '+esc(f.name)+' is now attached to this farm.';await load()}catch(err){m.className='callout warn';m.textContent=err.message}}
load().catch(e=>document.getElementById('content').innerHTML='<div class="card"><b>Could not load Farm Data Hub.</b><div class="muted">'+esc(e.message)+'</div></div>');
</script></body></html>
