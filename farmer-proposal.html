<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeedIQ — Farmer Seed Plan</title><style>
:root{--bg:#f5f7f3;--card:#fff;--ink:#18231b;--muted:#68736a;--line:#dde5dd;--green:#1f6f43;--dark:#102a1d;--lime:#e1f2e6;--gold:#fff1d2}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1080px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#102a1d,#1f6f43);color:#fff;padding:30px;border-radius:20px}.hero .muted{color:#d3e2d6}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:27px;font-weight:850}.muted{color:var(--muted)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--lime);font-size:11px;font-weight:750}.field{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:10px}.fieldtop{display:flex;justify-content:space-between;gap:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eaf2ed;color:#17452d}.approve{background:#f7fbf8;border:2px solid #9ac5a7}.approval{display:flex;gap:8px;flex-wrap:wrap}.input{padding:10px;border:1px solid var(--line);border-radius:9px;min-width:250px}.status{font-weight:800}.approved{background:#e1f2e6;color:#185f38;padding:12px;border-radius:10px}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.wrap{padding:14px}.table{font-size:11px}.fieldtop{display:block}}@media print{.no-print{display:none!important}.wrap{max-width:none;padding:0}.card,.hero{break-inside:avoid}.field{break-inside:avoid}}
</style></head><body><div class="wrap"><div id="app" class="card">Loading your seed plan…</div></div><script>
const token=new URLSearchParams(location.search).get('token');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);const num=v=>v==null?'—':Number(v).toLocaleString();
async function api(path,o={}){const r=await fetch(path,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
function productTable(p){const x=p.summary.products||[];if(!x.length)return '<div class="muted">No products selected yet.</div>';return `<table class="table"><thead><tr><th>Product</th><th>Acres</th><th>Units</th><th>Est. Value</th></tr></thead><tbody>${x.map(r=>`<tr><td><b>${esc(r.brand||'')} ${esc(r.product_name||'')}</b><br><span class="muted">${esc(r.trait_package||'')}</span></td><td>${num(r.acres)}</td><td>${num(r.sold_units)}</td><td>${money(r.estimated_value)}</td></tr>`).join('')}</tbody></table>`}
function fieldCards(p){return (p.summary.fields||[]).filter(f=>f.selected_seed_product_id).map(f=>`<div class="field"><div class="fieldtop"><div><b>${esc(f.field_name)}</b><div class="muted">${Number(f.acres||0).toFixed(2)} acres • ${esc(f.irrigation||'')} • ${esc(f.crop||'')}</div></div><span class="tag">${esc(f.brand||'')} ${esc(f.product_name||'')}</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px"><div><span class="muted">Yield Goal</span><br><b>${f.yield_goal??'—'}</b></div><div><span class="muted">Population</span><br><b>${num(f.target_population)}</b></div><div><span class="muted">Seed $/acre</span><br><b>${money(f.seed_cost_per_acre)}</b></div><div><span class="muted">Field Units</span><br><b>${f.units_required==null?'—':Number(f.units_required).toFixed(2)}</b></div></div></div>`).join('')}
function render(p){const s=p.summary,corn=s.crop_acres.CORN||0,soy=s.crop_acres.SOYBEANS||s.crop_acres.SOYBEAN||0;document.getElementById('app').className='';document.getElementById('app').innerHTML=`<div class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.06em">FARM-SPECIFIC SEED PLACEMENT PLAN</div><h1 style="margin:7px 0">${esc(p.prospect_name)} — ${p.crop_year}</h1><div class="muted">Prepared${p.salesperson_name?' by '+esc(p.salesperson_name):''}${p.salesperson_phone?' • '+esc(p.salesperson_phone):''}</div>${p.intro_message?`<p>${esc(p.intro_message)}</p>`:''}</div><div class="grid kpis"><div class="card"><div class="muted">Planned Acres</div><div class="metric">${num(s.planned_acres)}</div></div><div class="card"><div class="muted">Corn / Soy</div><div class="metric">${num(corn)} / ${num(soy)}</div></div><div class="card"><div class="muted">IRR / NIRR Acres</div><div class="metric">${num(s.irrigation_acres.IRR||0)} / ${num(s.irrigation_acres.NIRR||0)}</div></div><div class="card"><div class="muted">Seed Investment</div><div class="metric">${money(s.estimated_seed_value)}</div></div></div><div class="card"><h2>Whole-Farm Product Plan</h2><p class="muted">Genetics are assigned by field using the mapped soil environment, irrigation practice, crop, yield goal and product fit. Dealer pricing and planting population are shown as planning values for the current proposal.</p>${productTable(p)}</div><div class="card" style="margin-top:16px"><h2>Field-by-Field Plan</h2>${fieldCards(p)}</div><div class="card approve" style="margin-top:16px"><h2>Approve Seed Plan</h2>${p.status==='approved'?`<div class="approved">Approved${p.approval_name?' by '+esc(p.approval_name):''}. Your salesperson can now move this plan into ordering.</div>`:`<p class="muted">Approval confirms this is the seed plan you want the salesperson to move forward with. It is a demo workflow acknowledgment, not an electronic signature or binding contract.</p><div class="approval no-print"><input id="name" class="input" placeholder="Farmer name"><button class="btn" onclick="approve()">Looks Good — Move Forward</button><button class="btn secondary" onclick="window.print()">Print / Save PDF</button></div>`}</div>`}
async function approve(){const name=document.getElementById('name').value.trim();await api('/api/public/proposals/'+encodeURIComponent(token)+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_name:name||null})});load()}
async function load(){if(!token)throw new Error('Proposal link is missing.');const p=await api('/api/public/proposals/'+encodeURIComponent(token));render(p)}load().catch(e=>document.getElementById('app').innerHTML='<b>Could not load proposal.</b><br>'+esc(e.message));
</script></body></html>
