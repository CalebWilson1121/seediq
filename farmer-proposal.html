<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SeedIQ — Farmer Seed Plan</title>
<style>
:root{--bg:#f5f7f3;--card:#fff;--ink:#18231b;--muted:#68736a;--line:#dde5dd;--green:#1f6f43;--dark:#102a1d;--lime:#e1f2e6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1080px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#102a1d,#1f6f43);color:#fff;padding:30px;border-radius:20px}.hero .muted{color:#d3e2d6}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:27px;font-weight:850}.muted{color:var(--muted)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--lime);font-size:11px;font-weight:750}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#eaf2ed;color:#17452d}.approve{background:#f7fbf8;border:2px solid #9ac5a7}.approval{display:flex;gap:8px;flex-wrap:wrap}.input{padding:10px;border:1px solid var(--line);border-radius:9px;min-width:250px}.approved{background:#e1f2e6;color:#185f38;padding:12px;border-radius:10px}.pdf-note{background:#f7faf8;border:1px solid var(--line);padding:14px;border-radius:12px;margin-top:16px}.field-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-preview{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.field-preview img{width:100%;height:190px;object-fit:cover;display:block;background:#d8ddd8}.field-preview-body{padding:12px}.field-preview h3{margin:0 0 4px}.field-preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.pv{font-size:11px}.pv span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.print-book{display:none}.print-mode{background:#fff}.print-mode .wrap{max-width:none;padding:0}.print-mode .screen-only{display:none!important}.print-mode .print-book{display:block}.print-toolbar{position:sticky;top:0;z-index:10;background:var(--dark);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.print-toolbar .btn{background:#fff;color:#17452d}.book-page{background:#fff;max-width:8.5in;margin:0 auto;padding:.35in}.book-cover{min-height:10in;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#f7fbf8,#e6f0e8)}.pdf-brand{font-size:24px;font-weight:900;color:var(--green)}.book-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--green);padding-bottom:8px;margin-bottom:12px}.book-head h2{margin:3px 0}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-card{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:4.45in;break-inside:avoid;page-break-inside:avoid;overflow:hidden}.field-card-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}.field-card-head h3{margin:0;font-size:16px}.mini-map{height:1.55in;border:1px solid var(--line);border-radius:9px;background:#d7ddd5;overflow:hidden;position:relative}.mini-map img{width:100%;height:100%;object-fit:cover;display:block}.map-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--muted);font-size:10px;background:#eef3ed}.seed-line{font-size:18px;font-weight:900;color:var(--green);margin:8px 0 2px}.mini-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}.mini-stat{border:1px solid var(--line);border-radius:7px;padding:6px}.mini-stat span{display:block;font-size:8px;text-transform:uppercase;color:var(--muted);font-weight:750}.mini-stat b{font-size:11px}.soil-line,.reason-line{font-size:9px;margin-top:7px;line-height:1.35}.soil-line{color:var(--muted)}.reason-line{border-left:3px solid var(--green);padding-left:7px}.book-footer{margin-top:10px;padding-top:6px;border-top:1px solid var(--line);font-size:8px;color:var(--muted);display:flex;justify-content:space-between}.page-label{font-size:10px;color:var(--muted)}@media(max-width:800px){.kpis,.field-list,.field-grid{grid-template-columns:1fr}.wrap{padding:14px}.field-preview-grid{grid-template-columns:1fr 1fr}.print-toolbar{position:static}}
@media print{@page{size:letter portrait;margin:.28in}.screen-only,.print-toolbar{display:none!important}html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{max-width:none!important;padding:0!important}.print-book{display:block!important}.book-page{max-width:none!important;margin:0!important;padding:.08in!important;break-after:page;page-break-after:always}.book-page:last-child{break-after:auto;page-break-after:auto}.book-cover{min-height:10.2in!important;padding:.25in!important}.field-grid{grid-template-columns:1fr 1fr!important;gap:.11in!important}.field-card{min-height:4.65in!important;padding:.09in!important}.mini-map{height:1.45in!important}.table th,.table td{padding:7px 6px;font-size:11px}}
</style>
</head>
<body><div class="wrap"><div id="app" class="card">Loading your seed plan…</div></div>
<script>
const params=new URLSearchParams(location.search),token=params.get('token'),printMode=params.get('print')==='1';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);
const num=v=>v==null?'—':Number(v).toLocaleString();
async function api(path,o={}){const r=await fetch(path,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
function mapUrl(f){return `/api/public/proposals/${encodeURIComponent(token)}/fields/${f.field_id}/map-image`}
function mapImg(f,cls=''){return `<div class="${cls}"><img class="field-map-image" src="${mapUrl(f)}" alt="Satellite map of ${esc(f.field_name)}" loading="eager" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="map-fallback">Map imagery unavailable<br>${esc(f.field_name)}</div></div>`}
function productTable(p){const x=p.summary.products||[];if(!x.length)return '<div class="muted">No products selected yet.</div>';return `<table class="table"><thead><tr><th>Product</th><th>Acres</th><th>Units</th><th>Est. Value</th></tr></thead><tbody>${x.map(r=>`<tr><td><b>${esc(r.brand||'')} ${esc(r.product_name||'')}</b><br><span class="muted">${esc(r.trait_package||'')}</span></td><td>${num(r.acres)}</td><td>${num(r.sold_units)}</td><td>${money(r.estimated_value)}</td></tr>`).join('')}</tbody></table>`}
function previewFields(p,b){const byId=new Map((b.fields||[]).map(x=>[Number(x.field_id),x]));return (p.summary.fields||[]).filter(f=>f.selected_seed_product_id).map(raw=>{const f=byId.get(Number(raw.field_id))||raw;return `<div class="field-preview"><div style="position:relative">${mapImg(f,'mini-map').replace('class="mini-map"','style="height:190px;position:relative"')}</div><div class="field-preview-body"><h3>${esc(f.field_name)}</h3><div class="muted">${Number(f.acres||0).toFixed(2)} acres • ${esc(f.irrigation||'—')} • ${esc(f.crop||'—')}</div><div class="seed-line">${esc(f.brand||'')} ${esc(f.product_name||'')}</div><div class="field-preview-grid"><div class="pv"><span>Yield Goal</span><b>${f.yield_goal??'—'} bu/ac</b></div><div class="pv"><span>Population</span><b>${num(f.target_population)}</b></div><div class="pv"><span>Seed $/Acre</span><b>${money(f.seed_cost_per_acre)}</b></div><div class="pv"><span>Units</span><b>${f.units_required==null?'—':Number(f.units_required).toFixed(2)}</b></div></div></div></div>`}).join('')}
function drainText(d){if(!d||typeof d!=='object')return '—';const e=Object.entries(d).sort((a,b)=>Number(b[1]||0)-Number(a[1]||0));return e.length?e.slice(0,2).map(([k,v])=>`${k}${Number.isFinite(Number(v))?' '+Number(v).toFixed(0)+'%':''}`).join(', '):'—'}
function compactField(f,i,total){const reason=(f.reasons||[])[0]||'Top SeedIQ fit for the current field environment.';return `<article class="field-card"><div class="field-card-head"><div><h3>${esc(f.field_name)}</h3><div class="page-label">${Number(f.acres||0).toFixed(2)} ac • ${esc(f.irrigation||'—')} • ${esc(f.crop||'—')}</div></div><span class="tag">${i+1}/${total}</span></div>${mapImg(f,'mini-map')}<div class="seed-line">${esc(f.brand||'')} ${esc(f.product_name||'')}</div><div class="page-label">${f.relative_maturity??'—'} RM${f.trait_package?' • '+esc(f.trait_package):''}${f.fit_score!=null?' • '+f.fit_score+'% fit':''}</div><div class="mini-stats"><div class="mini-stat"><span>Yield Goal</span><b>${f.yield_goal??'—'} bu/ac</b></div><div class="mini-stat"><span>Population</span><b>${num(f.target_population)}</b></div><div class="mini-stat"><span>Seed $/Ac</span><b>${money(f.seed_cost_per_acre)}</b></div><div class="mini-stat"><span>Units</span><b>${f.units_required==null?'—':Number(f.units_required).toFixed(2)}</b></div><div class="mini-stat"><span>Total Seed</span><b>${money(f.total_seed_cost)}</b></div><div class="mini-stat"><span>Slope</span><b>${f.slope_pct==null?'—':Number(f.slope_pct).toFixed(1)+'%'}</b></div></div><div class="soil-line"><b>Soil:</b> ${esc(f.dominant_soil||f.dominant_soil_symbol||'—')} • AWC ${f.awc_0_150cm==null?'—':Number(f.awc_0_150cm).toFixed(1)+' cm'} • ${esc(drainText(f.drainage))}</div><div class="reason-line"><b>Why this seed:</b> ${esc(reason)}</div></article>`}
function chunk(a,n){const out=[];for(let i=0;i<a.length;i+=n)out.push(a.slice(i,i+n));return out}
function printBook(p,b){const s=p.summary,fields=b.fields||[],groups=chunk(fields,4),total=2+groups.length;const pages=groups.map((g,pi)=>`<section class="book-page"><div class="book-head"><div><div class="pdf-brand">SeedIQ</div><h2>Field Placement Plan</h2></div><div class="page-label">${esc(p.prospect_name)} • ${p.crop_year}<br>Page ${pi+3} of ${total}</div></div><div class="field-grid">${g.map((f,j)=>compactField(f,pi*4+j,fields.length)).join('')}</div><div class="book-footer"><span>SeedIQ farm-specific genetic placement</span><span>Satellite imagery: Mapbox • Confirm final agronomic decisions with dealer/agronomist.</span></div></section>`).join('');return `<div class="print-book">${printMode?`<div class="print-toolbar"><div><b>SeedIQ Field Book</b> • ${fields.length} fields • ${total} pages</div><div><button id="printBtn" class="btn" onclick="printWhenMapsReady(this)">Print / Save PDF</button> <a class="btn" href="${location.pathname}?token=${encodeURIComponent(token)}">Back to Plan</a></div></div>`:''}<section class="book-page book-cover"><div><div class="pdf-brand" style="font-size:30px">SeedIQ</div><div class="muted">Farm-Specific Genetic Placement Book</div></div><div><h1>${esc(p.prospect_name)}<br><span style="color:#1f6f43">${p.crop_year} Seed Plan</span></h1><p>${esc(p.intro_message||'Field-by-field seed placement built from mapped boundaries, SSURGO soils, irrigation practice, crop plan, yield goals and product fit.')}</p></div><div class="grid kpis"><div><span class="muted">Planned Acres</span><h2>${num(s.planned_acres)}</h2></div><div><span class="muted">Planned Fields</span><h2>${fields.length}</h2></div><div><span class="muted">Seed Products</span><h2>${(s.products||[]).length}</h2></div><div><span class="muted">Seed Investment</span><h2>${money(s.estimated_seed_value)}</h2></div></div><div><b>Prepared${p.salesperson_name?' by '+esc(p.salesperson_name):''}</b><br><span class="muted">${esc(p.salesperson_phone||'')} ${p.salesperson_email?'• '+esc(p.salesperson_email):''}</span></div></section><section class="book-page"><div class="book-head"><div><div class="pdf-brand">SeedIQ</div><h2>Whole-Farm Seed Summary</h2></div><div class="page-label">Page 2 of ${total}</div></div>${productTable(p)}<div class="pdf-note"><b>How this plan was built</b><br>${esc(b.method||'')}<br><br>${esc(b.population_note||'')}</div></section>${pages}</div>`}
function openPrintBook(){window.open(location.pathname+'?token='+encodeURIComponent(token)+'&print=1','_blank','noopener')}
async function printWhenMapsReady(btn){const old=btn.textContent;btn.disabled=true;btn.textContent='Loading satellite maps…';const imgs=[...document.querySelectorAll('.field-map-image')];await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{const t=setTimeout(resolve,12000);img.addEventListener('load',()=>{clearTimeout(t);resolve()},{once:true});img.addEventListener('error',()=>{clearTimeout(t);resolve()},{once:true})})));btn.textContent='Opening print dialog…';setTimeout(()=>{window.print();btn.disabled=false;btn.textContent=old},250)}
function render(p,b){const s=p.summary,corn=s.crop_acres?.CORN||0,soy=s.crop_acres?.SOYBEANS||s.crop_acres?.SOYBEAN||0;document.getElementById('app').className='';if(printMode){document.body.classList.add('print-mode');document.getElementById('app').innerHTML=printBook(p,b);return}document.getElementById('app').innerHTML=`<div class="screen-only"><div class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.06em">FARM-SPECIFIC SEED PLACEMENT PLAN</div><h1 style="margin:7px 0">${esc(p.prospect_name)} — ${p.crop_year}</h1><div class="muted">Prepared${p.salesperson_name?' by '+esc(p.salesperson_name):''}${p.salesperson_phone?' • '+esc(p.salesperson_phone):''}</div>${p.intro_message?`<p>${esc(p.intro_message)}</p>`:''}</div><div class="grid kpis"><div class="card"><div class="muted">Planned Acres</div><div class="metric">${num(s.planned_acres)}</div></div><div class="card"><div class="muted">Corn / Soy</div><div class="metric">${num(corn)} / ${num(soy)}</div></div><div class="card"><div class="muted">IRR / NIRR Acres</div><div class="metric">${num(s.irrigation_acres?.IRR||0)} / ${num(s.irrigation_acres?.NIRR||0)}</div></div><div class="card"><div class="muted">Seed Investment</div><div class="metric">${money(s.estimated_seed_value)}</div></div></div><div class="card"><h2>Whole-Farm Product Plan</h2>${productTable(p)}</div><div class="card" style="margin-top:16px"><h2>Field-by-Field Plan</h2><p class="muted">Mapbox satellite imagery with the validated SeedIQ field boundary burned into each map.</p><div class="field-list">${previewFields(p,b)}</div></div><div class="pdf-note"><b>Printable Field Book</b><br>The print-ready book uses the same Mapbox field imagery and keeps the compact 4-fields-per-page layout.<div style="margin-top:12px"><button class="btn" onclick="openPrintBook()">Open Print-Ready Field Book</button></div></div><div class="card approve" style="margin-top:16px"><h2>Approve Seed Plan</h2>${p.status==='approved'?`<div class="approved">Approved${p.approval_name?' by '+esc(p.approval_name):''}. Your salesperson can now move this plan into ordering.</div>`:`<p class="muted">Approval confirms this is the seed plan you want the salesperson to move forward with. It is a demo workflow acknowledgment, not a binding contract.</p><div class="approval"><input id="name" class="input" placeholder="Farmer name"><button class="btn" onclick="approve()">Looks Good — Move Forward</button><button class="btn secondary" onclick="openPrintBook()">Open Print-Ready Field Book</button></div>`}</div></div>`}
async function approve(){const name=document.getElementById('name').value.trim();await api('/api/public/proposals/'+encodeURIComponent(token)+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_name:name||null})});load()}
async function load(){if(!token)throw new Error('Proposal link is missing.');const [p,b]=await Promise.all([api('/api/public/proposals/'+encodeURIComponent(token)),api('/api/public/proposals/'+encodeURIComponent(token)+'/field-book-data')]);render(p,b)}
load().catch(e=>document.getElementById('app').innerHTML='<b>Could not load proposal.</b><br>'+esc(e.message));
</script></body></html>
