<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AcreFit Farmer — Annual Crop Plan</title>
<style>
:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d;--lime:#dff2e5;--warn:#fff2d9;--blue:#e8f0fb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 18px}.brand{font-size:25px;font-weight:850}.brand span{color:#8fd39f}.subbrand{font-size:12px;color:#a9c1b1;margin-top:4px}nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a:hover,nav a.active{background:#1d4b33}.main{padding:28px 32px 48px}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:22px}.hero p{color:#c9ddcf;margin-bottom:0}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.cols{grid-template-columns:1.35fr .65fr}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:28px;font-weight:850}.muted{color:var(--muted)}.btn{border:0;background:var(--green);color:#fff;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer}.btn.secondary{background:#eaf2ed;color:#17452d}.btn.auto{background:#173c29}.btn:disabled{opacity:.5;cursor:wait}.input,.select{padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--lime);font-size:10px;font-weight:750}.tag.irr{background:#e8f0fb;color:#2d5e8c}.tag.nirr{background:#fff0d3;color:#835f18}.rec{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:#fff}.rec.top{border:2px solid var(--green);background:#fbfefc}.rec-head{display:flex;justify-content:space-between;gap:8px}.score{font-weight:850;color:var(--green)}.small{font-size:11px}.economics{background:#f7faf8;border:1px solid var(--line);border-radius:11px;padding:10px;margin-top:8px}.field-editor{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.field-editor label{font-size:10px;color:var(--muted);font-weight:750}.field-editor input,.field-editor select{width:100%;margin-top:4px}.full{grid-column:1/-1}.callout{border-left:4px solid var(--green);background:#f5faf6;padding:12px 14px;border-radius:0 10px 10px 0}.warning{border-left-color:#c28a21;background:var(--warn)}.order{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.loading{padding:25px;text-align:center;color:var(--muted)}.auto-result{margin-bottom:16px}.auto-result b{color:var(--green)}@media(max-width:1000px){.app{grid-template-columns:1fr}.kpis,.cols{grid-template-columns:1fr}.main{padding:18px}.sidebar{height:auto}.field-editor{grid-template-columns:1fr}}
</style><link rel="icon" href="/acrefit-icon.svg"></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><img src="/acrefit-farmer-logo-light.svg" alt="AcreFit Farmer" style="height:42px;width:auto;max-width:205px;display:block"></div><div class="subbrand">Your farm. Your fields. Your seed plan.</div><nav>
<a id="ffOverview" href="/farmer-dashboard.html">Farm Overview</a>
<a id="ffFields" href="/farmer-fields.html">Fields & Mapping</a>
<a id="ffAnalysis" href="/farmer-field-analysis.html">Field Analysis</a>
<a id="ffPlan" class="active" href="/farmer-plan.html">Annual Crop Plan</a>
<a id="ffHistory" href="/farmer-history.html">Planting & Performance</a>
<a id="ffGenetics" href="/farmer-genetics.html">Seed Genetics</a>
<a id="ffData" href="/farmer-data.html">Farm Data Hub</a>
</nav><div class="side-card"><b>Farmer workflow</b><br><br>1. Map fields<br>2. Update APH<br>3. Set crop rotation<br>4. Review field fit<br>5. Choose genetics<br>6. Track results</div></aside><main class="main"><div id="content" class="loading">Loading live seed plan…</div></main></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let prospects=[],prospect=null,plans=[],logistics=null,planInsights={},climateOutlook=null,me=null,year=2027,selectedField=null,recs=[],allRecs=[],autoMessage='',pricingState=null;
async function api(path,o={}){const r=await fetch(path,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
async function boot(){[prospects,me]=await Promise.all([api('/api/prospects'),api('/api/auth/me')]);const qs=new URLSearchParams(location.search),q=Number(qs.get('id')),qy=Number(qs.get('year'));if(qy)year=qy;const p=prospects.find(x=>Number(x.id)===q)||prospects[0];if(!p){document.getElementById('content').innerHTML='<div class="card">No prospects found.</div>';return}await chooseProspect(p.id)}
async function chooseProspect(id){prospect=await api('/api/prospects/'+id);autoMessage='';await refresh();}
async function refresh(){const [r,l,i]=await Promise.all([api('/api/farms/'+prospect.farm_id+'/crop-plans?crop_year='+year),api('/api/farms/'+prospect.farm_id+'/seed-logistics?crop_year='+year),api('/api/farms/'+prospect.farm_id+'/channel-plan-insights?crop_year='+year).catch(()=>({insights:[],climate_outlook:null}))]);plans=r.fields||[];logistics=l;planInsights={};climateOutlook=i.climate_outlook||null;(i.insights||[]).forEach(x=>planInsights[x.field_id]=x);render()}
function money(v){return v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v)}
function num(v){return v==null?'—':Number(v).toLocaleString()}
function planRow(f){const irr=f.irrigation||'—',cls=irr==='IRR'?'irr':irr==='NIRR'?'nirr':'',ins=planInsights[f.field_id];const signals=ins?(ins.field_signals||[]).slice(0,4):[],why=ins?(ins.product_reasons||[]).slice(0,2):[];const seed=f.selected_seed_name?`<b>${esc(f.selected_seed_name)}</b>${ins&&ins.fit_score!=null?` <span class="tag">${Number(ins.fit_score).toFixed(0)} Fit</span>`:''}${ins&&ins.rank?` <span class="muted small">#${ins.rank} field rank</span>`:''}${signals.length?`<div class="small muted" style="margin-top:5px"><b>Field:</b> ${signals.map(esc).join(' • ')}</div>`:''}${why.length?`<div class="small" style="margin-top:4px;color:#17452d"><b>Why:</b> ${why.map(esc).join(' • ')}</div>`:''}${ins?.climate_decision?`<div class="small" style="margin-top:6px;background:#eef6f0;border-radius:8px;padding:7px"><b>2027 climate:</b> ${esc(ins.climate_decision)}</div>`:''}`:'—';return `<tr><td><b>${esc(f.name)}</b><br><span class="muted">${Number(f.acres||0).toFixed(2)} ac</span></td><td><span class="tag ${cls}">${esc(irr)}</span></td><td>${esc(f.crop||'Unassigned')}</td><td>${f.yield_goal??'—'}</td><td>${num(f.target_population)}</td><td style="min-width:300px">${seed}</td><td>${money(f.seed_cost_per_acre)}</td><td>${f.units_required==null?'—':Number(f.units_required).toFixed(2)}</td><td><div style="display:flex;gap:6px;flex-wrap:wrap"><a class="btn secondary" style="text-decoration:none" href="/farmer-field-analysis.html?id=${prospect.id}&field=${f.field_id}&year=${year}">Analyze</a><button class="btn secondary" onclick="openField(${f.field_id})">Edit Plan</button></div></td></tr>`}
function render(){const t=logistics?.totals||{};document.getElementById('content').innerHTML=`<div class="hero"><div class="small" style="font-weight:800;letter-spacing:.06em">FIELD ECONOMICS + DEALER LOGISTICS</div><h1 style="margin:6px 0">Annual Farm Seed Plan</h1><p>${esc(prospect.prospect_name)} • ${year} • Channel genetics • top 5 field fit + full eligible catalog</p></div><div class="grid kpis"><div class="card"><div class="muted">Fields</div><div class="metric">${plans.length}</div></div><div class="card"><div class="muted">Planned Acres</div><div class="metric">${Number(t.planned_acres||0).toLocaleString()}</div></div><div class="card"><div class="muted">Sold Units</div><div class="metric">${num(t.sold_units||0)}</div></div><div class="card"><div class="muted">Estimated Seed Value</div><div class="metric">${money(t.estimated_seed_value||0)}</div></div></div>${climateOutlook?(()=>{const p=climateOutlook.planting||{},s=climateOutlook.early_summer||{},w=climateOutlook.winter||{};return `<div class="card" style="margin-bottom:16px;border-left:5px solid #1f6f43"><div class="small" style="font-weight:850;letter-spacing:.05em;color:#1f6f43">2027 CLIMATE OUTLOOK → SEED DECISION</div><h2 style="margin:5px 0 8px">${esc(climateOutlook.status||'NOAA ENSO Outlook')}</h2><div class="muted small">NOAA CPC • ${esc(climateOutlook.issued||'current outlook')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${w.season?`<span class="tag">Winter ${esc(w.season)}: ${w.el_nino_pct??'—'}% El Niño</span>`:''}${p.season?`<span class="tag">Planting ${esc(p.season)}: ${p.el_nino_pct??'—'}% El Niño</span>`:''}${s.season?`<span class="tag">Early summer ${esc(s.season)}: ${s.el_nino_pct??'—'}% El Niño / ${s.neutral_pct??'—'}% Neutral</span>`:''}</div><p class="small" style="margin:10px 0 0"><b>How AcreFit uses this:</b> It compares the forecast setup with this farm’s own APH + rainfall history. If a field historically loses yield in El Niño years, stress/root/moisture-use traits gain weight. If the field historically performs well, top-end yield can stay prioritized. Because the signal weakens toward summer, ENSO is a modifier—not a prediction of 2027 field weather.</p></div>`})():''}<div class="toolbar" style="margin-bottom:12px"><label>Prospect <select class="select" onchange="chooseProspect(this.value)">${prospects.map(p=>`<option value="${p.id}" ${Number(p.id)===Number(prospect.id)?'selected':''}>${esc(p.prospect_name)}</option>`).join('')}</select></label><label>Year <select class="select" onchange="year=Number(this.value);autoMessage='';refresh()">${[2026,2027,2028,2029].map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select></label><button id="autoPlanBtn" class="btn auto" onclick="autoPlan(false)">⚡ Auto Plan Missing Fields</button><button id="rebuildPlanBtn" class="btn secondary" onclick="autoPlan(true)">Rebuild All from Recommendations</button><a class="btn secondary" style="text-decoration:none" href="sales-packet.html?id=${prospect.id}&year=${year}">Sales Package →</a><button id="farmerPrintBtn" class="btn" onclick="createFarmerPrintout()">Farmer Printout / PDF</button></div>${autoMessage?`<div class="callout auto-result">${autoMessage}</div>`:''}<div class="callout" style="margin-bottom:16px"><b>Auto Plan</b> ranks Channel genetics field-by-field using location/maturity, IRR/NIRR, SSURGO soils, APH performance, historical rainfall/heat, ENSO response, farm management and yield goal. If yield goal is blank, matched APH can backfill it. “Missing Fields” preserves manual seed selections. The Seed column now shows <b>why</b> each selected product fits that field.</div><div class="grid cols"><div><div class="card"><h2 style="margin-top:0">Field Plan</h2><div class="muted small">Yield goal is an annual management target. IRR/NIRR comes from the field source. Population and economics are planning values and remain editable.</div><div style="overflow:auto;margin-top:12px"><table class="table"><thead><tr><th>Field</th><th>Water</th><th>Crop</th><th>Yield Goal</th><th>Population</th><th>Seed</th><th>$/Acre</th><th>Units</th><th></th></tr></thead><tbody>${plans.map(planRow).join('')}</tbody></table></div></div><div id="fieldPlanner" class="card" style="margin-top:16px;scroll-margin-top:16px"><div class="muted">Choose a field to set yield goal, run Channel fit, and calculate seed economics.</div></div></div><div><div class="card"><h2 style="margin-top:0">Dealer Order Logistics</h2><div class="muted small">Unit rounding happens at the whole-product order line so partial field requirements can share a bag/unit.</div><div id="orders">${orderHtml()}</div></div><div class="card" style="margin-top:16px"><h2 style="margin-top:0">Cost logic</h2><div class="callout"><b>Cost/acre</b> = population ÷ seeds per unit × dealer price/unit.<br><br><b>Order units</b> = total seeds required across all fields using the same product ÷ unit size, rounded up for sales logistics.</div></div></div></div>`}
function orderHtml(){const lines=logistics?.order_lines||[];if(!lines.length)return '<div class="muted" style="margin-top:12px">No genetics selected yet.</div>';return lines.map(x=>`<div class="order"><b>${esc(x.product_name)}</b> <span class="tag">${esc(x.trait_package||'')}</span><div class="small muted" style="margin-top:5px">${x.acres} acres • ${x.field_count} fields</div><div style="margin-top:8px"><b>${x.sold_units} sold units</b> <span class="muted">(${x.units_required.toFixed(2)} calculated)</span></div><div class="small">Estimated farmer seed value: <b>${money(x.estimated_value)}</b></div></div>`).join('')}
async function createFarmerPrintout(){const btn=document.getElementById('farmerPrintBtn');if(btn){btn.disabled=true;btn.textContent='Building Farmer Printout…'}try{const selected=(plans||[]).filter(x=>x.selected_seed_product_id);if(!selected.length)throw new Error('No seed products are selected yet. Build the whole-farm plan first.');const p=await api('/api/prospects/'+prospect.id+'/proposals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({crop_year:year,salesperson_name:me?.display_name||'AcreFit Dealer',salesperson_email:me?.email||null,salesperson_phone:null,intro_message:'Prepared from the AcreFit field-by-field seed placement plan.'})});await api('/api/proposals/'+p.id+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'ready'})});if(!p.public_token)throw new Error('Farmer proposal link could not be created.');window.open('/farmer-proposal.html?token='+encodeURIComponent(p.public_token),'_blank','noopener');}catch(e){alert(e.message)}finally{if(btn){btn.disabled=false;btn.textContent='Farmer Printout / PDF'}}}
async function autoPlan(overwrite){const msg=overwrite?'This will replace every existing seed selection and population with the current top recommendation. Yield goals and pricing stay unchanged. Continue?':'AcreFit will fill only fields that do not already have a selected seed product. Continue?';if(!confirm(msg))return;const ids=['autoPlanBtn','rebuildPlanBtn'];ids.forEach(id=>{const b=document.getElementById(id);if(b){b.disabled=true;b.textContent='Building Plan…'}});try{const r=await api('/api/farms/'+prospect.farm_id+'/channel-auto-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({crop_year:year,overwrite_existing:overwrite})});autoMessage=`<b>Auto plan complete.</b> ${r.planned_fields} fields planned from top recommendations. ${r.skipped_existing?`${r.skipped_existing} existing manual selections preserved. `:''}${r.skipped_unassigned?`${r.skipped_unassigned} fields skipped because crop is unassigned. `:''}${r.skipped_no_products?`${r.skipped_no_products} skipped because no matching Channel product was available.`:''}`;selectedField=null;recs=[];await refresh()}catch(e){autoMessage=`<b>Auto plan failed:</b> ${esc(e.message)}`;render()}}
async function openField(fieldId){selectedField=plans.find(x=>Number(x.field_id)===Number(fieldId));recs=[];allRecs=[];pricingState=null;drawPlanner();requestAnimationFrame(()=>document.getElementById('fieldPlanner')?.scrollIntoView({behavior:'smooth',block:'start'}));try{const [r,p]=await Promise.all([api('/api/fields/'+fieldId+'/channel-fit?crop_year='+year+'&limit=5'),api('/api/fields/'+fieldId+'/pricing?crop_year='+year).catch(()=>null)]);recs=r.recommendations||[];allRecs=r.all_options||recs;pricingState=p;drawPlanner(r)}catch(e){document.getElementById('recBox').innerHTML='<div class="callout warning">'+esc(e.message)+'</div>'}}
function drawPlanner(fit){const f=selectedField;if(!f)return;const box=document.getElementById('fieldPlanner');const std=pricingState?.standard_pricing||{},req=pricingState?.latest_request||null,current=f.seed_price_per_unit??null;let priceHtml='<div class="callout warning">Select a seed product to calculate farmer pricing.</div>';if(f.selected_seed_product_id&&std.available){const status=req?String(req.status||'').toUpperCase():'NONE';priceHtml=`<div class="callout"><b>Farmer Pricing</b><br>Calculated AcreFit price: <b>${money(std.calculated_price)}/unit</b> • Current plan: <b>${money(current)}/unit</b><br><span class="small">Tier: ${esc(std.pricing_tier||'Standard')} • Volume ${Number(std.volume_discount_pct||0).toFixed(1)}% • Early pay ${Number(std.early_pay_discount_pct||0).toFixed(1)}% • Loyalty/custom ${money(Number(std.loyalty_discount_per_unit||0)+Number(std.custom_discount_per_unit||0))}/unit</span>${req?`<br><span class="tag" style="margin-top:6px">Override ${status}: ${money(req.requested_price)}${req.approved_price!=null?' → '+money(req.approved_price):''}</span>`:''}</div><div class="field-editor" style="margin-top:8px"><label>Request different price<input id="overridePrice" class="input" type="number" step="0.01" placeholder="${std.calculated_price}"></label><label>Reason<input id="overrideNote" class="input" placeholder="Competitive match, volume, relationship…"></label><div class="full"><button class="btn secondary" onclick="requestPriceOverride()">Submit Price Override for Approval</button></div></div>`};box.innerHTML=`<h2 style="margin-top:0">${esc(f.name)}</h2><div><span class="tag ${(f.irrigation||'')==='IRR'?'irr':'nirr'}">${esc(f.irrigation||'IRR/NIRR pending')}</span> <span class="tag">${esc(f.crop||'Crop unassigned')}</span></div><div class="field-editor"><label>Yield goal<input id="yg" class="input" type="number" value="${f.yield_goal??''}" placeholder="e.g. 200"></label><label>Target population<input id="pop" class="input" type="number" value="${f.target_population??''}" placeholder="Run fit for suggestion"></label><label>Farmer price / unit<input id="price" class="input" type="number" step="0.01" value="${current??''}" readonly></label><label>Seeds / unit<input id="unitSize" class="input" type="number" value="${f.seeds_per_unit??((f.crop||'').toUpperCase()==='CORN'?80000:140000)}"></label><div class="full"><button class="btn" onclick="saveInputs(false)">Save Inputs + Run Channel Fit</button></div></div><div style="margin-top:10px">${priceHtml}</div><div id="recBox" style="margin-top:13px">${fit?recommendationsHtml(fit):'<div class="muted">Loading Channel fits…</div>'}</div>`}
function recommendationsHtml(fit){if(!recs.length)return '<div class="callout warning">No location-eligible Channel products are available for this field.</div>';const all=allRecs||recs;const eligibleCount=fit.location_eligible_count??all.filter(r=>r.location_eligible!==false).length;const allTable=`<details style="margin-top:14px"><summary style="cursor:pointer;font-weight:800;color:var(--green)">View all ${all.length} Channel options</summary><div class="small muted" style="margin:7px 0 10px">All active Channel products remain visible. Only ${eligibleCount} are inside this field's local maturity window and eligible for Top 5/auto-plan.</div><div style="overflow:auto"><table class="table"><thead><tr><th>Rank</th><th>Product</th><th>RM</th><th>Trait</th><th>Location</th><th>Fit</th><th>Population</th><th>Farmer Price</th><th></th></tr></thead><tbody>${all.map((r,i)=>{const ok=r.location_eligible!==false;const status=ok?'Eligible':'Outside zone';const action=ok?`<button class="btn secondary" onclick="chooseSeed(${r.seed_product_id},${r.recommended_population})">Use</button>`:`<button class="btn secondary" onclick="if(confirm('This product is outside AcreFit\\'s local maturity window for this field. Use it anyway?'))chooseSeed(${r.seed_product_id},${r.recommended_population})">Use anyway</button>`;return `<tr style="${ok?'':'opacity:.62'}"><td>${ok?i+1:'—'}</td><td><b>${esc(r.product_name)}</b></td><td>${r.relative_maturity??'—'}</td><td>${esc(r.trait_package||'—')}</td><td><b>${status}</b><div class="small muted">${esc(r.location_reason||'')}</div></td><td><b>${r.fit_score}%</b></td><td>${Number(r.recommended_population||0).toLocaleString()}</td><td><b>${r.farmer_price!=null?money(r.farmer_price):'—'}</b>${r.pricing_tier?`<div class="small muted">${esc(r.pricing_tier)}</div>`:''}</td><td>${action}</td></tr>`}).join('')}</tbody></table></div></details>`;return `<h3>Top 5 Channel Field Fits</h3><div class="small muted">${esc(fit.ranking_method||'')} • ${eligibleCount} location-eligible of ${fit.catalog_product_count??all.length} total Channel products. ${fit.agronomy_engine?`Agronomy rules: ${fit.agronomy_engine.source_count} neutral research sources. `:''}Population shown is AcreFit planning guidance, not a Bayer prescription.</div>`+recs.map((r,i)=>`<div class="rec ${i===0?'top':''}"><div class="rec-head"><div><b>#${i+1} ${esc(r.product_name)}</b> • ${r.relative_maturity??'—'} RM <span class="tag">${esc(r.trait_package||'')}</span></div><div style="text-align:right"><div class="score">${r.fit_score}% fit</div>${r.agronomy_score!=null?`<div class="small muted">Agronomy ${Number(r.agronomy_score).toFixed(0)}/100</div>`:''}</div></div><div class="small" style="margin-top:7px">${esc(r.placement||'')}</div><div class="small muted" style="margin-top:6px">${(r.reasons||[]).map(esc).join(' • ')}</div>${(r.agronomy_rules_fired||[]).length?`<details style="margin-top:8px"><summary class="small" style="cursor:pointer;font-weight:800;color:#1f6f43">Why the agronomy engine scored it this way</summary><div class="small muted" style="margin-top:6px">${r.agronomy_rules_fired.slice(0,5).map(x=>`<div style="margin:4px 0"><b>${esc(x.label)}</b>: ${esc(x.evidence)}</div>`).join('')}</div></details>`:''}<div class="economics"><b>Suggested population: ${Number(r.recommended_population).toLocaleString()}</b><br><b>Farmer price: ${r.farmer_price!=null?money(r.farmer_price):'Pricing unavailable'}/unit</b>${r.pricing_tier?` <span class="muted small">• ${esc(r.pricing_tier)}</span>`:''}</div><button class="btn" style="margin-top:8px" onclick="chooseSeed(${r.seed_product_id},${r.recommended_population})">Use this product</button></div>`).join('')+allTable}
async function saveInputs(runFit=true,seedProductId=null){const fid=selectedField.field_id;const body={crop_year:year,yield_goal:val('yg'),target_population:intval('pop'),seed_product_id:seedProductId??selectedField.selected_seed_product_id,seed_price_per_unit:val('price'),seeds_per_unit:intval('unitSize'),pricing_source:selectedField.pricing_source||'farmer_pricing_profile'};await api('/api/fields/'+fid+'/seed-plan',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await refresh();selectedField=plans.find(x=>Number(x.field_id)===Number(fid));await openField(fid)}
async function chooseSeed(seedProductId,pop){document.getElementById('pop').value=pop;const body={crop_year:year,yield_goal:val('yg'),target_population:pop,seed_product_id:seedProductId,seed_price_per_unit:null,seeds_per_unit:intval('unitSize'),pricing_source:'farmer_pricing_profile'};const fid=selectedField.field_id;await api('/api/fields/'+fid+'/seed-plan',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await refresh();await openField(fid)}
async function requestPriceOverride(){const price=val('overridePrice'),note=document.getElementById('overrideNote')?.value||'';if(price==null)return alert('Enter the price you want to request.');try{const r=await api('/api/fields/'+selectedField.field_id+'/price-override',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({crop_year:year,requested_price:price,request_note:note})});alert('Price request sent to Dealer Admin for approval.');await openField(selectedField.field_id)}catch(e){alert(e.message)}}
function val(id){const v=document.getElementById(id)?.value;return v===''||v==null?null:Number(v)}function intval(id){const v=val(id);return v==null?null:Math.round(v)}
boot().catch(e=>document.getElementById('content').innerHTML='<div class="card"><b>Could not load seed plan.</b><br>'+esc(e.message)+'</div>');

    set('ffPlan',pid?'/farmer-plan.html?id='+pid+'&year='+yr:'/farmer-dashboard.html');
    set('ffHistory','/farmer-history.html');
    set('ffGenetics',pid?'/farmer-genetics.html?id='+pid+'&year='+yr:'/farmer-genetics.html');
    set('ffData','/farmer-data.html');
  }
  wireFarmerNav();
})();
