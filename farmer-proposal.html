<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeedIQ — Farmer Seed Plan</title><style>
:root{--bg:#f5f7f3;--card:#fff;--ink:#18231b;--muted:#68736a;--line:#dde5dd;--green:#1f6f43;--dark:#102a1d;--lime:#e1f2e6;--gold:#fff1d2}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1080px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#102a1d,#1f6f43);color:#fff;padding:30px;border-radius:20px}.hero .muted{color:#d3e2d6}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:27px;font-weight:850}.muted{color:var(--muted)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--lime);font-size:11px;font-weight:750}.field{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:10px}.fieldtop{display:flex;justify-content:space-between;gap:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eaf2ed;color:#17452d}.approve{background:#f7fbf8;border:2px solid #9ac5a7}.approval{display:flex;gap:8px;flex-wrap:wrap}.input{padding:10px;border:1px solid var(--line);border-radius:9px;min-width:250px}.approved{background:#e1f2e6;color:#185f38;padding:12px;border-radius:10px}.print-book{display:none}.pdf-note{background:#f7faf8;border:1px solid var(--line);padding:14px;border-radius:12px;margin-top:16px}.field-page{background:#fff}.pdf-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--green);padding-bottom:10px;margin-bottom:14px}.pdf-brand{font-size:22px;font-weight:900;color:var(--green)}.pdf-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.mapbox{height:310px;border:1px solid var(--line);border-radius:14px;background:#eef3ed;overflow:hidden}.mapbox svg{width:100%;height:100%;display:block}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{border:1px solid var(--line);border-radius:10px;padding:10px}.stat span{font-size:10px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}.stat b{font-size:16px}.why{margin-top:14px;border-left:4px solid var(--green);padding:10px 14px;background:#f6faf7}.why ul{margin:8px 0 0 18px;padding:0}.soilbox{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px}.footer{margin-top:18px;padding-top:8px;border-top:1px solid var(--line);font-size:9px;color:var(--muted);display:flex;justify-content:space-between}.screen-fields .field{background:#fff}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.wrap{padding:14px}.table{font-size:11px}.fieldtop{display:block}.pdf-grid,.statgrid{grid-template-columns:1fr}.mapbox{height:240px}}
@media print{@page{size:letter portrait;margin:.38in}.no-print,.screen-only{display:none!important}body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{max-width:none;padding:0}.print-book{display:block}.print-cover,.print-summary,.field-page{height:10.1in;page-break-after:always;break-after:page;overflow:hidden}.field-page:last-child{page-break-after:auto}.print-cover{display:flex;flex-direction:column;justify-content:space-between;padding:.25in;background:linear-gradient(135deg,#f7fbf8,#e6f0e8)}.print-cover h1{font-size:34px;margin:8px 0}.print-summary{padding:.08in}.pdf-grid{grid-template-columns:1.05fr .95fr;gap:14px}.mapbox{height:3.25in}.field-page{padding:.02in}.stat{padding:8px}.stat b{font-size:14px}.why{font-size:11px}.soilbox{font-size:11px}.pdf-header h2{margin:3px 0;font-size:23px}.footer{position:relative;margin-top:10px}.card{border:0;padding:0}}
</style></head><body><div class="wrap"><div id="app" class="card">Loading your seed plan…</div></div><script>
const token=new URLSearchParams(location.search).get('token');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);const num=v=>v==null?'—':Number(v).toLocaleString();let fieldBook=null;
async function api(path,o={}){const r=await fetch(path,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
function productTable(p){const x=p.summary.products||[];if(!x.length)return '<div class="muted">No products selected yet.</div>';return `<table class="table"><thead><tr><th>Product</th><th>Acres</th><th>Units</th><th>Est. Value</th></tr></thead><tbody>${x.map(r=>`<tr><td><b>${esc(r.brand||'')} ${esc(r.product_name||'')}</b><br><span class="muted">${esc(r.trait_package||'')}</span></td><td>${num(r.acres)}</td><td>${num(r.sold_units)}</td><td>${money(r.estimated_value)}</td></tr>`).join('')}</tbody></table>`}
function fieldCards(p){return (p.summary.fields||[]).filter(f=>f.selected_seed_product_id).map(f=>`<div class="field"><div class="fieldtop"><div><b>${esc(f.field_name)}</b><div class="muted">${Number(f.acres||0).toFixed(2)} acres • ${esc(f.irrigation||'')} • ${esc(f.crop||'')}</div></div><span class="tag">${esc(f.brand||'')} ${esc(f.product_name||'')}</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px"><div><span class="muted">Yield Goal</span><br><b>${f.yield_goal??'—'}</b></div><div><span class="muted">Population</span><br><b>${num(f.target_population)}</b></div><div><span class="muted">Seed $/acre</span><br><b>${money(f.seed_cost_per_acre)}</b></div><div><span class="muted">Field Units</span><br><b>${f.units_required==null?'—':Number(f.units_required).toFixed(2)}</b></div></div></div>`).join('')}
function drainText(d){if(!d||typeof d!=='object')return '—';const e=Object.entries(d).sort((a,b)=>Number(b[1]||0)-Number(a[1]||0));return e.length?e.slice(0,2).map(([k,v])=>`${k}${Number.isFinite(Number(v))?' '+Number(v).toFixed(0)+'%':''}`).join(', '):'—'}
function flattenCoords(g){const pts=[];function walk(x){if(!Array.isArray(x))return;if(x.length>=2&&typeof x[0]==='number'&&typeof x[1]==='number'){pts.push([x[0],x[1]]);return}x.forEach(walk)}if(g&&g.coordinates)walk(g.coordinates);else if(g&&g.geometry&&g.geometry.coordinates)walk(g.geometry.coordinates);return pts}
function mapSvg(f){const pts=flattenCoords(f.boundary_geojson);if(pts.length<3)return `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#68736a;text-align:center;padding:20px">Field boundary map unavailable</div>`;let minX=Math.min(...pts.map(p=>p[0])),maxX=Math.max(...pts.map(p=>p[0])),minY=Math.min(...pts.map(p=>p[1])),maxY=Math.max(...pts.map(p=>p[1]));if(maxX===minX)maxX+=.001;if(maxY===minY)maxY+=.001;const pad=28,w=600,h=360,sx=(w-pad*2)/(maxX-minX),sy=(h-pad*2)/(maxY-minY),s=Math.min(sx,sy),dw=(maxX-minX)*s,dh=(maxY-minY)*s,ox=(w-dw)/2,oy=(h-dh)/2;const path=pts.map((p,i)=>`${i?'L':'M'} ${(ox+(p[0]-minX)*s).toFixed(1)} ${(h-(oy+(p[1]-minY)*s)).toFixed(1)}`).join(' ')+' Z';return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Field boundary map"><defs><pattern id="grid${f.field_id}" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#d9e3d9" stroke-width="1"/></pattern></defs><rect width="600" height="360" fill="#f7faf7"/><rect width="600" height="360" fill="url(#grid${f.field_id})"/><path d="${path}" fill="#b9ddc3" stroke="#1f6f43" stroke-width="5"/><text x="20" y="30" font-size="16" font-family="Arial" font-weight="700" fill="#183521">N ↑</text><text x="20" y="338" font-size="12" font-family="Arial" fill="#607065">${f.centroid_lat?Number(f.centroid_lat).toFixed(5):''}${f.centroid_lon?' , '+Number(f.centroid_lon).toFixed(5):''}</text></svg>`}
function fieldPage(f,i,total){const reasons=(f.reasons||[]).length?f.reasons:['Selected as the highest current SeedIQ fit for this field environment.'];return `<section class="field-page"><div class="pdf-header"><div><div class="pdf-brand">SeedIQ</div><h2>${esc(f.field_name)}</h2><div class="muted">${Number(f.acres||0).toFixed(2)} acres • ${esc(f.irrigation||'—')} • ${esc(f.crop||'—')}</div></div><div style="text-align:right"><span class="tag">Field ${i+1} of ${total}</span><div style="margin-top:8px;font-size:12px">${esc(f.township_range||'')} ${f.section?'• Sec '+esc(f.section):''}</div></div></div><div class="pdf-grid"><div><div class="mapbox">${mapSvg(f)}</div><div class="soilbox"><b>SSURGO Field Profile</b><div class="statgrid" style="margin-top:9px"><div class="stat"><span>Dominant Soil</span><b>${esc(f.dominant_soil||f.dominant_soil_symbol||'—')}</b></div><div class="stat"><span>AWC 0-150 cm</span><b>${f.awc_0_150cm==null?'—':Number(f.awc_0_150cm).toFixed(1)+' cm'}</b></div><div class="stat"><span>Slope</span><b>${f.slope_pct==null?'—':Number(f.slope_pct).toFixed(1)+'%'}</b></div><div class="stat"><span>Drainage</span><b>${esc(drainText(f.drainage))}</b></div></div></div></div><div><div style="font-size:12px;color:#68736a;text-transform:uppercase;font-weight:800">Seed Placement</div><div style="font-size:28px;font-weight:900;color:#1f6f43;margin:3px 0">${esc(f.brand||'')} ${esc(f.product_name||'')}</div><div class="muted">${f.relative_maturity??'—'} RM ${f.trait_package?'• '+esc(f.trait_package):''} ${f.fit_score!=null?'• '+f.fit_score+'% SeedIQ fit':''}</div><div class="statgrid" style="margin-top:14px"><div class="stat"><span>Yield Goal</span><b>${f.yield_goal??'—'}${String(f.crop).startsWith('SOY')?' bu/ac':' bu/ac'}</b></div><div class="stat"><span>Planting Population</span><b>${num(f.target_population)} /ac</b></div><div class="stat"><span>Seed Cost / Acre</span><b>${money(f.seed_cost_per_acre)}</b></div><div class="stat"><span>Total Field Seed</span><b>${money(f.total_seed_cost)}</b></div><div class="stat"><span>Calculated Units</span><b>${f.units_required==null?'—':Number(f.units_required).toFixed(2)}</b></div><div class="stat"><span>Dealer Price / Unit</span><b>${money(f.seed_price_per_unit)}</b></div></div><div class="why"><b>Why SeedIQ selected this seed</b><ul>${reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>${f.placement?`<div style="margin-top:8px"><b>Product positioning:</b> ${esc(f.placement)}</div>`:''}</div></div></div><div class="footer"><span>SeedIQ field-specific genetic placement plan</span><span>Population and product fit are planning recommendations; confirm final agronomic and product availability decisions with the dealer/agronomist.</span></div></section>`}
function printBook(p,b){const s=p.summary,fields=b.fields||[];return `<div class="print-book"><section class="print-cover"><div><div class="pdf-brand" style="font-size:30px">SeedIQ</div><div class="muted">Farm-Specific Genetic Placement Book</div></div><div><h1>${esc(p.prospect_name)}<br><span style="color:#1f6f43">${p.crop_year} Seed Plan</span></h1><p>${esc(p.intro_message||'Field-by-field seed placement built from mapped field boundaries, SSURGO soils, irrigation practice, crop plan, yield goals and product fit.')}</p></div><div class="grid kpis"><div class="stat"><span>Planned Acres</span><b>${num(s.planned_acres)}</b></div><div class="stat"><span>Planned Fields</span><b>${fields.length}</b></div><div class="stat"><span>Seed Products</span><b>${s.products.length}</b></div><div class="stat"><span>Seed Investment</span><b>${money(s.estimated_seed_value)}</b></div></div><div><b>Prepared${p.salesperson_name?' by '+esc(p.salesperson_name):''}</b><br><span class="muted">${esc(p.salesperson_phone||'')} ${p.salesperson_email?'• '+esc(p.salesperson_email):''}</span></div></section><section class="print-summary"><div class="pdf-header"><div><div class="pdf-brand">SeedIQ</div><h2>Whole-Farm Seed Summary</h2></div><div>${esc(p.prospect_name)} • ${p.crop_year}</div></div>${productTable(p)}<div class="pdf-note"><b>How this plan was built</b><br>${esc(b.method||'')}<br><br>${esc(b.population_note||'')}</div><div class="footer"><span>SeedIQ</span><span>Whole-farm product totals use dealer order-line rounding for sold-unit logistics.</span></div></section>${fields.map((f,i)=>fieldPage(f,i,fields.length)).join('')}</div>`}
function render(p,b){fieldBook=b;const s=p.summary,corn=s.crop_acres.CORN||0,soy=s.crop_acres.SOYBEANS||s.crop_acres.SOYBEAN||0;document.getElementById('app').className='';document.getElementById('app').innerHTML=`<div class="screen-only"><div class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.06em">FARM-SPECIFIC SEED PLACEMENT PLAN</div><h1 style="margin:7px 0">${esc(p.prospect_name)} — ${p.crop_year}</h1><div class="muted">Prepared${p.salesperson_name?' by '+esc(p.salesperson_name):''}${p.salesperson_phone?' • '+esc(p.salesperson_phone):''}</div>${p.intro_message?`<p>${esc(p.intro_message)}</p>`:''}</div><div class="grid kpis"><div class="card"><div class="muted">Planned Acres</div><div class="metric">${num(s.planned_acres)}</div></div><div class="card"><div class="muted">Corn / Soy</div><div class="metric">${num(corn)} / ${num(soy)}</div></div><div class="card"><div class="muted">IRR / NIRR Acres</div><div class="metric">${num(s.irrigation_acres.IRR||0)} / ${num(s.irrigation_acres.NIRR||0)}</div></div><div class="card"><div class="muted">Seed Investment</div><div class="metric">${money(s.estimated_seed_value)}</div></div></div><div class="card"><h2>Whole-Farm Product Plan</h2><p class="muted">Genetics are assigned by field using mapped soils, irrigation practice, crop, yield goal and product fit.</p>${productTable(p)}</div><div class="card screen-fields" style="margin-top:16px"><h2>Field-by-Field Plan</h2>${fieldCards(p)}</div><div class="pdf-note no-print"><b>Printable Field Book</b><br>The PDF version creates a cover page, whole-farm seed summary, then one full page per planned field with its field map, selected seed, seed economics, SSURGO profile and the reason behind the selection.<div style="margin-top:12px"><button class="btn" onclick="window.print()">Print / Save Full Field Book PDF</button></div></div><div class="card approve" style="margin-top:16px"><h2>Approve Seed Plan</h2>${p.status==='approved'?`<div class="approved">Approved${p.approval_name?' by '+esc(p.approval_name):''}. Your salesperson can now move this plan into ordering.</div><div class="no-print" style="margin-top:12px"><button class="btn secondary" onclick="window.print()">Print / Save Full Field Book PDF</button></div>`:`<p class="muted">Approval confirms this is the seed plan you want the salesperson to move forward with. It is a demo workflow acknowledgment, not an electronic signature or binding contract.</p><div class="approval no-print"><input id="name" class="input" placeholder="Farmer name"><button class="btn" onclick="approve()">Looks Good — Move Forward</button><button class="btn secondary" onclick="window.print()">Print / Save Full Field Book PDF</button></div>`}</div></div>${printBook(p,b)}`}
async function approve(){const name=document.getElementById('name').value.trim();await api('/api/public/proposals/'+encodeURIComponent(token)+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_name:name||null})});load()}
async function load(){if(!token)throw new Error('Proposal link is missing.');const [p,b]=await Promise.all([api('/api/public/proposals/'+encodeURIComponent(token)),api('/api/public/proposals/'+encodeURIComponent(token)+'/field-book-data')]);render(p,b);if(new URLSearchParams(location.search).get('print')==='1')setTimeout(()=>window.print(),500)}load().catch(e=>document.getElementById('app').innerHTML='<b>Could not load proposal.</b><br>'+esc(e.message));
</script></body></html>
