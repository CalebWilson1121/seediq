<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeedIQ — Prospect Detail</title><style>:root{--bg:#f4f7f2;--panel:#fff;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d;--lime:#dff2e5;--gold:#9b6b13;--warn:#fff5dc}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 18px}.brand{font-size:25px;font-weight:850}.brand span{color:#8fd39f}.subbrand{font-size:12px;color:#a9c1b1;margin-top:4px}nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a:hover,nav a.active{background:#1d4b33}.main{padding:28px 32px}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:24px}.hero p{color:#c9ddcf}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.cols{grid-template-columns:1.15fr .85fr}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.muted{color:var(--muted)}.metric{font-size:28px;font-weight:850}.btn{display:inline-block;border:0;background:var(--green);color:#fff;text-decoration:none;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.btn.secondary{background:#eaf2ed;color:#17452d}.btn:disabled{opacity:.5;cursor:wait}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.tag{display:inline-block;background:var(--lime);padding:5px 8px;border-radius:999px;font-size:11px;margin:2px 5px 2px 0}.callout{border-left:4px solid var(--green);background:#f5faf6;padding:12px 14px;border-radius:0 10px 10px 0}.callout.warn{border-left-color:#c28a21;background:var(--warn)}.soilbar{height:8px;background:#e9eee9;border-radius:99px;overflow:hidden;margin-top:5px}.soilbar i{display:block;height:100%;background:#3e8a5d}.status{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef4f0}.status.ready{background:#dff2e5;color:#175b35}.status.wait{background:#fff1d0;color:#845e16}.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:900px){.app{grid-template-columns:1fr}.kpis,.cols{grid-template-columns:1fr}.main{padding:18px}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">Seed<span>IQ</span></div><div class="subbrand">Seed Intelligence & Sales Platform</div><nav><a href="index.html">Dashboard</a><a href="prospects.html" class="active">Prospect Intelligence</a><a href="farmers.html">Farmer & Fields</a><a href="field-analysis.html">Field Analysis</a><a href="whole-farm-plan.html">Whole-Farm Plan</a><a href="genetics.html">Seed Genetics</a><a href="data-hub.html">Farm Data Hub</a></nav></aside><main class="main"><div id="content"><div class="card">Loading prospect…</div></div></main></div><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=new URLSearchParams(location.search).get('id');
let prospect=null;
async function api(path,options={}){const r=await fetch(path,options);let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
function soilSummary(s){if(!s||!s.soil_status)return '<span class="status wait">Not mapped</span>';return `<span class="status ready">SSURGO ready</span><br><b>${esc(s.dominant_muname||s.dominant_musym||'Soil mapped')}</b><br><span class="muted">AWS 0–150cm: ${s.weighted_aws150_cm??'—'} cm • slope: ${s.weighted_slope_pct??'—'}%</span>`}
function render(){const p=prospect,c=p.farm_context||{},fields=c.fields||[],recs=c.crop_records||[],soilRows=((p.soil_status||{}).fields)||[],soilBy={};soilRows.forEach(x=>soilBy[x.field_id]=x);const crops=[...new Set(fields.map(f=>f.crop).filter(Boolean))],counties=[...new Set(fields.map(f=>f.county).filter(Boolean))];const ready=soilRows.filter(x=>x.soil_status).length;const located=soilRows.filter(x=>x.location_source).length;const meta=p.metadata_json||{};document.getElementById('content').innerHTML=`<div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap"><div><a href="prospects.html" class="muted" style="text-decoration:none">← Prospects</a><h1>${esc(p.prospect_name)}</h1><div class="muted">${counties.map(esc).join(', ')||'Location pending'} • APH-created prospect</div></div><div style="display:flex;gap:8px"><button id="soilBtn" class="btn">Map APH Locations + Soils</button><a class="btn secondary" href="genetics.html">Seed Genetics</a></div></div><div class="grid kpis"><div class="card"><div class="muted">APH Acres</div><div class="metric">${Number(p.total_acres||0).toLocaleString()}</div></div><div class="card"><div class="muted">Units / Fields</div><div class="metric">${fields.length}</div></div><div class="card"><div class="muted">APH Location Ready</div><div class="metric">${meta.location_ready_units??located}/${fields.length}</div></div><div class="card"><div class="muted">Soil Profiles Ready</div><div class="metric">${ready}/${fields.length}</div></div></div><div class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.06em">APH → LOCATION → SOILS → GENETICS</div><h2>Turn each insurance unit into a seed-placement environment.</h2><p>SeedIQ reads NAU township/range/section from the APH, resolves the Kansas PLSS section, intersects it with USDA NRCS SSURGO, and stores the soil profile once for reuse in the seed engine.</p><div>${crops.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><div id="soilMsg" class="callout warn" style="margin-top:16px"><b>Boundary accuracy</b><br>APH township/range/section gives SeedIQ a section-level soil screen. That is useful for prospecting, but not an exact field boundary. When we receive an acreage report, shapefile or drawn field boundary, it can replace the section polygon and SeedIQ will re-run the soil profile.</div><div class="grid cols" style="margin-top:16px"><div class="card"><h2>Units + Soil Cross-Reference</h2><table class="table"><thead><tr><th>Unit / Field</th><th>APH Location</th><th>Crop</th><th>Soil</th></tr></thead><tbody>${fields.map(f=>{const s=soilBy[f.id]||{},m=s.metadata||{};return `<tr><td><b>${esc(f.name)}</b><br><span class="muted">${esc(f.field_number||'')}</span></td><td>${esc(m.township_range||'—')} ${m.section?('Sec '+esc(m.section)):''}<br><span class="muted">${m.fsa_farm_number?('FSA '+esc(m.fsa_farm_number)):'Boundary pending'}</span></td><td>${esc(f.crop||'—')}<br><span class="muted">${esc(f.practice||'')}</span></td><td>${soilSummary(s)}</td></tr>`}).join('')}</tbody></table></div><div><div class="card"><h2>Soil Intelligence</h2>${ready?soilRows.filter(x=>x.soil_status).slice(0,5).map(s=>`<div style="margin-bottom:14px"><b>${esc(s.name)}</b><div class="muted" style="font-size:12px">${esc(s.dominant_muname||'')} • ${Number(s.total_area_acres||0).toFixed(0)} mapped acres</div><div class="soilbar"><i style="width:${Math.min(100,Number(s.weighted_aws150_cm||0)*4)}%"></i></div><div style="font-size:12px;margin-top:5px">AWS 150cm: <b>${s.weighted_aws150_cm??'—'} cm</b> • slope: <b>${s.weighted_slope_pct??'—'}%</b></div></div>`).join(''):'<div class="muted">Run soil enrichment to populate water storage, slope, drainage, hydrologic group and soil map-unit composition.</div>'}</div><div class="card" style="margin-top:16px"><h2>Seed Analysis Inputs</h2><div class="callout"><b>Already available</b><br><span class="muted">APH yield history, practice, irrigation, approved yield, acreage, location and now SSURGO soil traits.</span></div><div class="callout" style="margin-top:10px"><b>Next layer</b><br><span class="muted">NOAA historical weather by resolved field location: spring saturation, GDD, July heat/moisture stress, August finish and frost risk.</span></div><div class="callout" style="margin-top:10px"><b>Then genetics</b><br><span class="muted">Score dealer products against APH productivity + soil + weather + management.</span></div></div></div></div>`;document.getElementById('soilBtn').onclick=mapSoils}
async function load(){const box=document.getElementById('content');try{if(!id)throw new Error('No prospect selected');prospect=await api('/api/prospects/'+id);render()}catch(e){box.innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
async function mapSoils(){const b=document.getElementById('soilBtn'),m=document.getElementById('soilMsg');b.disabled=true;b.innerHTML='<span class="spinner"></span> Mapping soils…';m.className='callout';m.innerHTML='<b>Working through APH units…</b><br>Resolving Kansas PLSS sections and querying USDA NRCS Soil Data Access. Results are cached in Supabase.';try{const r=await api('/api/prospects/'+id+'/soils/enrich?force=false',{method:'POST'});m.innerHTML=`<b>Soil pass complete.</b><br>${r.soil_ready} profiles ready • ${r.needs_boundary} need an exact boundary • ${r.errors} errors.`;prospect=await api('/api/prospects/'+id);render()}catch(e){m.className='callout warn';m.innerHTML='<b>Soil enrichment stopped.</b><br>'+esc(e.message);b.disabled=false;b.textContent='Map APH Locations + Soils'}}
load();
</script></body></html>
