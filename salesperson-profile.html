<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AcreFit — Salesperson Profile</title>
<style>
:root{--bg:#f4f7f2;--ink:#162319;--muted:#6b776d;--line:#dfe7df;--green:#1f6f43;--dark:#102a1d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 18px}.main{padding:28px 32px 48px}
nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a:hover,nav a.active{background:#1d4b33}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(5,1fr);margin:16px 0}.cols{grid-template-columns:1.1fr .9fr}
.metric{font-size:27px;font-weight:900}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.btn{display:inline-block;border:0;border-radius:9px;padding:9px 12px;background:var(--green);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.btn.alt{background:#eaf2ed;color:#17452d}
.input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef4f0;font-size:11px;font-weight:800}.notice{padding:12px;border-radius:10px;background:#f5faf6;border:1px solid #cfe0d4}.credential{font-family:ui-monospace,Menlo,monospace;font-weight:900;font-size:15px}
@media(max-width:1050px){.app{grid-template-columns:1fr}.kpis,.cols{grid-template-columns:1fr}.main{padding:18px}}
</style><link rel="icon" href="/acrefit-icon.svg"></head>
<body><div class="app"><aside class="sidebar">
<img src="/acrefit-logo-light.svg" alt="AcreFit" style="height:42px;width:auto;max-width:195px;display:block">
<div style="font-size:12px;color:#a9c1b1;margin-top:4px">Dealer Management</div>
<nav><a href="/dealer-demo.html">Dashboard</a><a href="/dealer-demo.html#team" class="active">Team</a><a href="/prospects.html">Prospects</a><a href="/pipeline.html">Sales Pipeline</a><a href="/genetics.html">Seed Catalogs</a><a href="/data-hub.html">Farm Data Hub</a></nav>
</aside><main class="main"><div id="content"><div class="card">Loading salesperson profile…</div></div></main></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const q=new URLSearchParams(location.search),userId=Number(q.get('id'));let data=null;
async function api(u,o={}){const r=await fetch(u,o);let d={};try{d=await r.json()}catch{}if(r.status===401){location='/login.html';throw Error('Sign in required')}if(!r.ok)throw Error(d.detail||'Request failed');return d}
const fmt=(v,d=0)=>Number(v||0).toLocaleString(undefined,{maximumFractionDigits:d});
const time=s=>{const n=Number(s||0),h=Math.floor(n/3600),m=Math.floor((n%3600)/60);return h?(`${h}h ${m}m`):(`${m}m`)}
function render(){
 const u=data.user,t=data.totals,s=data.seed,p=data.proposals,a=data.activity;
 document.getElementById('content').innerHTML=`
 <div class="row"><div><a href="/dealer-demo.html#team" class="muted" style="text-decoration:none">← Back to Sales Team</a><h1 style="margin:6px 0">${esc(u.display_name)}</h1><div class="muted">${esc(u.email)} • ${esc((u.role||'').replaceAll('_',' '))} • <span class="tag">${esc(u.status)}</span></div></div><div style="display:flex;gap:8px"><button class="btn alt" onclick="resetPassword()">Reset Password</button><button class="btn alt" onclick="toggleEdit()">Edit Profile</button></div></div>
 <div id="msg" style="margin-top:12px"></div>
 <div class="grid kpis">
  <div class="card"><div class="muted">Assigned Acres</div><div class="metric">${fmt(t.acres)}</div></div>
  <div class="card"><div class="muted">Farms</div><div class="metric">${fmt(t.farms)}</div></div>
  <div class="card"><div class="muted">Seed Units</div><div class="metric">${fmt(s.units_recommended,1)}</div></div>
  <div class="card"><div class="muted">Won Units</div><div class="metric">${fmt(s.won_units,1)}</div></div>
  <div class="card"><div class="muted">Active Time</div><div class="metric">${time(a.active_seconds)}</div></div>
 </div>
 <div id="editCard" class="card" style="display:none;margin-bottom:16px"><h3 style="margin-top:0">Edit Account</h3><div class="grid" style="grid-template-columns:1fr 1fr"><div><div class="muted" style="font-size:11px">NAME</div><input id="name" class="input" value="${esc(u.display_name)}"></div><div><div class="muted" style="font-size:11px">EMAIL</div><input id="email" class="input" value="${esc(u.email)}"></div></div><button class="btn" style="margin-top:10px" onclick="saveProfile()">Save Changes</button></div>
 <div class="grid cols">
 <div>
  <div class="card"><h2 style="margin-top:0">Sales Performance</h2><table class="table">
   <tr><td>Won acres</td><td><b>${fmt(t.won_acres)}</b></td></tr><tr><td>Lost acres</td><td><b>${fmt(t.lost_acres)}</b></td></tr>
   <tr><td>Seed units recommended</td><td><b>${fmt(s.units_recommended,1)}</b></td></tr><tr><td>Corn units</td><td><b>${fmt(s.corn_units,1)}</b></td></tr>
   <tr><td>Soybean units</td><td><b>${fmt(s.soybean_units,1)}</b></td></tr><tr><td>Estimated seed value</td><td><b>$${fmt(s.seed_value,0)}</b></td></tr>
   <tr><td>Proposals</td><td><b>${fmt(p.total)}</b></td></tr><tr><td>Approved proposals</td><td><b>${fmt(p.approved)}</b></td></tr>
  </table></div>
  <div class="card" style="margin-top:16px"><h2 style="margin-top:0">Pipeline</h2><table class="table"><tr><th>Stage</th><th>Farms</th><th>Acres</th></tr>${data.pipeline.length?data.pipeline.map(x=>`<tr><td>${esc(String(x.status||'new').replaceAll('_',' '))}</td><td>${fmt(x.farms)}</td><td>${fmt(x.acres)}</td></tr>`).join(''):'<tr><td colspan="3">No pipeline yet.</td></tr>'}</table></div>
  <div class="card" style="margin-top:16px"><h2 style="margin-top:0">Assigned Book</h2><table class="table"><tr><th>Farm</th><th>Acres</th><th>Stage</th><th>Seed Units</th><th></th></tr>${data.farms.length?data.farms.map(f=>`<tr><td><b>${esc(f.prospect_name)}</b><div class="muted">${esc([f.county,f.state].filter(Boolean).join(', '))}</div></td><td>${fmt(f.total_acres)}</td><td>${esc(String(f.status||'new').replaceAll('_',' '))}</td><td>${fmt(f.seed_units,1)}</td><td><a class="btn alt" href="/prospect-detail.html?id=${f.prospect_id}">Open</a></td></tr>`).join(''):'<tr><td colspan="5">No farms assigned.</td></tr>'}</table></div>
 </div>
 <div>
  <div class="card"><h2 style="margin-top:0">Platform Activity</h2><table class="table">
   <tr><td>Last login</td><td><b>${u.last_login_at?new Date(u.last_login_at).toLocaleString():'Never'}</b></td></tr><tr><td>Last active</td><td><b>${a.last_activity?new Date(a.last_activity).toLocaleString():'No tracked activity yet'}</b></td></tr>
   <tr><td>Tracked sessions</td><td><b>${fmt(a.sessions)}</b></td></tr><tr><td>Activity pings</td><td><b>${fmt(a.page_views)}</b></td></tr><tr><td>Active days — last 30</td><td><b>${fmt(a.active_days_30)}</b></td></tr><tr><td>Measured active time</td><td><b>${time(a.active_seconds)}</b></td></tr>
  </table><div class="muted" style="font-size:11px;margin-top:10px">${esc(data.tracking_note)}</div></div>
  <div class="card" style="margin-top:16px"><h2 style="margin-top:0">Recent Sessions</h2>${data.recent_activity.length?data.recent_activity.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${x.last_seen_at?new Date(x.last_seen_at).toLocaleString():'—'}</b><div class="muted" style="font-size:11px">${time(x.active_seconds)} active • ${fmt(x.page_views)} pings • ${esc(x.last_path||'')}</div></div>`).join(''):'<div class="muted">Activity tracking begins with this release.</div>'}</div>
 </div></div>`;
}
function toggleEdit(){const el=document.getElementById('editCard');el.style.display=el.style.display==='none'?'block':'none'}
async function saveProfile(){try{await api('/api/dealer/team/'+userId+'/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({display_name:document.getElementById('name').value,email:document.getElementById('email').value})});await load();document.getElementById('msg').innerHTML='<div class="notice">Profile updated.</div>'}catch(err){document.getElementById('msg').innerHTML='<div class="notice">'+esc(err.message)+'</div>'}}
async function resetPassword(){if(!confirm("Reset this user's password? Their current password and active sessions will stop working."))return;try{const r=await api('/api/dealer/team/'+userId+'/reset-password',{method:'POST'});document.getElementById('msg').innerHTML='<div class="notice"><b>Temporary password created.</b><br>Copy and share this once:<br><span class="credential">'+esc(r.temporary_password)+'</span></div>'}catch(err){document.getElementById('msg').innerHTML='<div class="notice">'+esc(err.message)+'</div>'}}
async function load(){if(!userId)throw Error('Missing salesperson');data=await api('/api/dealer/team/'+userId+'/profile');render()}
load().catch(err=>document.getElementById('content').innerHTML='<div class="card"><b>Could not load profile.</b><br>'+esc(err.message)+'</div>');
</script></body></html>
