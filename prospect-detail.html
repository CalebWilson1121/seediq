*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 18px;position:sticky;top:0;height:100vh}.brand{font-size:25px;font-weight:850}.brand span{color:#8fd39f}.subbrand{font-size:12px;color:#a9c1b1;margin-top:4px}nav{display:grid;gap:7px;margin-top:28px}nav a{color:#dce8df;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}nav a:hover,nav a.active{background:#1d4b33}.side-card{margin-top:22px;background:#173c29;border:1px solid #2a6041;border-radius:14px;padding:13px;font-size:12px;color:#cfe0d4;line-height:1.45}.main{padding:28px 32px 48px}.hero{background:linear-gradient(135deg,#123822,#1f6f43);color:#fff;border-radius:18px;padding:22px}.hero p{color:#c9ddcf;margin-bottom:0}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin:16px 0}.cols{grid-template-columns:minmax(0,1.45fr) minmax(320px,.55fr)}.cols2{grid-template-columns:1fr 1fr}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.muted{color:var(--muted)}.metric{font-size:28px;font-weight:850}.btn{display:inline-block;border:0;background:var(--green);color:#fff;text-decoration:none;border-radius:10px;padding:9px 12px;font-weight:750;cursor:pointer}.btn.secondary{background:#eaf2ed;color:#17452d}.btn.outline{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.5}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.tag{display:inline-block;background:var(--lime);padding:5px 8px;border-radius:999px;font-size:11px;margin:2px 4px 2px 0}.callout{border-left:4px solid var(--green);background:#f5faf6;padding:12px 14px;border-radius:0 10px 10px 0}.callout.warn{border-left-color:#c28a21;background:var(--warn)}.status{font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#eef4f0}.ready{background:#dff2e5;color:#175b35}.pending{background:#fff0d2;color:#855f14}.select,.input{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.cropBtns{display:flex;gap:5px;flex-wrap:wrap}.upload{border:2px dashed #a9c8b2;border-radius:14px;padding:16px;background:#f8fbf8}.map-shell{position:relative}.map{height:540px;border-radius:15px;border:1px solid #cfd9d1;overflow:hidden;background:#dfe8df}.map-overlay{position:absolute;z-index:3;left:12px;top:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:9px;display:flex;gap:7px;box-shadow:0 5px 18px rgba(0,0,0,.12)}.map-overlay button{border:0;border-radius:8px;padding:7px 9px;background:#edf3ef;color:#244833;font-weight:750;cursor:pointer}.map-overlay button.active{background:#173f2a;color:white}.map-note{position:absolute;z-index:3;left:12px;bottom:12px;background:rgba(16,42,29,.92);color:#fff;padding:9px 11px;border-radius:10px;font-size:11px;max-width:340px}.field-cards{display:grid;gap:9px;max-height:540px;overflow:auto;padding-right:2px}.field-card{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff}.field-card:hover,.field-card.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}.field-row{display:flex;justify-content:space-between;gap:8px}.soil-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.soil-cell{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fbfdfb}.soil-cell span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.legend{display:flex;gap:13px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--mute .draw-panel{display:none;position:absolute;z-index:5;right:12px;top:12px;width:min(320px,calc(100% - 24px));background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.18)}.draw-panel.active{display:block}.draw-title{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.draw-acre{font-size:27px;font-weight:900;color:var(--green);line-height:1}.draw-acre span{font-size:12px;color:var(--muted);font-weight:700}.draw-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.draw-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.draw-tool{border:1px solid var(--line);background:#f6faf7;color:var(--ink);border-radius:9px;padding:8px 6px;font-size:11px;font-weight:800;cursor:pointer}.draw-tool.active{background:var(--green);color:#fff;border-color:var(--green)}.draw-help{font-size:12px;line-height:1.45;color:var(--muted);margin:8px 0}.draw-status{font-size:11px;font-weight:800;background:#eef4f0;border-radius:8px;padding:7px 8px;margin-top:8px}.draw-status.warn{background:#fff0d2;color:#855f14}.draw-input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-top:8px}

<body><div class="app"><aside class="sidebar"><div class="brand"><img src="/acrefit-logo-light.svg" alt="AcreFit" style="height:42px;width:auto;max-width:195px;display:block"></div><div class="subbrand">Field Intelligence & Seed Sales Platform</div><nav><a href="index.html">Dashboard</a><a href="prospects.html" class="active">Prospect Intelligence</a><a href="farmers.html">Farmer & Fields</a><a href="field-analysis.html">Field Analysis</a><a href="whole-farm-plan.html">Whole-Farm Plan</a><a href="genetics.html">Seed Genetics</a><a href="data-hub.html">Farm Data Hub</a></nav><div class="side-card"><b>$0 mapping stack</b><br><br>MapLibre GL JS<br>USGS National Map imagery<br>USDA NRCS SSURGO soils<br><br>No Google/Mapbox key required for this build.</div></aside><main class="main"><div id="content"><div class="card">Loading prospect…</div></div></main></div>

<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pageParams=new URLSearchParams(location.search);const id=pageParams.get('id');const onboard=pageParams.get('onboard');const onboardPractice=pageParams.get('practice')||'NIRR';let prospect=null,planYear=2027,plans=[],map=null,selectedFieldId=null,currentBase='imagery';
let drawMode=false,drawCoords=[],drawAreaAcres=0,drawFeature=null,drawTool='free',pivotCenter=null,editedFeature=null,cutCoords=[],appliedCuts=[],baseFeature=null,editingFieldId=null,aphData={matches:[],fields:[]},aphAuto={suggestions:[]},productionProfile={fields:[],aph_matching:{total_units:0,confirmed_units:0}};
async function api(path,o={}){const r=await fetch(path,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
async function loadPlans(){const r=await api('/api/farms/'+prospect.farm_id+'/crop-plans?crop_year='+planYear);plans=r.fields||[]}
function cropCell(f){const crop=f.crop||'',source=String(f.source||'');let sourceText='';if(source==='mapped_soi_rotation')sourceText=' • Auto from Map-Based SOI rotation';else if(source==='manual')sourceText=' • Manual override';else if(source==='rotation')sourceText=' • Rotation';return `<div class="cropBtns"><button class="btn small ${crop==='CORN'?'':'secondary'}" onclick="setCrop(${f.field_id},'CORN')">Corn</button><button class="btn small ${crop==='SOYBEANS'?'':'secondary'}" onclick="setCrop(${f.field_id},'SOYBEANS')">Soy</button><button class="btn small secondary" onclick="setCrop(${f.field_id},null)">Clear</button><button class="btn small secondary" onclick="rotateOne(${f.field_id})">Rotate</button></div><div class="muted" style="margin-top:5px">${crop?esc(crop):'Unassigned'}${sourceText}${f.selected_seed_name?' • Seed: '+esc(f.selected_seed_name):''}</div>`}
function topDistribution(obj){const entries=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]);return entries.length?entries[0][0]:'—'}


function aphCandidateHtml(matchId,candidate,primary=false){
  if(!candidate)return '';
  const names=(candidate.field_names||[]).map(esc).join(' + ');
  const ids=(candidate.field_ids||[]).map(Number);
  const aphAc=Number(candidate.aph_acres||0),sel=Number(candidate.selected_acres||0),diff=sel-aphAc;
  const namePct=Math.round(Number(candidate.name_similarity||0)*100);
  const signals=[];
  if(namePct)signals.push(namePct+'% name');
  signals.push((diff>=0?'+':'')+diff.toFixed(2)+' ac');
  return '<div style="border:1px solid '+(primary?'#9fcbb0':'var(--line)')+';background:'+(primary?'#f3faf5':'#fff')+';border-radius:10px;padding:10px;margin-top:7px">'+
    '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b>'+names+'</b><div class="muted" style="font-size:11px;margin-top:3px">'+sel.toFixed(2)+' mapped ac • '+signals.join(' • ')+'</div></div>'+
    '<div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end"><button class="btn small secondary" onclick=\'focusAPHFields('+JSON.stringify(ids)+','+matchId+')\'>Map + SOI</button><button class="btn small" onclick=\'confirmAPHSuggestion('+matchId+','+JSON.stringify(ids)+',this)\'>'+(primary?'Confirm':'Use')+'</button></div></div>'+
    (candidate.reason?'<div class="muted" style="font-size:11px;margin-top:5px">'+esc(candidate.reason)+'</div>':'')+
  '</div>';
}
function aphMatchTable(){
  const matches=aphData.matches||[],fields=aphData.fields||[],autoMap={};
  (aphAuto.suggestions||[]).forEach(x=>autoMap[x.match_id]=x);
  if(!matches.length)return '<div class="muted">No APH uploaded yet. Map the farm first, then upload APH here.</div>';
  const confirmed=matches.filter(m=>m.match_status==='confirmed').length;
  const high=(aphAuto.suggestions||[]).filter(x=>x.confidence==='high'&&!matches.find(m=>m.id===x.match_id&&m.match_status==='confirmed')).length;
  const medium=(aphAuto.suggestions||[]).filter(x=>x.confidence==='medium'&&!matches.find(m=>m.id===x.match_id&&m.match_status==='confirmed')).length;
  const review=matches.length-confirmed-high-medium;
  const ordered=[...matches].sort((a,b)=>{
    const ar=a.match_status==='confirmed'?2:((autoMap[a.id]||{}).confidence==='high'?0:1);
    const br=b.match_status==='confirmed'?2:((autoMap[b.id]||{}).confidence==='high'?0:1);
    return ar-br||String(a.unit_key||'').localeCompare(String(b.unit_key||''));
  });
  return '<div class="grid" style="grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px;margin-bottom:12px">'+
    '<div class="soil-cell"><span>APH units</span><b style="font-size:20px">'+matches.length+'</b></div>'+
    '<div class="soil-cell"><span>Confirmed</span><b style="font-size:20px;color:var(--green)">'+confirmed+'</b></div>'+
    '<div class="soil-cell"><span>1-click ready</span><b style="font-size:20px">'+high+'</b></div>'+
    '<div class="soil-cell"><span>Needs review</span><b style="font-size:20px">'+(medium+review)+'</b></div></div>'+
    '<div class="muted" style="font-size:12px;margin-bottom:10px">AcreFit puts the most likely management-field group first. Confirm the obvious ones in one click; only use manual field picking for true exceptions. Confirmed names are remembered for future APH uploads.</div>'+
    ordered.map(m=>{
      const md=m.metadata||{},a=autoMap[m.id]||{},suggestion=a.suggestion||null,existing=(m.field_ids||[]).map(Number),aphAc=Number(md.aph_acres||0);
      const selectedNames=fields.filter(f=>existing.includes(Number(f.id))).map(f=>f.name);
      const badge=m.match_status==='confirmed'?'<span class="status ready">Confirmed</span>':a.confidence==='high'?'<span class="status ready">High confidence</span>':a.confidence==='medium'?'<span class="status pending">Medium</span>':'<span class="status pending">Review</span>';
      const alternatives=(a.alternatives||[]).filter(x=>!suggestion||JSON.stringify(x.field_ids)!==JSON.stringify(suggestion.field_ids)).slice(0,3);
      const manualChecks=fields.map(f=>'<label style="display:flex;align-items:center;gap:6px;padding:3px 0"><input class="aph-field-check-'+m.id+'" type="checkbox" value="'+f.id+'" data-acres="'+Number(f.acres||0)+'" '+(existing.includes(Number(f.id))?'checked':'')+' onchange="updateAPHSelectedTotal('+m.id+','+aphAc+')"><span>'+esc(f.name)+' — '+Number(f.acres||0).toFixed(2)+' ac</span></label>').join('');
      return '<div style="border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0;background:#fff">'+
        '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><b>'+esc(m.unit_key)+'</b><div class="muted" style="font-size:12px">'+esc(md.crop||'—')+' • '+esc(md.practice||'—')+' • '+(aphAc?aphAc.toFixed(2)+' APH ac':'acres unavailable')+(md.farm_name?' • '+esc(md.farm_name):'')+'</div></div>'+badge+'</div>'+
        (m.match_status==='confirmed'
          ? '<div style="margin-top:8px"><b style="font-size:12px">Attached to:</b> '+(selectedNames.length?selectedNames.map(x=>'<span class="tag">'+esc(x)+'</span>').join(''):'<span class="muted">No fields</span>')+' <button class="btn small secondary" onclick=\'focusAPHFields('+JSON.stringify(existing)+','+m.id+')\'>View</button></div>'
          : (suggestion?'<div style="margin-top:8px;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted)">Best suggestion</div>'+aphCandidateHtml(m.id,suggestion,true):'<div class="callout warn" style="margin-top:8px">No strong automatic suggestion. Review likely groups below.</div>'))+
        (m.match_status!=='confirmed'&&alternatives.length?'<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;font-weight:750">Other likely groups</summary>'+alternatives.map(x=>aphCandidateHtml(m.id,x,false)).join('')+'</details>':'')+
        '<details style="margin-top:9px"><summary style="cursor:pointer;font-size:12px;font-weight:750">'+(m.match_status==='confirmed'?'Change mapping':'Manual field picker')+'</summary><div style="max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:7px">'+manualChecks+'</div><div id="aph-total-'+m.id+'" class="muted" style="margin-top:6px;font-size:12px"><b>'+Number(m.selected_acres||0).toFixed(2)+' / '+(aphAc?aphAc.toFixed(2):'—')+' ac selected</b></div><button class="btn small" style="margin-top:7px" onclick="confirmAPHMatch('+m.id+')">Save manual mapping</button></details>'+
      '</div>';
    }).join('');
}
function updateAPHSelectedTotal(matchId,aphAcres){
  const boxes=[...document.querySelectorAll('.aph-field-check-'+matchId+':checked')];
  const total=boxes.reduce((s,b)=>s+Number(b.dataset.acres||0),0),diff=total-Number(aphAcres||0),el=document.getElementById('aph-total-'+matchId);
  if(el)el.innerHTML='<b>'+total.toFixed(2)+' / '+Number(aphAcres||0).toFixed(2)+' ac selected</b> • variance '+(diff>=0?'+':'')+diff.toFixed(2)+' ac';
}
async function confirmAPHSuggestion(matchId,fieldIds,btn){
  if(!fieldIds||!fieldIds.length)return;
  try{
    if(btn){btn.disabled=true;btn.textContent='Saving…'}
    await api('/api/aph-matches/'+matchId+'/confirm',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({field_ids:fieldIds})});
    await loadAPHData();render();
  }catch(e){alert(e.message);if(btn){btn.disabled=false;btn.textContent='Confirm'}}
}
async function focusAPHFields(fieldIds,matchId=null){
  const wanted=new Set((fieldIds||[]).map(Number)),soil=((prospect.soil_status||{}).fields||[]).filter(x=>wanted.has(Number(x.field_id))&&x.boundary_geojson);
  if(!soil.length)return alert('Exact mapped boundary is not available for that suggested group.');
  if(!map||!map.isStyleLoaded())return alert('Map is still loading.');
  let ref=null;
  if(matchId!=null){
    try{const review=await api('/api/aph-matches/'+matchId+'/review-reference');ref=review.reference_geojson||null}catch{}
  }
  const src=map.getSource('aph-review-reference');
  if(src)src.setData({type:'FeatureCollection',features:ref?[{type:'Feature',properties:{match_id:matchId},geometry:ref}]:[]});
  const b=new maplibregl.LngLatBounds();soil.forEach(x=>boundsFromGeometry(x.boundary_geojson,b));if(ref)boundsFromGeometry(ref,b);
  if(!b.isEmpty())map.fitBounds(b,{padding:70,maxZoom:17,duration:500});
  selectedFieldId=Number(soil[0].field_id);document.getElementById('map')?.scrollIntoView({behavior:'smooth',block:'center'});
}
function productionProfileHtml(){
  const fs=productionProfile.fields||[];
  if(!fs.some(f=>(f.years||[]).length))return '<div class="muted">APH history will appear here after units are matched to mapped fields.</div>';
  return fs.filter(f=>(f.years||[]).length).map(f=>'<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:12px"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>'+esc(f.name)+'</b><div class="muted">'+Number(f.acres||0).toFixed(1)+' ac • '+esc(f.dominant_muname||'SSURGO soil')+'</div></div><div><span class="tag">'+(f.production_summary?.year_count||0)+' APH years</span>'+(f.production_summary?.yield_stability_score!=null?'<span class="tag">Stability '+f.production_summary.yield_stability_score+'/100</span>':'')+'</div></div><div style="overflow:auto;margin-top:8px"><table class="table"><thead><tr><th>Year</th><th>Crop</th><th>Yield</th><th>Rain Apr–Oct</th><th>Rain Jun–Aug</th><th>95° Days</th><th>GDD</th><th>ENSO</th></tr></thead><tbody>'+(f.years||[]).map(y=>{const e=y.environment||{},m=e.metadata||{},roni=m.roni_growing_season,oni=m.oni_growing_season;return '<tr><td>'+y.crop_year+'</td><td>'+esc(y.crop||'—')+'</td><td><b>'+(y.yield_value!=null?Number(y.yield_value).toFixed(1):'—')+'</b></td><td>'+(e.precipitation_in!=null?Number(e.precipitation_in).toFixed(1)+' in':'Pending')+'</td><td>'+(m.jun_aug_precipitation_in!=null?Number(m.jun_aug_precipitation_in).toFixed(1)+' in':'—')+'</td><td>'+(e.heat_days_95??'—')+'</td><td>'+(e.gdd_base50!=null?Number(e.gdd_base50).toLocaleString():'—')+'</td><td><b>'+esc(e.enso_phase||'Pending')+'</b>'+(roni!=null?'<br><span class="muted">RONI '+Number(roni).toFixed(2)+(oni!=null?' • ONI '+Number(oni).toFixed(2):'')+'</span>':'')+'</td></tr>'}).join('')+'</tbody></table></div></div>').join('');
}
function render(){drawMode=false;drawCoords=[];drawAreaAcres=0;drawFeature=null;const p=prospect,c=p.farm_context||{},farm=c.farm||{},fields=c.fields||[],soilRows=((p.soil_status||{}).fields)||[],soilBy={};soilRows.forEach(x=>soilBy[x.field_id]=x);const ready=soilRows.filter(x=>x.soil_status).length;const mapped=soilRows.filter(x=>x.boundary_geojson).length;const confirmable=soilRows.filter(x=>!x.boundary_geojson&&(x.metadata_json||{}).reference_boundary_geojson).length;const counties=[...new Set(fields.map(f=>f.county).filter(Boolean))];const planBy={};plans.forEach(x=>planBy[x.field_id]=x);document.getElementById('content').innerHTML=`
<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div><a href="prospects.html" class="muted" style="text-decoration:none">← Prospects</a><h1 style="margin:4px 0">${esc(p.prospect_name)}</h1><div class="muted">${counties.map(esc).join(', ')||'Location pending'} • AcreFit field intelligence workspace</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="whole-farm-plan.html?id=${p.id}&year=${planYear}" style="text-decoration:none">Build / Print Farmer Plan</a><a class="btn secondary" href="genetics.html" style="text-decoration:none">Seed Genetics</a></div></div>

<div class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:.06em">FIELD IDENTITY → EXACT BOUNDARY → SOILS → GENETICS</div><h2 style="margin:7px 0">Mapped SOI identifies the field. Exact MBAR/GIS or confirmed satellite drawing defines the field.</h2><p>SOI raster shapes are shown only as reference guides. They never drive SSURGO or final seed placement until an exact boundary is confirmed. Farm/tract/field identity, acres and IRR/NIRR remain available for APH matching immediately.</p></div>

function fieldCard(s,plan){const drainage=topDistribution(s.drainage_summary);const crop=(plan&&plan.crop)||'';const meta=s.metadata_json||{},ref=meta.reference_boundary_geojson||null,isSplit=!!meta.split_created||/\snew(?:\s\d+)?$/i.test(String(s.name||''));const geometryText=s.boundary_geojson?'Exact boundary':(ref?'SOI reference — exact boundary needed':'Boundary pending');const analyze='<a class="btn small" style="text-decoration:none" onclick="event.stopPropagation()" href="/field-analysis.html?id='+id+'&field='+s.field_id+'&year='+planYear+'">Analyze Field →</a>';const actions=s.boundary_geojson?'<div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">'+analyze+'<button class="btn small secondary" onclick="event.stopPropagation();editExistingField('+s.field_id+')">✎ Edit / Cut Field</button>'+(isSplit?'<button class="btn small outline" onclick="event.stopPropagation();deleteSplitField('+s.field_id+',\''+esc(s.name).replace(/&#39;/g,"\\'")+'\')">Delete Field</button>':'')+'</div>':(ref?'<div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">'+analyze+'<button class="btn small" onclick="event.stopPropagation();confirmSOIBoundary('+s.field_id+',this)">Confirm This Boundary</button><button class="btn small secondary" onclick="event.stopPropagation();mapExactFromSOI('+s.field_id+')">Edit / Redraw Boundary</button></div>':'<div style="margin-top:9px">'+analyze+'</div>');return `<div id="fc-${s.field_id}" class="field-card" onclick="selectField(${s.field_id})"><div class="field-row"><b>${esc(s.name)}</b><b>${Number(s.acres||0).toLocaleString()} ac</b></div><div class="muted" style="font-size:12px;margin-top:3px">${crop?esc(crop):'Crop unassigned'} • ${geometryText}</div><div class="soil-grid"><div class="soil-cell"><span>Dominant soil</span><b>${esc(s.dominant_musym||'—')}</b></div><div class="soil-cell"><span>Drainage</span><b>${esc(drainage)}</b></div><div class="soil-cell"><span>AWC 0–150cm</span><b>${s.weighted_aws150_cm!=null?Number(s.weighted_aws150_cm).toFixed(1)+' cm':'—'}</b></div><div class="soil-cell"><span>Slope</span><b>${s.weighted_slope_pct!=null?Number(s.weighted_slope_pct).toFixed(1)+'%':'—'}</b></div></div>${actions}</div>`}

async function deleteSplitField(fieldId,name){
  if(!confirm('Delete '+name+' and restore its acreage back to the original field?'))return;
  try{
    const r=await api('/api/fields/'+fieldId,{method:'DELETE'});
    prospect=await api('/api/prospects/'+id);await loadPlans();render();
    if(r.soil_warning)alert(r.soil_warning);
  }catch(e){alert(e.message)}
}
async function deleteSavedCut(fieldId,index){
  const s=((prospect.soil_status||{}).fields||[]).find(x=>Number(x.field_id)===Number(fieldId));
  const f=((prospect.farm_context||{}).fields||[]).find(x=>Number(x.id)===Number(fieldId));
  const edit=(s?.metadata_json||{}).boundary_edit||{};
  const baseGeom=edit.base_boundary_geojson;
  const cuts=[...(edit.cut_polygons||[])];
  if(!baseGeom||index<0||index>=cuts.length)return alert('This saved cut could not be found.');
  cuts.splice(index,1);
  let result={type:'Feature',properties:{kind:'field'},geometry:JSON.parse(JSON.stringify(baseGeom))};
  try{
    for(const g of cuts){
      const cut={type:'Feature',properties:{kind:'applied-cut'},geometry:g};
      const next=turf.difference(turf.featureCollection([result,cut]));
      if(next)result=next;
    }
    const acres=turf.area(result)/4046.8564224;
    await api('/api/fields/'+fieldId+'/boundary',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      name:f?.name||s.name||'Field',
      boundary_geojson:result.geometry,
      acres:Number(acres.toFixed(2)),
      irrigation:(f?.irrigation||'NIRR'),
      enrich_soils:true,
      base_boundary_geojson:baseGeom,
      cut_polygons:cuts
    })});
    document.querySelectorAll('.maplibregl-popup').forEach(x=>x.remove());
    prospect=await api('/api/prospects/'+id);await loadPlans();render();
  }catch(e){alert('Could not delete that cut: '+e.message)}
}
function initMap(soilRows,planBy){
  if(!document.getElementById('map')||typeof maplibregl==='undefined')return;
  if(map){map.remove();map=null}
  map=new maplibregl.Map({container:'map',center:[-96.2,39.75],zoom:7.2,style:{version:8,sources:{imagery:{type:'raster',tiles:['https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'USGS The National Map'},topo:{type:'raster',tiles:['https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'USGS The National Map'}},layers:[{id:'imagery',type:'raster',source:'imagery'},{id:'topo',type:'raster',source:'topo',layout:{visibility:'none'}}]}});
  map.addControl(new maplibregl.NavigationControl(),'top-right');
  map.on('load',()=>{
    const features=soilRows.filter(s=>s.boundary_geojson).map(s=>({type:'Feature',id:s.field_id,properties:{field_id:s.field_id,name:s.name,acres:Number(s.acres||0),crop:(planBy[s.field_id]||{}).crop||'',soil:s.dominant_muname||s.dominant_musym||'Soil pending'},geometry:s.boundary_geojson}));
    const refs=soilRows.filter(s=>!s.boundary_geojson&&(s.metadata_json||{}).reference_boundary_geojson).map(s=>({type:'Feature',id:s.field_id,properties:{field_id:s.field_id,name:s.name,acres:Number(s.acres||0)},geometry:(s.metadata_json||{}).reference_boundary_geojson}));
    const points=soilRows.filter(s=>!s.boundary_geojson&&!(s.metadata_json||{}).reference_boundary_geojson&&s.centroid_lon&&s.centroid_lat).map(s=>({type:'Feature',properties:{field_id:s.field_id,name:s.name,acres:Number(s.acres||0)},geometry:{type:'Point',coordinates:[Number(s.centroid_lon),Number(s.centroid_lat)]}}));
    const savedCuts=[];soilRows.forEach(s=>{const cuts=((s.metadata_json||{}).boundary_edit||{}).cut_polygons||[];cuts.forEach((g,i)=>savedCuts.push({type:'Feature',properties:{field_id:s.field_id,cut_index:i,name:s.name},geometry:g}))});
    map.addSource('fields',{type:'geojson',data:{type:'FeatureCollection',features}});
    map.addLayer({id:'field-fill',type:'fill',source:'fields',paint:{'fill-color':['match',['get','crop'],'CORN','#e8b948','SOYBEANS','#51a66b','#d9e0da'],'fill-opacity':.30}});
    map.addLayer({id:'field-line',type:'line',source:'fields',paint:{'line-color':'#ffffff','line-width':2.4}});
    map.addLayer({id:'field-label',type:'symbol',source:'fields',layout:{'text-field':['concat',['get','name'],'\n',['to-string',['get','acres']],' ac'],'text-size':12,'text-font':['Open Sans Regular'],'text-allow-overlap':false},paint:{'text-color':'#fff','text-halo-color':'#17331f','text-halo-width':1.5}});
    map.addSource('soi-reference',{type:'geojson',data:{type:'FeatureCollection',features:refs}});
    map.addLayer({id:'soi-reference-fill',type:'fill',source:'soi-reference',paint:{'fill-color':'#9b6bb5','fill-opacity':.10}});
    map.addLayer({id:'soi-reference-line',type:'line',source:'soi-reference',paint:{'line-color':'#9b6bb5','line-width':2.2,'line-dasharray':[3,2]}});
    map.addSource('aph-review-reference',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    map.addLayer({id:'aph-review-reference-fill',type:'fill',source:'aph-review-reference',paint:{'fill-color':'#7b4da2','fill-opacity':.12}});
    map.addLayer({id:'aph-review-reference-line',type:'line',source:'aph-review-reference',paint:{'line-color':'#c892e0','line-width':3.2,'line-dasharray':[2,1]}});
    map.addSource('saved-cuts',{type:'geojson',data:{type:'FeatureCollection',features:savedCuts}});
    map.addLayer({id:'saved-cut-fill',type:'fill',source:'saved-cuts',paint:{'fill-color':'#c94934','fill-opacity':.20}});
    map.addLayer({id:'saved-cut-line',type:'line',source:'saved-cuts',paint:{'line-color':'#c94934','line-width':2,'line-dasharray':[2,2]}});
    map.addSource('field-points',{type:'geojson',data:{type:'FeatureCollection',features:points}});
    map.addLayer({id:'field-points',type:'circle',source:'field-points',paint:{'circle-radius':7,'circle-color':'#ffffff','circle-stroke-color':'#1f6f43','circle-stroke-width':3}});
    ensureDrawLayers();
    map.on('click','soi-reference-fill',e=>{if(drawMode)return;const f=e.features&&e.features[0];if(!f)return;const fid=Number(f.properties.field_id);selectField(fid);new maplibregl.Popup().setLngLat(e.lngLat).setHTML('<b>'+esc(f.properties.name)+'</b><br>'+Number(f.properties.acres).toLocaleString()+' ac<br><span style="color:#7c4c93">Mapped SOI reference only</span><br><button class="btn small" style="margin-top:7px" onclick="mapExactFromSOI('+fid+')">Map Exact Boundary</button>').addTo(map)});
    map.on('click','saved-cut-fill',e=>{if(drawMode)return;const sf=e.features&&e.features[0];if(!sf)return;const fieldId=Number(sf.properties.field_id),idx=Number(sf.properties.cut_index);new maplibregl.Popup({closeButton:true}).setLngLat(e.lngLat).setHTML('<b>'+esc(sf.properties.name||'Field')+' — Cut section</b><br><button class="btn small" style="margin-top:7px" onclick="deleteSavedCut('+fieldId+','+idx+')">Delete Cut</button>').addTo(map)});
    map.on('click','field-fill',e=>{if(drawMode)return;const hits=map.queryRenderedFeatures(e.point,{layers:['saved-cut-fill']});if(hits.length)return;const f=e.features&&e.features[0];if(!f)return;selectField(Number(f.properties.field_id));new maplibregl.Popup().setLngLat(e.lngLat).setHTML('<b>'+esc(f.properties.name)+'</b><br>'+Number(f.properties.acres).toLocaleString()+' ac<br>'+esc(f.properties.crop||'Crop unassigned')+'<br>'+esc(f.properties.soil)).addTo(map)});
    map.on('click','field-points',e=>{if(drawMode)return;const f=e.features&&e.features[0];if(f)selectField(Number(f.properties.field_id))});
    ['soi-reference-fill','saved-cut-fill','field-fill'].forEach(layer=>{map.on('mouseenter',layer,()=>{if(!drawMode)map.getCanvas().style.cursor='pointer'});map.on('mouseleave',layer,()=>{if(!drawMode)map.getCanvas().style.cursor=''})});
    fitFarm()
  })

async function saveDrawField(){
  const name=(document.getElementById('drawFieldName')?.value||'').trim();
  if(!name)return alert('Give the field a name first.');
  drawGeoJSON();
  if(!drawFeature||drawAreaAcres<=0)return alert('Draw or edit a valid field boundary first.');
  const b=document.getElementById('saveDrawBtn'),s=document.getElementById('drawStatus');
  b.disabled=true;s.className='draw-status';
  s.innerHTML='<span class="spinner" style="border-color:rgba(31,111,67,.25);border-top-color:#1f6f43"></span> '+(appliedCuts.length?'Saving split fields and refreshing soils…':(editingFieldId?'Updating boundary and refreshing SSURGO soils…':'Saving field and pulling SSURGO soils…'));
  try{
    const irrigation=(document.getElementById('drawIrrigation')?.value||'NIRR');
    const payload={name,boundary_geojson:drawFeature.geometry,acres:Number(drawAreaAcres.toFixed(2)),irrigation,enrich_soils:true,base_boundary_geojson:drawFeature.geometry,cut_polygons:[]};
    let r;
    if(editingFieldId){
      r=await api('/api/fields/'+editingFieldId+'/boundary',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    }else{
      r=await api('/api/farms/'+prospect.farm_id+'/fields/manual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      editingFieldId=Number(r.field?.id||0)||null;
    }

    const existingNames=new Set(((prospect.farm_context||{}).fields||[]).map(f=>String(f.name||'').toLowerCase()));
    existingNames.add(name.toLowerCase());
    const created=[],soilWarnings=[];
    if(r.soil_warning)soilWarnings.push(name+': '+r.soil_warning);
    for(let i=0;i<appliedCuts.length;i++){
      let newName=name+' new',n=2;
      while(existingNames.has(newName.toLowerCase()))newName=name+' new '+(n++);
      existingNames.add(newName.toLowerCase());
      const cut=appliedCuts[i];
      const cutAcres=turf.area(cut)/4046.8564224;
      const child=await api('/api/farms/'+prospect.farm_id+'/fields/manual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        name:newName,
        boundary_geojson:cut.geometry,
        acres:Number(cutAcres.toFixed(2)),
        irrigation,
        enrich_soils:true,
        base_boundary_geojson:cut.geometry,
        cut_polygons:[],
        split_parent_field_id:editingFieldId
      })});
      created.push(child.field);
      if(child.soil_warning)soilWarnings.push(newName+': '+child.soil_warning);
    }

    s.textContent=(created.length?('Saved split: '+Number(r.field?.acres||drawAreaAcres).toFixed(2)+' ac remains in '+name+'; '+created.map(x=>x.name+' ('+Number(x.acres||0).toFixed(2)+' ac)').join(', ')+' created.'):(editingFieldId?'Updated ':'Saved ')+(r.field?.acres?Number(r.field.acres).toFixed(2):drawAreaAcres.toFixed(2))+' acres.')+(soilWarnings.length?' '+soilWarnings.join(' '):' SSURGO refreshed.');
    drawMode=false;editingFieldId=null;appliedCuts=[];baseFeature=null;stopDrawListener();
    prospect=await api('/api/prospects/'+id);await loadPlans();render();
  }catch(e){s.className='draw-status warn';s.textContent=e.message;b.disabled=false}
}

}
async function setCrop(fieldId,crop){await api('/api/fields/'+fieldId+'/crop',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({crop_year:planYear,crop})});await loadPlans();render()}
async function rotateOne(fieldId){try{await api('/api/fields/'+fieldId+'/rotate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from_year:planYear-1,to_year:planYear})});await loadPlans();render()}catch(e){alert(e.message)}}
async function rotateAll(){const r=await api('/api/farms/'+prospect.farm_id+'/rotate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from_year:planYear-1,to_year:planYear})});await loadPlans();render();if(r.skipped?.length)alert(r.rotated+' fields rotated. '+r.skipped.length+' need manual crop assignment.')}

async function loadAPHData(){try{[aphData,aphAuto,productionProfile]=await Promise.all([api('/api/farms/'+prospect.farm_id+'/aph-matches'),api('/api/farms/'+prospect.farm_id+'/aph-auto-match'),api('/api/farms/'+prospect.farm_id+'/production-profile')])}catch(e){aphData={matches:[],fields:[]};aphAuto={suggestions:[]};productionProfile={fields:[],aph_matching:{total_units:0,confirmed_units:0}}}}
async function refreshAPHMatchSuggestions(btn){try{if(btn){btn.disabled=true;btn.textContent='Matching farm…'}aphAuto=await api('/api/farms/'+prospect.farm_id+'/aph-auto-match');render()}catch(e){alert(e.message)}}
async function confirmAutoAPH(includeMedium,btn){const label=includeMedium?'high + medium':'high-confidence';if(!confirm('Confirm all '+label+' APH matches? You can still edit individual units afterward.'))return;try{if(btn){btn.disabled=true;btn.textContent='Confirming…'}const r=await api('/api/farms/'+prospect.farm_id+'/aph-auto-match/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({include_medium:includeMedium})});await loadAPHData();render();alert(r.accepted_count+' APH unit groups confirmed. '+r.skipped.length+' left for review.')}catch(e){alert(e.message)}}
async function uploadAPH(){const f=document.getElementById('aphFile')?.files?.[0],m=document.getElementById('aphMsg'),b=document.getElementById('aphBtn');if(!f)return alert('Choose an APH PDF.');if(!(prospect.farm_context?.fields||[]).length)return alert('Map at least one field before uploading APH.');m.style.display='block';m.className='callout';m.textContent='Uploading APH securely…';b.disabled=true;try{const signed=await api('/api/uploads/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,content_type:f.type||'application/pdf'})});const fd=new FormData();fd.append('cacheControl','3600');fd.append('',f);const up=await fetch(signed.signed_url,{method:'PUT',body:fd});if(!up.ok)throw new Error('Secure APH upload failed (HTTP '+up.status+')');m.textContent='Parsing APH years and building field-match suggestions…';const r=await api('/api/uploads/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({object_path:signed.object_path,original_name:f.name,document_type:'APH',target_farm_id:prospect.farm_id,reprocess:false})});await loadAPHData();render();setTimeout(()=>{const mm=document.getElementById('aphMsg');if(mm){mm.style.display='block';mm.innerHTML='<b>APH parsed.</b> '+(r.aph_units_parsed||0)+' units and '+(r.crop_records_created||0)+' production-year records loaded. Confirm the matches below.'}},0)}catch(e){m.className='callout warn';m.innerHTML='<b>APH import needs attention.</b> '+esc(e.message)}finally{b.disabled=false}}
async function confirmAPHMatch(matchId){const fieldIds=[...document.querySelectorAll('.aph-field-check-'+matchId+':checked')].map(x=>Number(x.value)).filter(Boolean);if(!fieldIds.length)return alert('Select at least one mapped field for this APH unit.');try{await api('/api/aph-matches/'+matchId+'/confirm',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({field_ids:fieldIds})});await loadAPHData();render()}catch(e){alert(e.message)}}
async function refreshHistoricalWeather(btn){try{if(btn){btn.disabled=true;btn.textContent='Loading rainfall + ENSO…'}const r=await api('/api/farms/'+prospect.farm_id+'/history/climate',{method:'POST'});await loadAPHData();render();alert('Climate history updated: '+(r.years_written||0)+' field-years across '+(r.field_count||0)+' fields using '+(r.weather_api_calls||0)+' weather calls.')}catch(e){alert(e.message)}}
async function uploadMapDocument(){const f=document.getElementById('mbarFile').files[0],m=document.getElementById('mbarMsg'),b=document.getElementById('mbarBtn'),selectedType=document.getElementById('mapDocType').value;if(!f)return alert('Choose a mapped field document.');m.style.display='block';m.className='callout';m.textContent='Preparing secure upload…';b.disabled=true;try{const signed=await api('/api/uploads/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,content_type:f.type||'application/octet-stream'})});m.textContent='Uploading document directly to secure storage…';const uploadBody=new FormData();uploadBody.append('cacheControl','3600');uploadBody.append('',f);const up=await fetch(signed.signed_url,{method:'PUT',body:uploadBody});if(!up.ok){let txt='';try{txt=await up.text()}catch{}throw new Error('Secure upload failed (HTTP '+up.status+') '+txt.slice(0,140))}m.textContent='Upload complete. Reading field identity, unit structure, and map references…';const docType=selectedType==='AUTO'?null:selectedType;const r=await api('/api/uploads/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({object_path:signed.object_path,original_name:f.name,document_type:docType,target_farm_id:prospect.farm_id,reprocess:false})});m.innerHTML='<b>Field source processed.</b> '+((r.soi_identities_stored||0)>0?((r.soi_identities_stored||0)+' SOI field identities stored — your '+((prospect.farm_context?.fields||[]).length)+' exact AcreFit fields were left untouched.'):(r.fields_created_or_updated||0)+' fields created/updated.')+' '+((r.warnings||[]).map(esc).join(' ')||'');prospect=await api('/api/prospects/'+id);if(String(r.document_type||'').toUpperCase()==='SOI')await applySOICropBase(null,true);else await loadPlans();await loadAPHData();render()}catch(e){m.className='callout warn';m.innerHTML='<b>Field import needs mapping work.</b> '+esc(e.message)}finally{b.disabled=false}}
async function mapSoils(){try{await api('/api/prospects/'+id+'/soils/enrich?force=false',{method:'POST'});prospect=await api('/api/prospects/'+id);render()}catch(e){alert(e.message)}}
load();
</script><script src="/activity.js"></script></body></html>
